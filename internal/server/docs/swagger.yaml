  api.SearchHit:
    properties:
      data:
        type: string
      dataset:
        type: string
      objectId:
        type: string
      recordId:
        type: string
      scope:
        type: string
      score:
        type: number
    type: object
  api.SearchRequest:
    properties:
      exclude:
        items:
          type: string
        type: array
      limit:
        description: Limit caps returned hits. Default 10, max 100.
        type: integer
      mode:
        description: |-
          Mode is hybrid (default), fts, or vector. Vector requires an
          embedder configured on the server.
        type: string
      query:
        description: Query is the search text. Required.
        type: string
      require:
        description: |-
          Require / Exclude are extra must / must-not terms for the FTS leg
          ($require / $exclude) — a hit must contain every Require term and no
          Exclude term. Each term may be a "phrase" or prefix*. Applied to the
          lexical leg only; ignored in pure vector mode.
        items:
          type: string
        type: array
      scopes:
        description: |-
          Scopes restricts results to the given index scopes (basic, chat,
          agent). Empty = all scopes.
        items:
          type: string
        type: array
    type: object
  api.SearchResponse:
    properties:
      hits:
        items:
          $ref: '#/definitions/api.SearchHit'
        type: array
      mode:
        type: string
      vectorStatus:
        description: |-
          VectorStatus: used | unavailable | disabled | skipped — whether
          semantic recall participated in this response and, if not, why.
        type: string
    type: object
