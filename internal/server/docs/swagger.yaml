          uniqueItems: false
      type: object
    api.ACLDeclineRequest:
      properties:
        identity:
          type: string
      type: object
    api.ACLOwnershipRequest:
      properties:
        newOwner:
          type: string
        oldOwnerPerm:
          type: string
      type: object
    api.ACLPermissionChange:
