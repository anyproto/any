    api.HistoryViewDataset:
      properties:
        dataset:
          type: string
        records:
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
      type: object
    api.HistoryViewResponse:
      properties:
        datasets:
          items:
            $ref: '#/components/schemas/api.HistoryViewDataset'
          type: array
          uniqueItems: false
        version:
          type: string
      type: object
    api.IdentitiesListResponse:
      properties:
        identities:
          items:
            $ref: '#/components/schemas/api.IdentityInfo'
          type: array
          uniqueItems: false
      type: object
    api.IdentityInfo:
      properties:
        description:
          type: string
        iconCid:
          type: string
        identity:
          type: string
        name:
          type: string
        spaceIds:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.InviteCreateResponse:
      properties:
        inviteToken:
          type: string
        spaceId:
          type: string
      type: object
    api.InviteInfo:
      properties:
        inviteToken:
          description: |-
            InviteToken is the same share token POST /invites returned at
            mint time, recovered from the minting account's synced custody.
            Present only on that account's devices — other members (any
            role) never held the private key and get no token. Also omitted
            for invites minted before custody shipped (regenerate once to
            make the token durable) and for custody gone stale (invite
            replaced or revoked on another device).
          type: string
        permission:
          type: string
        recordId:
          type: string
      type: object
    api.InvitesListResponse:
      properties:
        invites:
          items:
            $ref: '#/components/schemas/api.InviteInfo'
          type: array
          uniqueItems: false
      type: object
    api.JoinRequest:
      properties:
        description:
          type: string
        iconCid:
          type: string
        identity:
          type: string
        name:
          type: string
        recordId:
          type: string
      type: object
    api.JoinRequestsResponse:
      properties:
        requests:
          items:
            $ref: '#/components/schemas/api.JoinRequest'
          type: array
          uniqueItems: false
      type: object
    api.LLMStats:
      properties:
