  api.P2PStatusResponse:
    properties:
      enabled:
        type: boolean
      listenerStarted:
        type: boolean
      peerId:
        description: |-
          PeerId is THIS device's peer id. Devices of one account must
          each have a distinct peerId — devices sharing one cannot pair.
        type: string
      peers:
        items:
          $ref: '#/definitions/api.P2PPeerStatus'
        type: array
      port:
