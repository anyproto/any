            header and parts compose — {type, config} in the xFormat shape (v1
            slugs: page, tabs, chat, profile; open set, unknown renders as
            page). Both mutable via PATCH …/types/:typeId.
          type: integer
        xKey:
          description: |-
            XKey is the stable, caller-side programmatic key for the type
            (e.g. "agent_memory"). REQUIRED on create and unique per space: the
            server rejects an empty xKey (type.xkey_required) and one that
            collides with an existing type's xKey or id (type.xkey_conflict).
            Clients derive it as a slug of Name. It's the only human handle a
            type resolves by — the display Name is not a resolution key.
          type: string
      type: object
    api.TypesCreateResponse:
      properties:
        typeId:
          type: string
      type: object
    api.TypesListResponse:
      properties:
        types:
          items:
            $ref: '#/components/schemas/api.TypeInfo'
          type: array
          uniqueItems: false
      type: object
    api.UpsertRecord:
      properties:
        fields:
          additionalProperties: {}
          type: object
        id:
          type: string
      type: object
    api.UpsertRejection:
      properties:
        code:
          type: string
        id:
          type: string
        index:
          type: integer
        reason:
          type: string
      type: object
    api.UpsertRequest:
      properties:
        dataset:
          type: string
        objectId:
          type: string
        pageSize:
          description: PageSize caps records per emitted change. 0 = 500.
          type: integer
        records:
          items:
            $ref: '#/components/schemas/api.UpsertRecord'
          type: array
          uniqueItems: false
        traceIds:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.UpsertResult:
      properties:
        created:
          type: integer
        pages:
          items:
            $ref: '#/components/schemas/api.ModifyResult'
          type: array
          uniqueItems: false
        rejections:
          items:
            $ref: '#/components/schemas/api.UpsertRejection'
          type: array
          uniqueItems: false
        skipped:
          type: integer
        updated:
          type: integer
      type: object
