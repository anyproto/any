      cached:
        description: Cached reports a complete local copy (always true for inline).
        type: boolean
      durable:
        description: |-
          Durable reports a verified network-custody receipt (inline files
          are durable by construction). False right after attach is normal:
          backup runs in the background — watch /files/subscribe or re-GET.
        type: boolean
      fileId:
        type: string
      inline:
        description: Inline reports the inline tier (no rootCid, no backup needed).
        type: boolean
      mime:
        type: string
      name:
        type: string
      objectId:
        type: string
      rootCid:
        description: |-
          RootCid is the content address of the encrypted file. Empty for
          inline-tier files (bytes ride the CRDT row itself).
        type: string
      size:
        description: Size is the plaintext byte size.
        type: integer
      variant:
        type: string
      variantOf:
        type: string
    type: object
