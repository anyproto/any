        mailboxCapacity:
          description: |-
            MailboxCapacity (subscribe only) sizes the event mailbox before
            the stream closes with reason "overflow". Default 256, min 16.
          type: integer
        offset:
          description: Offset skips past the first N matches of the sorted result.
          type: integer
        projection:
          additionalProperties: {}
          description: |-
            Projection is accepted but NOT IMPLEMENTED — records always ship
            their full form. See docs/07-roadmap.md § "Query Projection".
          type: object
        sort:
          description: |-
            Sort lists field paths, "-" prefix for descending (e.g.
            "-createdAt"). Required when limit > 0 on subscribe, so the
            window is well-defined.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
