        - $ref: '#/definitions/api.PropertyFormat'
        description: |-
          Format is the property's value-format annotation; absent for
          properties that never declared one.
      id:
        type: string
      items:
        $ref: '#/definitions/api.PropertyDef'
      kind:
        type: string
      meta:
        additionalProperties:
          type: string
        description: |-
          Meta is the opaque consumer flag map set at AddProperty time
          (e.g. meta["index"] = "<scope>" for the search indexer).
        type: object
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/api.PropertyDef'
        type: array
      required:
        items:
          type: string
        type: array
      scope:
        description: |-
          Scope is the property's write/sync class (synced / derived /
          account / local). Definitions written before scopes existed
          read back as "synced".
        type: string
      xKey:
        type: string
      xKind:
        type: string
    type: object
  api.PropertyFormat:
    properties:
      filter:
        description: |-
          Filter is a mongo-style condition object over candidate objects
          (e.g. {"type": {"$in": ["page"]}}); optional, links only.
        items:
          type: integer
        type: array
      type:
        description: Type is one of the FormatType* wire strings.
        type: string
      ui:
        description: |-
          UI is one of the FormatUI* wire strings; optional. links accepts
          any UI; date/datetime accept none.
        type: string
    type: object
  api.QueryResponse:
    properties:
      hasNext:
        type: boolean
      records:
        items:
          items:
            type: integer
          type: array
        type: array
      total:
