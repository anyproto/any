          type: string
        permission:
          type: string
      type: object
    api.ACLRemoveRequest:
      properties:
        identities:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          type: string
      type: object
    api.AccountMetadata:
      properties:
        description:
          type: string
        iconCid:
          type: string
        name:
          type: string
      type: object
    api.AccountResponse:
      properties:
        id:
          type: string
        metadata:
          $ref: '#/components/schemas/api.AccountMetadata'
      type: object
    api.AddDatasetFieldResponse:
      properties:
        fieldDefId:
          type: string
      type: object
    api.AddDatasetResponse:
      properties:
        datasetDefId:
          type: string
      type: object
    api.AddPropertyRequest:
      properties:
        description:
          type: string
        format:
          $ref: '#/components/schemas/api.PropertyFormat'
        kind:
          type: string
        meta:
          additionalProperties:
            type: string
          description: |-
            Meta is an opaque consumer flag map, stored verbatim on the
            property definition. meta["index"] = "<scope>" marks the property
            for the search indexer (docs/13-index.md).
          type: object
        name:
          type: string
        scope:
          description: |-
            Scope is the property's write/sync class: "synced" (default,
            everyone in the space), "account" (this account's devices only),
            or "local" (this device only, never synced). "derived" is
            reserved for built-ins and rejected. Pinned by the first write,
            like kind — changing a property's scope means defining a new
            property. Property VALUE writes auto-route by the declared scope
            (POST /v1/spaces/:spaceId/properties/:objectId/set/:typeId).
          type: string
        xKey:
          type: string
      type: object
    api.AddPropertyResponse:
      properties:
        propId:
          type: string
      type: object
    api.AgentBrainResponse:
      properties:
        objectId:
          type: string
      type: object
    api.AgentChunkCreateRequest:
      properties:
        fromAgent:
          type: string
        fromSeq:
          type: integer
        level:
          type: integer
        periodEnd:
          type: integer
        periodStart:
          type: integer
        seq:
          type: integer
        summary:
          type: string
        toSeq:
          type: integer
        unitsCovered:
          description: |-
            UnitsCovered counts the child units this chunk summarizes —
            turns for level 1, level-(N-1) chunks for level 2+ (hence
            "units", not "turns"). Optional. The dataset validator also
            accepts the legacy stored key `turnsCovered` so pre-rename
            records stay applyable on replay.
          type: integer
      type: object
    api.AgentMemoryCreateRequest:
      properties:
        body:
          type: string
        category:
          type: string
        chatId:
          type: string
        confidence:
          type: integer
        context:
          type: string
        edges:
          items:
            $ref: '#/components/schemas/api.Edge'
          type: array
          uniqueItems: false
        entities:
          items:
            type: string
          type: array
          uniqueItems: false
        fromAgent:
          type: string
        importance:
          type: integer
        keywords:
          items:
            type: string
          type: array
          uniqueItems: false
        provenance:
          $ref: '#/components/schemas/api.MemoryProvenance'
        salience:
          type: number
        source:
          description: |-
            Source names the producing pipeline ("extraction", "reflection",
            "user", …) — the machine-vs-user distinction. Free lowercase
            slug, create-only (not in the evolve allow-list).
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        validFrom:
          type: integer
      type: object
    api.AgentMemoryEvolveRequest:
      properties:
        accessCount:
          type: integer
        body:
          type: string
        confidence:
          type: integer
        context:
          type: string
        edges:
          items:
            $ref: '#/components/schemas/api.Edge'
          type: array
          uniqueItems: false
        importance:
          type: integer
        salience:
          type: number
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.AgentTurnAppendRequest:
      properties:
        effects:
          items:
            type: string
          type: array
          uniqueItems: false
        fromAgent:
          type: string
        interrupted:
          type: boolean
        llm:
          $ref: '#/components/schemas/api.LLMStats'
        messageIds:
          items:
            type: string
          type: array
          uniqueItems: false
        replies:
          items:
            type: string
          type: array
          uniqueItems: false
        seq:
          type: integer
        think:
          type: string
        traceRef:
          type: string
        userName:
          type: string
        userText:
          type: string
      type: object
    api.AggregateResponse:
      properties:
        plan:
          type: string
        records:
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
      type: object
    api.AuthAccount:
      properties:
        default:
          description: Default marks the legacy flat-layout wallet at the data-dir
            root.
          type: boolean
        id:
          description: |-
            Id is the StrKey account address ("A…"). Empty for a default
            root wallet whose id can't be derived without a passkey.
          type: string
      type: object
    api.AuthRequest:
      properties:
        accountId:
          description: AccountId selects an account that already has a local wallet.
          type: string
        index:
          description: |-
            Index is the account derivation index for Mnemonic. Omitted
            means 1, the `any` default; pass 0 explicitly to restore an
            anytype-derived (or pre-index-1 any) account.
          type: integer
        mnemonic:
          description: |-
            Mnemonic restores (or first-creates) the account derived from
            this BIP-39 phrase. The device key is always freshly generated.
          type: string
      type: object
    api.AuthResponse:
      properties:
        accountId:
          type: string
        created:
          description: |-
            Created is true when a new wallet file was written (fresh
            generation or first restore on this machine).
          type: boolean
        mnemonic:
          description: |-
            Mnemonic is returned exactly once: when the server generated a
            fresh account (no mnemonic/accountId in the request). The caller
            must surface it to the user for backup.
          type: string
      type: object
    api.AuthStatusResponse:
      properties:
        accountId:
          type: string
        accounts:
          items:
            $ref: '#/components/schemas/api.AuthAccount'
          type: array
          uniqueItems: false
        authorized:
          type: boolean
      type: object
    api.Backlink:
      properties:
        objectId:
          type: string
        propId:
          type: string
        typeId:
          type: string
      type: object
    api.BacklinksResponse:
      properties:
        backlinks:
          items:
            $ref: '#/components/schemas/api.Backlink'
          type: array
          uniqueItems: false
      type: object
    api.BlockCreateRequest:
      properties:
        nav:
          $ref: '#/components/schemas/api.BlockNav'
        style:
          additionalProperties: {}
          type: object
        text:
          type: string
        type:
          type: string
      type: object
    api.BlockNav:
      properties:
        parentId:
          type: string
        pos:
          type: string
      type: object
    api.BlockPatchRequest:
      properties:
        set:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
        unset:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.ChatAgentMeta:
      properties:
        debugLink:
          type: string
        done:
          type: boolean
        name:
          type: string
      type: object
    api.ChatAttachment:
      properties:
        link:
          type: string
        type:
          type: string
      type: object
    api.ChatEditRequest:
      properties:
        text:
          type: string
      type: object
    api.ChatSendRequest:
      properties:
        agent:
          $ref: '#/components/schemas/api.ChatAgentMeta'
        attachments:
          additionalProperties:
            $ref: '#/components/schemas/api.ChatAttachment'
          type: object
        replyToMessageId:
          type: string
        text:
          type: string
      type: object
    api.DatasetDefResponse:
      properties:
        deleteBy:
          type: string
        description:
          type: string
        displayName:
          type: string
        dynamic:
          type: boolean
        fields:
          items:
            $ref: '#/components/schemas/api.DatasetFieldDef'
          type: array
          uniqueItems: false
        id:
          type: string
        idMaxLen:
          type: integer
        idPattern:
          type: string
        idRule:
          type: string
        invalid:
          description: |-
            Invalid marks a definition whose folded declaration fails
            validation (invalidReason says why). Invalid definitions never
            register or accept data but stay listed so they can be repaired
            (add the missing field) or removed.
          type: boolean
        invalidReason:
          type: string
        name:
          type: string
        search:
          $ref: '#/components/schemas/api.DatasetSearchFields'
        skipHistory:
          type: boolean
      type: object
    api.DatasetDraftRequest:
      properties:
        deleteBy:
          description: |-
            DeleteBy: "anyone" (default) or "author" (requires a
            stamp:creator field among fields).
          type: string
        description:
          type: string
        displayName:
          type: string
        dynamic:
          description: Dynamic keeps a free-form keyspace next to the declared fields.
          type: boolean
        fields:
          description: |-
            Fields are the initial field definitions. Declare required
            fields here — fields added later cannot be required.
          items:
            $ref: '#/components/schemas/api.DatasetFieldDraft'
          type: array
          uniqueItems: false
        idMaxLen:
          type: integer
        idPattern:
          type: string
        idRule:
          description: |-
            IdRule: "auto" (default — ids derived from the change) or "user"
            (caller-supplied ids, constrained by idPattern/idMaxLen; the id
            doubles as the upsert idempotency key).
          type: string
        name:
          description: |-
            Name is the dataset's collection name — pinned. No "_" prefix,
            dots, slashes or colons; built-in names are reserved.
          type: string
        search:
          $ref: '#/components/schemas/api.DatasetSearchFields'
        skipHistory:
          description: SkipHistory keeps the dataset out of the version-history index.
          type: boolean
      type: object
    api.DatasetFieldDef:
      properties:
        id:
          description: |-
            Id is the field definition record's id — the identity
            DELETE …/fields/:fieldId targets.
          type: string
        key:
          type: string
        kind:
          type: string
        mutableBy:
          type: string
        name:
          type: string
        required:
          type: boolean
        scope:
          type: string
        stamp:
          type: string
      type: object
    api.DatasetFieldDraft:
      properties:
        description:
          type: string
        key:
          description: Key is the on-record field name — pinned.
          type: string
        kind:
          description: |-
            Kind is a PropertyKind* wire string. Required unless stamp
            implies one (creator ⇒ string, createTime/modifyTime ⇒ number).
          type: string
        mutableBy:
          description: |-
            MutableBy: "never" (default — write-once), "author", "any".
            "author" requires a stamp:creator field in the dataset.
          type: string
        name:
          type: string
        required:
          description: 'Required: field must be present on create. Incompatible with
            stamp.'
          type: boolean
        scope:
          description: |-
            Scope: "synced" (default) or "local"; "derived" is implied by
            stamp and rejected otherwise.
          type: string
        shape:
          $ref: '#/components/schemas/api.DatasetFieldShape'
        stamp:
          description: |-
            Stamp: "creator" | "createTime" | "modifyTime" — value derived at
            apply time, client writes rejected.
          type: string
      type: object
    api.DatasetFieldShape:
      description: Shape optionally refines array/object values.
      properties:
        items:
          $ref: '#/components/schemas/api.DatasetFieldShape'
        kind:
          type: string
        properties:
          additionalProperties:
            $ref: '#/components/schemas/api.DatasetFieldShape'
          type: object
      type: object
    api.DatasetPatchRequest:
      properties:
        set:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
        unset:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.DatasetSchema:
      properties:
        name:
          type: string
        schema:
          items:
            type: integer
          type: array
          uniqueItems: false
        typeId:
          description: |-
            TypeId is the owning type for ext-type and runtime-defined
            datasets ("" for space-level built-ins). Records exist only on
            objects carrying this type; consumers gate indexing/eviction on it.
          type: string
      type: object
    api.DatasetSearchFields:
      description: |-
        Search is the optional search-extraction annotation (x-search):
        which record fields feed the search index's title/text.
      properties:
        text:
          type: string
        title:
          type: string
      type: object
    api.DatasetsResponse:
      properties:
        datasets:
          items:
            $ref: '#/components/schemas/api.DatasetSchema'
          type: array
          uniqueItems: false
      type: object
    api.DeleteRecordsRequest:
      properties:
        dataset:
          type: string
        objectId:
          type: string
        recordIds:
          items:
            type: string
          type: array
          uniqueItems: false
        traceIds:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.DeviceActivateRequest:
      properties:
        app:
          type: string
      type: object
    api.DeviceActiveClaim:
