host: 127.0.0.1:7001
info:
  contact: {}
  description: Local HTTP/JSON API wrapping any-sync-sdk. Localhost-only, no auth
    in v1.
  title: Any API
  version: "1.0"
paths:
  /account:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
