  api.TypeInfo:
    properties:
      builtIn:
        type: boolean
      description:
        type: string
      iconCid:
        type: string
      id:
        type: string
      name:
        type: string
      xKey:
        description: |-
          XKey is the stable, caller-side programmatic key. For builtin/registered
          types it equals Id (a clean literal like "program"); for user types it's
          the value set at create (or derived from Name by the client). Clients use
          it as the stable type handle in dotted property paths.
        type: string
    type: object
  api.TypesCreateRequest:
    properties:
      description:
        type: string
      iconCid:
        type: string
      name:
        type: string
      xKey:
        description: |-
          XKey is an optional stable, caller-side programmatic key for the type
          (e.g. "agent_memory"). Display-metadata, like Name — not enforced unique.
          When omitted, clients typically derive one from Name.
        type: string
    type: object
  api.TypesCreateResponse:
    properties:
      typeId:
        type: string
    type: object
  api.TypesListResponse:
    properties:
      types:
        items:
          $ref: '#/definitions/api.TypeInfo'
        type: array
    type: object
host: 127.0.0.1:7001
info:
  contact: {}
  description: Local HTTP/JSON API wrapping any-sync-sdk. Localhost-only, no auth
    in v1.
  title: Any API
  version: "1.0"
paths:
  /account:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Get account info
      tags:
      - account
  /account/metadata:
    put:
      consumes:
      - application/json
      parameters:
      - description: At least one field required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AccountMetadata'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Update account metadata
      tags:
      - account
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health check
      tags:
      - system
  /shutdown:
    post:
      responses:
        "204":
          description: No Content
      summary: Graceful shutdown
      tags:
      - system
  /spaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SpaceListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: List spaces
      tags:
      - spaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Space params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SpaceCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.SpaceInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Create a space
      tags:
      - spaces
  /spaces/{spaceId}:
    delete:
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Delete a space
      tags:
      - spaces
    get:
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SpaceInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Get a space
      tags:
      - spaces
    patch:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: At least one field required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SpaceUpdateRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Update space metadata
      tags:
      - spaces
  /spaces/{spaceId}/acl/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Request record + permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLAcceptRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Accept a join request
      tags:
      - acl
  /spaces/{spaceId}/acl/add:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Accounts to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLAddRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Add members directly (bypasses invite flow)
      tags:
      - acl
  /spaces/{spaceId}/acl/cancel-join:
    post:
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Cancel your pending join request
      tags:
      - acl
  /spaces/{spaceId}/acl/decline:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Identity to decline
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLDeclineRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Decline a join request
      tags:
      - acl
  /spaces/{spaceId}/acl/ownership:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: New owner + old owner permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLOwnershipRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Transfer ownership
      tags:
      - acl
  /spaces/{spaceId}/acl/permissions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Permission changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLChangePermissionsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Change member permissions (batch)
      tags:
      - acl
  /spaces/{spaceId}/acl/remove:
    post:
      consumes:
      - application/json
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Identities to remove
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ACLRemoveRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
