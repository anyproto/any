        type: array
    type: object
  api.PropertiesSetRequest:
    properties:
      patch:
        additionalProperties: {}
        type: object
    type: object
  api.PropertyDef:
    properties:
      description:
        type: string
      format:
        allOf:
        - $ref: '#/definitions/api.PropertyFormat'
        description: |-
          Format is the property's value-format annotation; absent for
          properties that never declared one.
      id:
        type: string
      items:
        $ref: '#/definitions/api.PropertyDef'
      kind:
        type: string
      meta:
        additionalProperties:
          type: string
        description: |-
          Meta is the opaque consumer flag map set at AddProperty time
          (e.g. meta["index"] = "<scope>" for the search indexer).
        type: object
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/api.PropertyDef'
        type: array
      required:
        items:
          type: string
        type: array
      scope:
        description: |-
          Scope is the property's write/sync class (synced / derived /
          account / local). Definitions written before scopes existed
          read back as "synced".
        type: string
      xKey:
        type: string
      xKind:
        type: string
    type: object
  api.PropertyFormat:
    properties:
      filter:
        description: |-
          Filter is a mongo-style condition object over candidate objects
          (e.g. {"type": {"$in": ["page"]}}); optional, links only.
        items:
          type: integer
        type: array
      meta:
        additionalProperties:
          type: string
        description: Meta is an opaque, format-level string config bag.
        type: object
      options:
        additionalProperties:
          $ref: '#/definitions/api.PropertyOption'
        description: |-
          Options is the enumerated choice set for select / multiselect,
          keyed by the option's stable key (which IS the stored value).
          Read back on GET; write/mutate via PATCH (format.options.<key>.*
          paths), not this create body's whole-map form.
        type: object
      type:
        description: Type is one of the FormatType* wire strings.
        type: string
      ui:
        description: |-
          UI is one of the FormatUI* wire strings; optional. links accepts
          any UI; date/datetime accept none.
        type: string
    type: object
  api.PropertyOption:
    properties:
      color:
        type: string
      meta:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      pos:
        type: string
    type: object
  api.PropertyPatchRequest:
    properties:
      set:
        additionalProperties:
          items:
            type: integer
