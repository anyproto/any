          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Get account info
      tags:
      - account
  /account/metadata:
    put:
      consumes:
      - application/json
      parameters:
      - description: At least one field required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AccountMetadata'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: Update account metadata
      tags:
      - account
  /auth:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthStatusResponse'
      summary: Authorization state + locally available accounts
      tags:
      - auth
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: 'Authorize: generate, restore (mnemonic) or select an account'
      tags:
      - auth
  /datasets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DatasetsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorEnvelope'
      summary: List the account's system dataset schemas
      tags:
      - data
