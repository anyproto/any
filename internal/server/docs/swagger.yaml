        at:
          type: integer
        seq:
          type: integer
      type: object
    api.DeviceInfo:
      properties:
        activeClaims:
          additionalProperties:
            $ref: '#/components/schemas/api.DeviceActiveClaim'
          type: object
        apps:
          additionalProperties:
            additionalProperties: {}
            type: object
          type: object
        name:
          type: string
        os:
          type: string
        peerId:
          type: string
        version:
          type: string
      type: object
    api.DeviceUpdateRequest:
      properties:
        apps:
          additionalProperties:
            additionalProperties: {}
            type: object
          type: object
        name:
          type: string
      type: object
    api.DevicesListResponse:
      properties:
        active:
          additionalProperties:
            type: string
          type: object
        devices:
          items:
            $ref: '#/components/schemas/api.DeviceInfo'
          type: array
          uniqueItems: false
        self:
          type: string
      type: object
    api.Edge:
      properties:
        strength:
          type: number
        to:
          type: string
        type:
          type: string
      type: object
    api.EnrichApplyRequest:
      properties:
        proposalId:
          type: string
      type: object
    api.EnrichApplyResponse:
      properties:
        created:
          type: integer
        enrichedDataWritten:
          type: integer
        failures:
          items:
            type: string
          type: array
          uniqueItems: false
        propertiesSet:
          type: integer
        proposalDeleted:
          type: boolean
      type: object
    api.EnrichedDataCreateRequest:
      properties:
        source:
          type: string
        target:
          type: string
        text:
          type: string
        value:
          type: string
      type: object
    api.ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/api.APIError'
      type: object
    api.FileCacheFreeRequest:
      properties:
        bytes:
          type: integer
      type: object
    api.FileCacheFreeResult:
      properties:
        freed:
          type: integer
      type: object
    api.FileCacheInfo:
      properties:
        size:
          type: integer
      type: object
    api.FileInfo:
      properties:
        cached:
          description: Cached reports a complete local copy (always true for inline).
          type: boolean
        durable:
          description: |-
            Durable reports a verified network-custody receipt (inline files
            are durable by construction). False right after attach is normal:
            backup runs in the background — watch /files/subscribe or re-GET.
          type: boolean
        fileId:
          type: string
        inline:
          description: Inline reports the inline tier (no rootCid, no backup needed).
          type: boolean
        mime:
          type: string
        name:
          type: string
        objectId:
          type: string
        rootCid:
          description: |-
            RootCid is the content address of the encrypted file. Empty for
            inline-tier files (bytes ride the CRDT row itself).
          type: string
        size:
          description: Size is the plaintext byte size.
          type: integer
        variant:
          type: string
        variantOf:
          type: string
      type: object
    api.FileListResponse:
      properties:
        files:
          items:
            $ref: '#/components/schemas/api.FileInfo'
          type: array
          uniqueItems: false
      type: object
    api.FileStats:
      properties:
        durable:
          type: integer
        inflight:
          type: integer
        limited:
          type: integer
        total:
          type: integer
      type: object
    api.FileStatus:
      properties:
        attempts:
          description: |-
            Attempts counts failed background attempts since the last
            success/enqueue; 0 when no work is pending.
          type: integer
        cached:
          type: boolean
        fileId:
          type: string
        lastErr:
          type: string
        objectId:
          type: string
        state:
          type: string
      type: object
    api.HealthResponse:
      properties:
        account:
          type: string
        bootstrapping:
          description: |-
            Bootstrapping is true while the booted SDK's background boot pass
            (eager space loading + offline catch-up) is still running. The
            server serves throughout; per-space convergence is /sync-status.
            False when unauthorized and after the pass completes.
          type: boolean
        startedAt:
          type: string
        status:
          type: string
        version:
          type: string
      type: object
    api.HistoryChange:
      properties:
        author:
          type: string
        dataset:
          type: string
        groupSize:
          type: integer
        timestamp:
          description: author clock, Unix seconds — display-only
          type: integer
        touched:
          items:
            $ref: '#/components/schemas/api.HistoryTouchedRecord'
          type: array
          uniqueItems: false
        traceIds:
          items:
            type: string
          type: array
          uniqueItems: false
        truncated:
          description: |-
            Truncated is RESERVED (always false today): the SDK keeps full
            history locally. It becomes meaningful with the future
            snapshot-horizon contract.
          type: boolean
        version:
          type: string
      type: object
    api.HistoryDatasetDiff:
      properties:
        dataset:
          type: string
        records:
          items:
            $ref: '#/components/schemas/api.HistoryRecordDiff'
          type: array
          uniqueItems: false
