components:
  schemas:
    api.ACLAcceptRequest:
      properties:
        permission:
          type: string
        requestRecordId:
          type: string
      type: object
    api.ACLAddAccount:
      properties:
        identity:
          type: string
        metadata:
          $ref: '#/components/schemas/api.AccountMetadata'
        permission:
          type: string
      type: object
    api.ACLAddRequest:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/api.ACLAddAccount'
          type: array
          uniqueItems: false
      type: object
    api.ACLChangePermissionsRequest:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/api.ACLPermissionChange'
          type: array
          uniqueItems: false
      type: object
    api.ACLDeclineRequest:
      properties:
        identity:
          type: string
      type: object
    api.ACLOwnershipRequest:
      properties:
        newOwner:
          type: string
        oldOwnerPerm:
          type: string
      type: object
    api.ACLPermissionChange:
      properties:
        identity:
          type: string
        permission:
          type: string
      type: object
    api.ACLRemoveRequest:
      properties:
        identities:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          type: string
      type: object
    api.AccountMetadata:
      properties:
        description:
          type: string
        iconCid:
          type: string
        name:
          type: string
      type: object
    api.AccountResponse:
      properties:
        id:
          type: string
        metadata:
          $ref: '#/components/schemas/api.AccountMetadata'
        techSpaceId:
          description: |-
            TechSpaceId is the account's tech space — the :spaceId for
            account-level bundles (see docs/03-api.md § Bundles).
          type: string
      type: object
    api.AddDatasetFieldResponse:
      properties:
        fieldDefId:
          type: string
      type: object
    api.AddDatasetResponse:
      properties:
        collection:
          description: |-
            Collection is the computed collection name the new dataset's
            records live in.
          type: string
        datasetDefId:
          type: string
      type: object
    api.AddPartResponse:
      properties:
        partId:
          type: string
      type: object
    api.AddPropertyRequest:
      properties:
        description:
          type: string
        kind:
          type: string
        meta:
          additionalProperties:
            type: string
          description: |-
            Meta holds the consumer flags the server interprets — today only
            meta["index"] = "<scope>" | "none" for the search indexer
            (docs/13-index.md). Any other key is rejected; descriptive
            metadata lives under xFormat.
          type: object
        name:
          type: string
        scope:
          description: |-
            Scope is the property's write/sync class: "synced" (default,
            everyone in the space), "account" (this account's devices only),
            or "local" (this device only, never synced). "derived" is
            reserved for built-ins and rejected. Pinned by the first write,
            like kind — changing a property's scope means defining a new
            property. Property VALUE writes auto-route by the declared scope
            (POST /v1/spaces/:spaceId/properties/:objectId/set/:typeId).
          type: string
        xFormat:
          description: |-
            XFormat is the property's descriptor: everything descriptive
            beyond the kind — the semantic slug, icon, ordering key, option
            set, relation targets, per-format config (docs/27-descriptors.md).
            An object; the server validates the keys it interprets (type,
            icon, pos, options, relation, config) against the vocabulary and
            the slug against kind, stores vendor-namespaced keys verbatim,
            and reserves validate / compute. Every path under it is mutable
            via PATCH.
          items:
            type: integer
          type: array
          uniqueItems: false
        xKey:
          description: |-
            XKey is the property's handle — an alias, not a storage key
            (values live under the content-addressed propId). Unique within
            the type (409 property.xkey_conflict); mutable via PATCH.
          type: string
      type: object
    api.AddPropertyResponse:
      properties:
        propId:
          type: string
      type: object
    api.AggregateResponse:
      properties:
        plan:
          type: string
        records:
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
      type: object
    api.AuthAccount:
      properties:
        default:
          description: Default marks the legacy flat-layout wallet at the data-dir
            root.
          type: boolean
        id:
          description: |-
            Id is the StrKey account address ("A…"). Empty for a default
            root wallet whose id can't be derived without a passkey.
          type: string
      type: object
    api.AuthCapabilities:
      description: |-
        Capabilities lists which lifecycle operations this server
        accepts; every bit is false on a standalone server.
      properties:
        deauthorize:
          description: 'Deauthorize: DELETE /v1/auth tears the account down in place.'
          type: boolean
        shutdown:
          description: 'Shutdown: POST /v1/shutdown stops the server.'
          type: boolean
        switchAccount:
          description: |-
            SwitchAccount: POST /v1/auth with replace:true switches accounts
            in place.
          type: boolean
      type: object
    api.AuthRequest:
      properties:
        accountId:
          description: |-
            AccountId selects an account that already has a local wallet
            (standalone only).
          type: string
        index:
          description: |-
            Index is the account derivation index for Mnemonic. Omitted
            means 1, the `any` default; pass 0 explicitly to restore an
            anytype-derived (or pre-index-1 any) account.
          type: integer
        mnemonic:
          description: |-
            Mnemonic restores (or first-creates) the account derived from
            this BIP-39 phrase.
          type: string
        replace:
          description: |-
            Replace switches a managed server from its current account to
            the one this request names, tearing the current engine down
            first. Without it a different account is refused. Never implied.
          type: boolean
      type: object
    api.AuthResponse:
      properties:
        accountId:
          type: string
        alreadyAuthorized:
          description: |-
            AlreadyAuthorized reports that the request named the account the
            server already runs: nothing was booted. With a mnemonic this
            confirms the phrase derives to the running account; with an
            accountId it confirms only that the id matches.
          type: boolean
        created:
          description: |-
            Created is true when this account had no local state before this
            call (fresh generation or first restore on this device).
          type: boolean
        mnemonic:
          description: |-
            Mnemonic is returned exactly once: when the server generated a
            fresh account (no mnemonic/accountId in the request). The caller
            must surface it to the user for backup.
          type: string
      type: object
    api.AuthStatusResponse:
      properties:
        accountId:
          type: string
        accounts:
          description: |-
            Accounts are the wallets on disk (standalone only — a managed
            server holds no keys and reports an empty list; the client owns
            the account list there).
          items:
            $ref: '#/components/schemas/api.AuthAccount'
          type: array
          uniqueItems: false
        authorized:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/api.AuthCapabilities'
        mode:
          description: Mode is the server's ownership mode, fixed at launch.
          enum:
          - standalone
          - managed
          type: string
      type: object
    api.Backlink:
      properties:
        objectId:
          type: string
        propId:
          type: string
        typeId:
          type: string
      type: object
    api.BacklinksResponse:
      properties:
        backlinks:
          items:
            $ref: '#/components/schemas/api.Backlink'
          type: array
          uniqueItems: false
      type: object
    api.BlockCreateRequest:
      properties:
        nav:
          $ref: '#/components/schemas/api.BlockNav'
        style:
          additionalProperties: {}
          type: object
        text:
          type: string
        type:
          type: string
      type: object
    api.BlockNav:
      properties:
        parentId:
          type: string
        pos:
          type: string
      type: object
    api.BlockPatchRequest:
      properties:
        set:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
        unset:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.Bundle:
      description: Bundle is the converged registry row.
      properties:
        derived:
          description: |-
            Derived reports that the winner is the root derived from the
            bundle id: the same id on every device, so this install cannot
            fork — and cannot be uninstalled, a derived object being
            undeletable. Absent means an ordinary created root.
          type: boolean
        id:
          description: |-
            Id is the stable bundle identifier — the record id. Permanent:
            a successor install takes a new id (record deletes are refused,
            so a reused id could never be reclaimed).
          type: string
        losers:
          description: |-
            Losers is the live conflict set: claimed roots that are neither
            the winner nor already deleted. Non-empty means two devices
            installed concurrently — merge what matters out of each, then
            resolve it.
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          description: |-
            Name is the display name, stamped as `any.name` on the root by
            whichever device installed it.
          type: string
        rootId:
          description: |-
            RootId is the winning root object id. Setup objects are derived
            from it, so this one id names the whole install. Provisional
            until the space syncs.
          type: string
        roots:
          description: |-
            Roots is every root ever claimed for this bundle — the add-only
            audit trail. A resolved loser stays listed; its death is
            recorded by the deletion of its tree.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.BundleChildRequest:
      properties:
        seed:
          description: |-
            Seed derives the child deterministically under the bundle's
            current winner. Permanent — a successor object takes a new seed.
          type: string
        types:
          description: Types are attached on first materialization.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.BundleChildResponse:
      properties:
        objectId:
          type: string
      type: object
    api.BundleEnsureRequest:
      properties:
        derived:
          description: |-
            Derived installs the bundle on the root derived from its id
            rather than a created one. Every device computes that id
            offline, so the install never forks and never waits for the
            registry to converge — which is the only way both sides of a
            1-1 (where nobody is the owner) can install while apart.

            Permanent in both directions: a derived root cannot be deleted,
            so the bundle can never be uninstalled, and an existing install
            on a created root is adopted rather than migrated. Ask for it
            for a space's chat; not for anything a user may remove.
          type: boolean
        hidden:
          type: boolean
        id:
          description: Id is the bundle identifier. Required.
          type: string
        layout:
          description: |-
            Layout and Weight seed the root type's rendering slice (same
            shape as POST …/types); Hidden keeps it out of GET …/types. All
            three are written on install only — an adopt never patches them.
            Hidden is explicit: a root that only hosts its bundle's records
            should ask for it (a listed type is one a client may attach
            elsewhere, granting that object the bundle's collections); a root
            that is a type objects carry stays listed.
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          description: Name is the display name, written on install.
          type: string
        parts:
          description: |-
            Parts declares the root's parts with their datasets (same shape
            as POST …/types/:typeId/parts); the root becomes a type
            implementing itself, typeId = rootId, and the records are written
            through POST …/upsert / …/modify on the root (dataset = the
            computed collection, `<rootId>_<key>` for a namespaced one).
            Declared once on install; later evolution goes through the
            …/types/:rootId/parts routes. Parts or properties are required
            on the tech space.
          items:
            $ref: '#/components/schemas/api.PartDraftRequest'
          type: array
          uniqueItems: false
        properties:
          description: |-
            Properties declares property definitions on the root (same shape
            as POST …/types/:typeId/properties, xKey REQUIRED and unique):
            the root becomes a type objects carry, and each property's id is
            derived from (rootId, xKey) so two devices installing while apart
            mint one column per handle. Resolve xKey → propId through
            GET …/types/:rootId/properties. Declared once on install (an
            adopt fills in only definitions the root lacks); later evolution
            goes through the …/types/:rootId/properties routes.
          items:
            $ref: '#/components/schemas/api.AddPropertyRequest'
          type: array
          uniqueItems: false
        rootProperties:
          additionalProperties:
            additionalProperties: {}
            type: object
          description: |-
            RootProperties seeds the root's property values, keyed
            typeId → propId → value (same shape as POST /objects), written
            with RootTypes.
          type: object
        rootTypes:
          description: |-
            RootTypes are attached to the root object at birth, so the
            install's datasets are writable on it with no extra call. On a
            root that declares a type they ride the root's first change next
            to its own type — one object that is both a type and a carrier
            of another (the wiki: the type its pages carry and a `miniapp`).
          items:
            type: string
          type: array
          uniqueItems: false
        weight:
          type: integer
        xKey:
          description: |-
            XKey is the root type's handle (same meaning as on POST …/types):
            what a client resolves the type by, and what relation.targetTypes
            in other declarations name. Unique within the space among listed
            types (409 type.xkey_conflict). An xKey alone declares a MARKER
            type — no properties, no parts, just a flag objects carry.
            Written on install. A writer's adopt fills in a handle the root
            lacks (an install that predates it); an existing handle is never
            changed.
          type: string
      type: object
    api.BundleEnsureResponse:
      properties:
        bundle:
          $ref: '#/components/schemas/api.Bundle'
        installed:
          description: |-
            Installed reports whether THIS call registered the install.
            False means an existing one was adopted — which for a derived
            bundle may still materialize the root's tree on this device,
            since that id is one every device can mint.

            For a derived install it reports what THIS DEVICE did: both
            sides of a partition can report true for the one root they
            share.
          type: boolean
      type: object
    api.BundleGetResponse:
      properties:
        bundle:
          $ref: '#/components/schemas/api.Bundle'
        synced:
          description: 'Synced: see BundleListResponse.Synced.'
          type: boolean
      type: object
    api.BundleListResponse:
      properties:
        bundles:
          items:
            $ref: '#/components/schemas/api.Bundle'
          type: array
          uniqueItems: false
        synced:
          description: |-
            Synced reports whether the registry converged before this read
            (the read-side lock): true means an absent bundle is definitively
            not installed; false (the wait expired — cold offline device)
            means absence is provisional.
          type: boolean
      type: object
    api.BundleResolveRequest:
      properties:
        loserRootId:
          description: |-
            LoserRootId is the losing root to delete, cascading to its
            derived children. Call it only once whatever mattered has been
            merged out — the server never merges for you.
          type: string
      type: object
    api.CRDTVersionState:
      description: |-
        CRDTVersion is the account's CRDT data-model version state
        (absent when unauthorized): the version this server's SDK
        supports, the one recorded on the account's tech space, and
        `newer` — true when the recorded one is above the supported one,
        which makes the account read-only until the server is upgraded
        (every synced write answers 409 sdk.crdt_version_newer).
      properties:
        newer:
          type: boolean
        stored:
          type: integer
        supported:
          type: integer
      type: object
    api.CatalogBundle:
      properties:
        derived:
          description: |-
            Derived installs the bundle on the root derived from its id —
            never forks, never deletable. The general chat only.
          type: boolean
        description:
          type: string
        hidden:
          description: |-
            Hidden keeps the root's type out of pickers and out of the
            primary-type choice; needs `type` or `parts`, and excludes a
            `weight`.
          type: boolean
        id:
          type: string
        miniapp:
          additionalProperties: {}
          description: |-
            Miniapp is a value map on the built-in `miniapp` type the root
            carries: `bundle` is this bundle's id (filled when omitted), any
            other key must be a property the built-in declares.
          type: object
        name:
          type: string
        parts:
          description: |-
            Parts declare records datasets on the root (the
            POST …/types/:typeId/parts draft shape).
          items:
            $ref: '#/components/schemas/api.PartDraftRequest'
          type: array
          uniqueItems: false
        type:
          $ref: '#/components/schemas/api.CatalogType'
      type: object
    api.CatalogListResponse:
      properties:
        usecases:
          items:
            $ref: '#/components/schemas/api.CatalogUsecase'
          type: array
          uniqueItems: false
      type: object
    api.CatalogSetupBundle:
      properties:
        bundle:
          $ref: '#/components/schemas/api.Bundle'
        id:
          description: Id is the bundle id.
          type: string
        installed:
          description: Installed reports whether THIS call registered the root.
          type: boolean
        miniapp:
          additionalProperties: {}
          description: |-
            Miniapp is the value map the catalog declares on the built-in
            `miniapp` type, `bundle` included — what an install writes and an
            adopt by a writer fills in where absent. Read the root for what it
            carries.
          type: object
        properties:
          additionalProperties:
            type: string
          description: Properties maps each declared property's xKey to its id.
          type: object
        typeId:
          description: |-
            TypeId is the root's id when the bundle declares a type — the
            namespace of its property values (`<typeId>.<propId>`).
          type: string
        usecase:
          description: |-
            Usecase is the entry the bundle belongs to (the requested one or
            a dependency).
          type: string
      type: object
    api.CatalogSetupRequest:
      properties:
        spaceId:
          type: string
      type: object
    api.CatalogSetupResponse:
      properties:
        bundles:
          description: Bundles are the installs in setup order.
          items:
            $ref: '#/components/schemas/api.CatalogSetupBundle'
          type: array
          uniqueItems: false
        usecase:
          description: Usecase is the id that was asked for.
          type: string
      type: object
    api.CatalogType:
      description: Type declares the type the root implements.
      properties:
        layout:
          description: Layout is the rendering slug, `{type, config?}`.
          items:
            type: integer
          type: array
          uniqueItems: false
        properties:
          description: |-
            Properties are the columns (the POST …/types/:typeId/properties
            draft shape); each carries an xKey, the property id derives from
            it.
          items:
            $ref: '#/components/schemas/api.AddPropertyRequest'
          type: array
          uniqueItems: false
        weight:
          description: |-
            Weight orders the type against others an object carries (the
            highest listed one is the primary type); meaningless on a hidden
            type.
          type: integer
        xKey:
          description: |-
            XKey is the type's handle — what clients resolve it by and what
            relation.targetTypes name. Unique across the catalog.
          type: string
      type: object
    api.CatalogUsecase:
      properties:
        bundles:
          description: Bundles are the usecase's own installs, in setup order.
          items:
            $ref: '#/components/schemas/api.CatalogBundle'
          type: array
          uniqueItems: false
        description:
          type: string
        id:
          description: |-
            Id is the usecase slug — the `:usecaseId` path segment. Never
            enters a space.
          type: string
        name:
          type: string
        requires:
          description: Requires lists the usecases set up before this one, transitively.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.ChatAgentMeta:
      properties:
        debugLink:
          type: string
        done:
          type: boolean
        name:
          type: string
        outcome:
          description: |-
            Outcome says how the run behind a done:true message ended when
            it did not end normally — `interrupted` (the user stopped it),
            `error` (it died). Absent on a normal reply. Opaque to the
            server; clients key their rendering (a stop mark, a warning) on
            it instead of parsing the text.
          type: string
      type: object
    api.ChatAttachment:
      properties:
        link:
          type: string
        type:
          type: string
      type: object
    api.ChatEditRequest:
      properties:
        text:
          type: string
      type: object
    api.ChatMessageContext:
      properties:
        objectId:
          type: string
        spaceId:
          type: string
        view:
          type: string
      type: object
    api.ChatMessageControl:
      properties:
        hard:
          type: boolean
        kind:
          type: string
      type: object
    api.ChatSendRequest:
      properties:
        agent:
          $ref: '#/components/schemas/api.ChatAgentMeta'
        attachments:
          additionalProperties:
            $ref: '#/components/schemas/api.ChatAttachment'
          type: object
        context:
          $ref: '#/components/schemas/api.ChatMessageContext'
        control:
          $ref: '#/components/schemas/api.ChatMessageControl'
        replyToMessageId:
          type: string
        text:
          type: string
      type: object
    api.DatasetDefResponse:
      properties:
        collection:
          type: string
        deleteBy:
          type: string
        description:
          type: string
        displayName:
          type: string
        dynamic:
          type: boolean
        fields:
          items:
            $ref: '#/components/schemas/api.DatasetFieldDef'
          type: array
          uniqueItems: false
        id:
          type: string
        idMaxLen:
          type: integer
        idPattern:
          type: string
        idRule:
          type: string
        invalid:
          description: |-
            Invalid marks a definition whose folded declaration fails
            validation (invalidReason says why) — a records fold missing a
            creator stamp behind an author rule, an unknown module, a shared
            rule violation. Invalid definitions never register or accept data
            but stay listed so they can be repaired or removed.
          type: boolean
        invalidReason:
          type: string
        key:
          description: |-
            Key is the slug inside the type; collection is the name reads and
            writes address (`dataset` on /query, /modify, /upsert …) — the
            module's canonical collection when shared, `<typeId>_<key>`
            otherwise. Server-computed, never client-set.
          type: string
        module:
          type: string
        partId:
          description: PartId is the owning part's id.
          type: string
        search:
          $ref: '#/components/schemas/api.DatasetSearchFields'
        shared:
          type: boolean
        skipHistory:
          type: boolean
      type: object
    api.DatasetDraftRequest:
      properties:
        deleteBy:
          description: |-
            DeleteBy: "anyone" (default) or "author" (requires a
            stamp:creator field among fields).
          type: string
        description:
          type: string
        displayName:
          type: string
        dynamic:
          description: Dynamic keeps a free-form keyspace next to the declared fields.
          type: boolean
        fields:
          description: |-
            Fields are the initial field definitions (records datasets only —
            a module owns its schema). Declare required fields here — fields
            added later cannot be required.
          items:
            $ref: '#/components/schemas/api.DatasetFieldDraft'
          type: array
          uniqueItems: false
        idMaxLen:
          type: integer
        idPattern:
          type: string
        idRule:
          description: |-
            IdRule: "auto" (default — ids derived from the change) or "user"
            (caller-supplied ids, constrained by idPattern/idMaxLen; the id
            doubles as the upsert idempotency key).
          type: string
        key:
          description: |-
            Key is the dataset's slug inside its type ([a-z][a-z0-9_]*, ≤ 64)
            — pinned. A namespaced dataset lives in the collection
            `<typeId>_<key>`; a shared dataset's key is its module's canonical
            collection name and may be omitted.
          type: string
        module:
          description: |-
            Module is the serving module: "records" (the default) or
            "editor". "chat" is reserved to the server (400
            dataset.module_reserved) — the catalog's general-chat usecase is
            its one declaration.
          type: string
        search:
          $ref: '#/components/schemas/api.DatasetSearchFields'
        shared:
          description: |-
            Shared makes the type participate in the module's canonical
            collection (editor_blocks) instead of a namespaced one, so two
            types sharing the editor give an object carrying both a single
            body. Editor: either; records: never.
          type: boolean
        skipHistory:
          description: SkipHistory keeps the dataset out of the version-history index.
          type: boolean
      type: object
    api.DatasetFieldDef:
      properties:
        description:
          type: string
        id:
          description: |-
            Id is the field definition record's id — the identity
            PATCH / DELETE …/fields/:fieldId target.
          type: string
        key:
          type: string
        kind:
          type: string
        mutableBy:
          type: string
        name:
          type: string
        required:
          type: boolean
        scope:
          type: string
        shape:
          $ref: '#/components/schemas/api.DatasetFieldShape'
        stamp:
          type: string
        xFormat:
          description: |-
            XFormat is the field's descriptor as stored; absent when none was
            declared.
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
