<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>any</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --border-soft: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #2f81f7;
    --accent-fade: #1f4e8c;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; height: 100%; }
  body { font: 14px/1.45 system-ui, -apple-system, sans-serif; display: flex; }

  /* ---------- right sidebar: request/response log ---------- */
  aside.netlog {
    width: 360px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    height: 100vh; overflow: hidden; transition: width .15s ease;
  }
  aside.netlog.collapsed { width: 36px; }
  aside.netlog .netlog-head {
    padding: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  aside.netlog.collapsed .netlog-head { padding: 12px 8px; flex-direction: column; }
  aside.netlog .netlog-head h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0;
  }
  aside.netlog.collapsed .netlog-head h2 { writing-mode: vertical-rl; transform: rotate(180deg); }
  aside.netlog .netlog-head .actions { display: flex; gap: 6px; }
  aside.netlog.collapsed .netlog-head .actions { flex-direction: column; }
  aside.netlog.collapsed .netlog-list { display: none; }

  .netlog-list { flex: 1; overflow-y: auto; }
  .netlog-entry {
    border-bottom: 1px solid var(--border-soft); padding: 6px 12px; cursor: pointer;
    font: 12px var(--mono);
  }
  .netlog-entry:hover { background: var(--panel-2); }
  .netlog-entry .head {
    display: flex; align-items: center; gap: 6px; line-height: 1.5;
  }
  .netlog-entry .method {
    color: var(--text); font-weight: 600; padding: 0 4px; border-radius: 3px;
    background: var(--border-soft); flex-shrink: 0; font-size: 10px;
  }
  .netlog-entry .method.GET    { color: var(--accent); }
  .netlog-entry .method.POST   { color: var(--ok); }
  .netlog-entry .method.PUT,
  .netlog-entry .method.PATCH  { color: var(--warn); }
  .netlog-entry .method.DELETE { color: var(--err); }
  .netlog-entry .path { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .netlog-entry .status {
    font-weight: 600; flex-shrink: 0; padding: 0 4px; border-radius: 3px; background: var(--border-soft);
    font-size: 10px;
  }
  .netlog-entry .status.ok  { color: var(--ok); }
  .netlog-entry .status.err { color: var(--err); }
  .netlog-entry .ts { color: var(--muted); font-size: 10px; flex-shrink: 0; }
  .netlog-entry .body { display: none; margin-top: 6px; }
  .netlog-entry.open  { background: var(--panel-2); }
  .netlog-entry.open .body { display: block; }
  .netlog-entry .body .label {
    font-size: 10px; text-transform: uppercase; color: var(--muted);
    letter-spacing: .04em; margin-top: 4px;
  }
  .netlog-entry .body pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    padding: 6px; margin: 2px 0 0; font: 11px var(--mono); white-space: pre-wrap;
    word-break: break-all; max-height: 240px; overflow: auto;
  }

  /* ---------- sidebar ---------- */
  aside.sidebar {
    width: 260px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  aside .brand { padding: 16px; border-bottom: 1px solid var(--border); }
  aside .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
  aside .brand .acct-row { display: flex; align-items: flex-start; gap: 6px; margin-top: 4px; }
  aside .brand .acct-row .acct { flex: 1; font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  aside .brand .acct-row .icon { padding: 0 6px; line-height: 18px; font-size: 12px; }
  aside .brand .health { margin-top: 6px; font: 11px var(--mono); color: var(--muted); }
  aside .brand .health.ok { color: var(--ok); }
  aside .brand .health.err { color: var(--err); }

  aside .group { padding: 12px 12px 8px; }
  aside .group h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center;
  }

  /* ---------- left tree ---------- */
  aside.sidebar .tree-head {
    padding: 12px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
  }
  aside.sidebar .tree-head h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0;
  }
  aside.sidebar .tree-head .actions { display: flex; gap: 4px; }
  aside.sidebar .tree {
    flex: 1; overflow-y: auto; padding: 4px 0;
  }
  .tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 4px; cursor: pointer;
    color: var(--text); font-size: 13px; line-height: 1.35;
    border-left: 2px solid transparent;
    user-select: none;
    position: relative;
  }
  .tree-row:hover { background: var(--panel-2); }
  .tree-row.active { background: var(--accent-fade); border-left-color: var(--accent); }
  .tree-row.dragging { opacity: 0.4; }
  .tree-row.drop-into { background: var(--accent-fade); outline: 1px solid var(--accent); }
  .tree-row.drop-before::before {
    content: ''; position: absolute; left: 0; right: 0; top: -1px;
    height: 2px; background: var(--accent);
  }
  .tree-row.drop-after::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--accent);
  }
  .tree-droproot {
    min-height: 24px; padding: 4px 12px;
    color: var(--muted); font: 11px var(--mono);
  }
  .tree-droproot.drop-active {
    background: var(--accent-fade); outline: 1px dashed var(--accent);
    color: var(--text);
  }
  .tree-empty.drop-active {
    background: var(--accent-fade); outline: 1px dashed var(--accent);
    color: var(--text);
  }
  .tree-row .chevron {
    width: 14px; flex-shrink: 0; color: var(--muted);
    text-align: center; font-size: 10px; cursor: pointer;
  }
  .tree-row .chevron.empty { visibility: hidden; }
  .tree-row .icon-glyph {
    width: 14px; flex-shrink: 0; text-align: center; color: var(--muted); font-size: 12px;
  }
  .tree-row .name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-row .row-actions { display: none; gap: 2px; }
  .tree-row:hover .row-actions { display: flex; }
  .tree-row .row-actions button {
    background: transparent; color: var(--muted); border: 0;
    padding: 0; width: 18px; height: 18px; font-size: 11px;
    cursor: pointer; line-height: 1;
  }
  .tree-row .row-actions button:hover { color: var(--text); }
  .tree-empty {
    padding: 8px 14px; color: var(--muted); font-size: 12px;
  }
  .tree-loading {
    padding: 4px 14px; color: var(--muted); font: 11px var(--mono);
  }

  /* ---------- right-sidebar space picker ---------- */
  aside.netlog .space-picker {
    padding: 10px 12px; display: flex; gap: 6px; align-items: center;
    border-bottom: 1px solid var(--border-soft);
  }
  aside.netlog .space-picker select {
    flex: 1; background: var(--bg); color: var(--text);
    font: 12px var(--mono); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px;
  }
  aside.netlog #form-new-space {
    margin: 8px 12px;
  }
  aside.netlog.collapsed .space-picker { display: none; }
  aside.netlog.collapsed #form-new-space { display: none; }

  /* ---------- main ---------- */
  main {
    flex: 1; min-width: 0;
    height: 100vh; overflow-y: auto; overflow-x: hidden;
    padding: 16px 24px;
  }
  main > * + * { margin-top: 16px; }
  main .empty {
    margin: 25vh auto 0; text-align: center; color: var(--muted); font-size: 14px; max-width: 360px;
  }
  main .empty code { font: 12px var(--mono); background: var(--panel-2); padding: 2px 6px; border-radius: 3px; }
  main a.link, main a.back { color: var(--accent); text-decoration: none; }
  main a.link:hover, main a.back:hover { text-decoration: underline; }

  .space-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .space-header h2 { margin: 0; font-size: 20px; }
  .space-header .id { font: 11px var(--mono); color: var(--muted); margin-left: 6px; }
  .space-header .meta { font: 12px var(--mono); color: var(--muted); }

  /* ---------- top tabs (objects / types / query) ---------- */
  .page-tabs {
    display: flex; gap: 4px; margin-top: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .page-tabs .tab {
    color: var(--muted); text-decoration: none;
    padding: 6px 14px; border-bottom: 2px solid transparent;
    font-size: 13px; line-height: 1.4;
  }
  .page-tabs .tab:hover { color: var(--text); }
  .page-tabs .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* ---------- object-edit page header ---------- */
  .page-head { margin-bottom: 16px; }
  .page-head .back {
    display: inline-block; color: var(--muted); text-decoration: none;
    font-size: 12px;
  }
  .page-head .back:hover { color: var(--text); }
  .page-head .page-title { font-size: 24px; margin: 10px 0 4px; line-height: 1.2; }
  .page-head .page-sub {
    font: 11px var(--mono); color: var(--muted);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }

  /* ---------- objects list rows ---------- */
  .obj-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 4px;
    color: inherit; text-decoration: none; margin-bottom: 6px;
  }
  .obj-row:hover { background: var(--panel-2); border-color: var(--border); }
  .obj-row .name { font-weight: 500; }
  .obj-row .row-meta {
    display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted);
    white-space: nowrap;
  }

  section.card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  section.card > header {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2);
  }
  section.card > header h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  section.card > .body { padding: 12px; }

  /* ---------- type cards (collapsible <details>) ---------- */
  details.type-card {
    border: 1px solid var(--border-soft); border-radius: 4px;
    margin-bottom: 8px;
  }
  details.type-card[open] { border-color: var(--border); }
  details.type-card > summary {
    list-style: none; padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  details.type-card > summary::-webkit-details-marker { display: none; }
  details.type-card > summary:hover { background: var(--panel-2); }
  details.type-card > summary .name { font-weight: 500; }
  details.type-card > summary .id { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  details.type-card > .type-body {
    padding: 10px; border-top: 1px solid var(--border-soft);
  }

  /* ---------- type sections inside object editor ---------- */
  .type-section {
    margin-bottom: 14px; padding: 10px;
    border: 1px solid var(--border-soft); border-radius: 4px;
  }
  .type-section h4 {
    margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); display: flex; align-items: center; gap: 6px;
  }

  /* ---------- bind-types panel ---------- */
  details.bind-types { margin-top: 12px; }
  details.bind-types > summary {
    cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0;
  }
  details.bind-types .bind-list {
    margin-top: 6px; padding: 8px;
    border: 1px dashed var(--border); border-radius: 4px;
  }
  details.bind-types .bind-item {
    display: block; font: 12px var(--mono); text-transform: none; padding: 2px 0;
  }

  .prop-list { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); }
  .prop-list li { padding: 3px 0; display: flex; gap: 8px; align-items: center; }
  .prop-list li .pname { color: var(--text); }
  .prop-list li .pkind { color: var(--accent); }
  .prop-list li .pid { color: var(--muted); margin-left: auto; }

  /* forms */
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: var(--bg); color: var(--text); font: 13px var(--mono);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  textarea { min-height: 56px; resize: vertical; }

  button {
    background: var(--accent); color: #fff; border: 0; padding: 5px 10px; border-radius: 4px;
    font-size: 12px; cursor: pointer; line-height: 1; height: 24px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.ghost:hover { color: var(--text); border-color: var(--text); }
  button.danger { background: #6e2424; }
  button.icon { padding: 0; width: 22px; height: 22px; line-height: 1; font-size: 14px; }

  .form-toggle {
    background: var(--panel-2); border: 1px dashed var(--border); border-radius: 4px;
    padding: 10px; margin-bottom: 8px;
  }
  .form-toggle.collapsed { display: none; }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .form-actions { display: flex; gap: 6px; margin-top: 6px; }

  .obj-edit-row {
    display: grid; grid-template-columns: 1fr 1.5fr 60px; gap: 8px; align-items: center; margin-bottom: 6px;
    padding: 4px 0;
  }
  .obj-edit-row .pname { font-size: 12px; }
  .obj-edit-row .pname .pkind { color: var(--accent); font: 11px var(--mono); margin-left: 4px; }
  .obj-edit-row .pname .pid { display: block; font: 10px var(--mono); color: var(--muted); }

  .toast {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    background: var(--panel); border: 1px solid var(--border); padding: 10px 14px;
    border-radius: 6px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    max-width: 360px; transform: translateY(40px); opacity: 0; transition: all .2s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.err { border-color: var(--err); }
  .toast.ok { border-color: var(--ok); }
  .toast .body { font: 11px var(--mono); color: var(--muted); margin-top: 4px; word-break: break-word; max-height: 100px; overflow: auto; }

  details.raw { margin-top: 12px; }
  details.raw summary { font-size: 11px; color: var(--muted); cursor: pointer; }
  details.raw pre { font: 11px var(--mono); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

  .row { display: flex; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .pill {
    font: 10px var(--mono); background: var(--panel-2); color: var(--muted);
    padding: 1px 6px; border-radius: 99px; border: 1px solid var(--border);
  }

  /* Debug / sync-status tab. Peer table is dense; kv table is the
     per-object snapshot layout. debug-results lays the two object
     panes side by side on wide screens, stacks on narrow. */
  table.debug-peers {
    width: 100%; border-collapse: collapse; font: 12px var(--mono);
  }
  table.debug-peers th, table.debug-peers td {
    text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border-soft);
  }
  table.debug-peers th {
    color: var(--muted); font: 11px system-ui; font-weight: 600;
  }
  table.kv {
    width: 100%; border-collapse: collapse;
  }
  table.kv td:first-child {
    color: var(--muted); font: 12px system-ui; width: 32%; padding: 3px 8px 3px 0;
    vertical-align: top;
  }
  table.kv td:last-child {
    padding: 3px 0; font-size: 12px; vertical-align: top;
  }
  .debug-results {
    display: grid; gap: 14px; grid-template-columns: 1fr 1fr;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft);
  }
  @media (max-width: 900px) {
    .debug-results { grid-template-columns: 1fr; }
  }
  .debug-pane h4 {
    margin: 0 0 6px; font: 12px system-ui; font-weight: 600;
    color: var(--muted); display: flex; align-items: center; gap: 6px;
  }

  /* Type tabs in the objects card. Horizontal scroll-snap when there
     are too many to fit; subtle bottom border stitches them to the
     list below. */
  .obj-tabs {
    display: flex; gap: 4px; margin-bottom: 10px;
    overflow-x: auto; padding-bottom: 2px;
    border-bottom: 1px solid var(--border-soft);
    scrollbar-width: thin;
  }
  .obj-tab {
    background: transparent; color: var(--muted); border: 0;
    border-bottom: 2px solid transparent; padding: 4px 10px;
    font: 12px system-ui; cursor: pointer; height: auto;
    border-radius: 0; white-space: nowrap; flex-shrink: 0;
    text-decoration: none;
  }
  .obj-tab:hover { color: var(--text); }
  .obj-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .obj-tab-count {
    margin-left: 4px; font: 10px var(--mono);
    background: var(--panel-2); color: var(--muted);
    padding: 0 5px; border-radius: 99px;
    border: 1px solid var(--border);
  }
  .obj-tab.active .obj-tab-count { color: var(--text); }

  /* ---------- EasyMDE dark overrides ----------
     EasyMDE/CodeMirror ship with light defaults; restyle the surfaces
     that contrast against our dark theme. The container itself and
     the toolbar stay close to the panel colors so the editor feels
     like a first-class part of the page. */
  .EasyMDEContainer { background: var(--bg); }
  .EasyMDEContainer .CodeMirror,
  .EasyMDEContainer .editor-preview,
  .EasyMDEContainer .editor-preview-side {
    background: var(--bg); color: var(--text);
    border-color: var(--border);
  }
  .EasyMDEContainer .CodeMirror-cursor { border-left-color: var(--text); }
  .EasyMDEContainer .CodeMirror-selected { background: var(--accent-fade); }
  .EasyMDEContainer .CodeMirror-line ::selection { background: var(--accent-fade); }
  .EasyMDEContainer .editor-toolbar {
    background: var(--panel-2); border-color: var(--border);
    opacity: 1;
  }
  .EasyMDEContainer .editor-toolbar button {
    color: var(--text); border-color: transparent;
  }
  .EasyMDEContainer .editor-toolbar button:hover,
  .EasyMDEContainer .editor-toolbar button.active {
    background: var(--panel); border-color: var(--border);
  }
  .EasyMDEContainer .editor-toolbar i.separator {
    border-left: 1px solid var(--border); border-right-color: transparent;
  }
  .EasyMDEContainer .editor-statusbar { color: var(--muted); }
  .EasyMDEContainer .editor-preview pre,
  .EasyMDEContainer .editor-preview-side pre {
    background: var(--panel-2); color: var(--text);
  }
  .EasyMDEContainer .editor-preview code,
  .EasyMDEContainer .editor-preview-side code {
    background: var(--panel-2); padding: 1px 4px; border-radius: 3px;
  }
  .EasyMDEContainer .editor-preview blockquote,
  .EasyMDEContainer .editor-preview-side blockquote {
    color: var(--muted); border-left-color: var(--border);
  }
  .md-card .body { padding: 0; }

  /* ---------- bottom pane: md + chat side-by-side ----------
     Layout depends on which built-ins are bound to the object:
       - md only or chat only → single full-width column
       - md + chat            → two columns, md left + chat right
     The grid template ensures both panels share the same row height,
     so the chat list grows with the editor instead of dictating its
     own height. */
  .obj-bottom-pane { margin-top: 16px; }
  .obj-bottom-pane.md-and-chat {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    align-items: stretch;
  }
  .obj-bottom-pane.md-and-chat > .md-card,
  .obj-bottom-pane.md-and-chat > .chat-card {
    min-width: 0;   /* let the grid track shrink below content width */
  }

  /* ---------- chat card ---------- */
  .chat-card { display: flex; flex-direction: column; min-height: 480px; }
  .chat-card > .body {
    flex: 1; padding: 0; display: flex; flex-direction: column; min-height: 0;
  }
  .chat-card .chat-messages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 280px;
  }
  .chat-card .chat-empty {
    color: var(--muted); font-size: 12px; padding: 12px; text-align: center;
  }
  .chat-card .chat-loading {
    color: var(--muted); font: 11px var(--mono); padding: 8px 12px;
  }

  /* one message row */
  .chat-msg { display: flex; flex-direction: column; gap: 4px; }
  .chat-msg .meta {
    display: flex; align-items: baseline; gap: 6px;
    font: 11px var(--mono); color: var(--muted);
  }
  .chat-msg .meta .author { color: var(--text); font-weight: 500; }

<script>
(function() {
  'use strict';

  // ---------- constants ----------
  const MD_TYPE_ID = 'editor';
  const CHAT_TYPE_ID = 'chat';
  const CHAT_DATASET = 'chat_messages';
  const CHAT_QUICK_REACTIONS = ['👍', '❤️', '😂', '🎉', '👀'];
  const NAV_TYPE_ID = 'nav';
  const NAV_TYPE_ITEM = 1;
  const NAV_TYPE_FOLDER = 2;
  const NAV_ROOT_PARENT = '';
  const ANY_AUTO_PROP_IDS = new Set(['id', 'author', 'spaceId', 'createdAt']);
  const OBJECTS_QUERY_LIMIT = 500;
  const TREE_PAGE_SIZE = 200;

  // ---------- lexid (JS port of github.com/anyproto/lexid) ----------
  // The server's `nav.pos` allocator uses CharsAllNoEscape +
  // blockSize=4 + stepSize=100. Drag/drop needs to allocate new pos
  // values client-side; if we used a generic midstring algorithm,
  // values would land outside the alphabet and the server's later
  // Next() calls (e.g. on object create) would walk into undefined
  // territory in nextChar[] lookups. So we mirror the Go logic
  // byte-for-byte. Any divergence here will silently corrupt sort
  // order over time — keep in sync with /home/che/go/pkg/mod/.../lexid.go.
  const LEXID_CHARS = (() => {
    // Visible ASCII (33–126) minus " (34) and \ (92).
    const out = [];
    for (let i = 33; i <= 126; i++) {
      if (i === 34 || i === 92) continue;
      out.push(i);
    }
    return out; // already sorted by byte
  })();
  const LEXID_BLOCK = 4;
  const LEXID_STEP = 100;
  const LEXID_LOWER = LEXID_CHARS[0];
  const LEXID_UPPER = LEXID_CHARS[LEXID_CHARS.length - 1];
  const LEXID_NEXT_CHAR = (() => {
    const arr = new Uint8Array(256).fill(LEXID_LOWER);
    for (let i = 0; i < LEXID_CHARS.length; i++) {
      arr[LEXID_CHARS[i]] = LEXID_CHARS[(i + 1) % LEXID_CHARS.length];
    }
    return arr;
  })();
  const LEXID_INDEX = (() => {
    const arr = new Int16Array(256).fill(-1);
    for (let i = 0; i < LEXID_CHARS.length; i++) {
      arr[LEXID_CHARS[i]] = i;
    }
    return arr;
  })();
  function lexidPadding(s, pad) {
    const out = new Array(s.length + pad);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    for (let i = 0; i < pad; i++) {
      out[s.length + i] = (i === pad - 1) ? LEXID_NEXT_CHAR[LEXID_LOWER] : LEXID_LOWER;
    }
    return String.fromCharCode.apply(null, out);
  }
  function lexidNextStep(prev, step) {
    if (prev === '') {
      const first = new Array(LEXID_BLOCK);
      for (let i = 0; i < LEXID_BLOCK; i++) {
        first[i] = (i === LEXID_BLOCK - 1) ? LEXID_NEXT_CHAR[LEXID_LOWER] : LEXID_LOWER;
      }
      prev = String.fromCharCode.apply(null, first);
    }
    const padNeeded = LEXID_BLOCK - (prev.length % LEXID_BLOCK);
    if (padNeeded !== LEXID_BLOCK) return lexidPadding(prev, padNeeded);

    let bytes = new Array(prev.length);
    for (let i = 0; i < prev.length; i++) bytes[i] = prev.charCodeAt(i);

    while (true) {
      let carry = 1;
      for (let s = 0; s < step; s++) {
        carry = 1;
        for (let i = bytes.length - 1; i >= 0; i--) {
          if (carry === 0) break;
          const nv = LEXID_NEXT_CHAR[bytes[i]];
          if (nv === LEXID_LOWER) {
            bytes[i] = (i === bytes.length - 1) ? LEXID_NEXT_CHAR[LEXID_LOWER] : nv;
            carry = 1;
          } else {
            bytes[i] = nv;
            carry = 0;
          }
        }
        if (carry !== 0) break;
      }
      if (carry === 1) {
        // pad and retry
        prev = lexidPadding(String.fromCharCode.apply(null, bytes), LEXID_BLOCK);
        bytes = new Array(prev.length);
        for (let i = 0; i < prev.length; i++) bytes[i] = prev.charCodeAt(i);
        continue;
      }
      break;
    }
    return String.fromCharCode.apply(null, bytes);
  }
  function lexidPrevStep(next, step) {
    if (next === '') {
      const last = new Array(LEXID_BLOCK).fill(LEXID_UPPER);
      return String.fromCharCode.apply(null, last);
    }
    let bytes = new Array(next.length);
    for (let i = 0; i < next.length; i++) {
      const c = next.charCodeAt(i);
      if (LEXID_INDEX[c] === -1) return '';
      bytes[i] = c;
    }
    let remaining = step;
    while (remaining > 0) {
      let borrow = 1;
      for (let i = bytes.length - 1; i >= 0; i--) {
        if (borrow === 0) break;
        const idx = LEXID_INDEX[bytes[i]];
        let newIdx = idx - 1;
        if (newIdx < 0) {
          newIdx = LEXID_CHARS.length - 1;
          borrow = 1;
        } else {
          borrow = 0;
        }
        bytes[i] = LEXID_CHARS[newIdx];
      }
      if (borrow !== 0) {
        if (bytes.length <= LEXID_BLOCK) return '';
        bytes = bytes.slice(0, bytes.length - LEXID_BLOCK);
        if (remaining > 1 && bytes.length > 0) {
          for (let j = 0; j < bytes.length; j++) bytes[j] = LEXID_UPPER;
        }
      }
      remaining--;
      // Trailing-zero padding check (matches Go).
      if (bytes.length > 0 && bytes[bytes.length - 1] === LEXID_LOWER) {
        let isMin = true;
        for (let i = 0; i < bytes.length; i++) {
          if (bytes[i] !== LEXID_LOWER) { isMin = false; break; }
        }
        if (isMin) {
          for (let i = 0; i < LEXID_BLOCK; i++) bytes.push(LEXID_UPPER);
        }
      }
    }
    return String.fromCharCode.apply(null, bytes);
  }
  function lexidApproxDistance(id1, id2) {
    const size = Math.min(id1.length, id2.length);
    let distance = 0, mult = 1;
    for (let i = size - 1; i >= 0; i--) {
      const i1 = LEXID_INDEX[id1.charCodeAt(i)];
      const i2 = LEXID_INDEX[id2.charCodeAt(i)];
      distance += (i2 - i1) * mult;
      mult *= LEXID_CHARS.length;
    }
    return distance;
  }
  function lexidAddTail(prev) {
    const middle = LEXID_CHARS[(LEXID_CHARS.length / 2) | 0];
    return lexidPadding(prev + String.fromCharCode(middle), LEXID_BLOCK - 1);
  }
  function lexidMiddle() {
    const m = LEXID_CHARS[(LEXID_CHARS.length / 2) | 0];
    return String.fromCharCode(m).repeat(LEXID_BLOCK);
  }
  function lexidNext(prev) { return lexidNextStep(prev, LEXID_STEP); }
  function lexidPrev(next) { return lexidPrevStep(next, LEXID_STEP); }
  function lexidNextBefore(prev, before) {
    if (before <= prev) throw new Error('NextBefore: before <= prev (' + JSON.stringify({prev, before}) + ')');
    let prevPad = prev, beforePad = before;
    let p = LEXID_BLOCK - (prevPad.length % LEXID_BLOCK);
    if (p !== LEXID_BLOCK) prevPad = lexidPadding(prevPad, p);
    p = LEXID_BLOCK - (beforePad.length % LEXID_BLOCK);
    if (p !== LEXID_BLOCK) beforePad = lexidPadding(beforePad, p);
    if (prev === '' || before.startsWith(prev)) {
      const beforeTail = before.slice(prev.length);
      if (beforeTail === lexidPadding('', beforeTail.length)) {
        const padTo = LEXID_BLOCK * ((beforePad.length / LEXID_BLOCK) | 0);
        prevPad = lexidPadding(prevPad, padTo);
        if (prevPad === beforePad) {
          prevPad = lexidPadding('', padTo + LEXID_BLOCK);
        }
      }
    }
    const lDiff = prevPad.length - beforePad.length;
    if (lDiff > 0) beforePad = lexidPadding(beforePad, lDiff);
    else if (lDiff < 0) prevPad = lexidPadding(prevPad, -lDiff);

    const dist = lexidApproxDistance(prevPad, beforePad);
    if (dist > 0) {
      let step = LEXID_STEP;
      while (step / dist > 0.3) step = (step / 2) | 0;
      if (step > 0) {
        const next = lexidNextStep(prevPad, step);
        if (next < before) return next;
      }
    }
    const next = lexidAddTail(prevPad);
    if (prev > next || next > before) {
      throw new Error('lexid: cannot allocate between ' + JSON.stringify(prev) + ' and ' + JSON.stringify(before));
    }
    return next;
  }
  // posBetween mirrors nav.PosBetween server-side: empty bounds mean
  // "outside everything", so prev='' allocates Prev(next), next=''
  // allocates Next(prev), both empty allocates Middle().
  function navPosBetween(prev, next) {
    if (!prev && !next) return lexidMiddle();
    if (!next) return lexidNext(prev);
    if (!prev) return lexidPrev(next);
    return lexidNextBefore(prev, next);
  }

  // ---------- network log ----------
  // Capped FIFO of every API exchange so the right sidebar can render
  // exactly what went over the wire. Newest first.
  const NetLog = {
    cap: 100,
    entries: [],
    push(entry) {
      this.entries.unshift(entry);
      if (this.entries.length > this.cap) this.entries.length = this.cap;
      renderNetLog();
    },
    clear() { this.entries = []; renderNetLog(); },
  };

  // ---------- API ----------
  const api = {
    async call(method, path, body) {
      const init = { method, headers: {} };
      let reqBody = null;
      if (body !== undefined && body !== null) {
        init.body = typeof body === 'string' ? body : JSON.stringify(body);
        init.headers['Content-Type'] = 'application/json';
        reqBody = init.body;
      }
      const startedAt = performance.now();
      const ts = new Date();
      let resp, text = '', err = null;
      try {
        resp = await fetch(path, init);
        text = await resp.text();
      } catch (e) {
        err = e;
      }
      const dur = Math.round(performance.now() - startedAt);
      let json = null; try { json = text ? JSON.parse(text) : null; } catch (e) {}
      NetLog.push({
        ts, method, path,
        status: err ? 0 : resp.status,
        statusText: err ? (err.message || 'error') : resp.statusText,
        ok: !err && resp.ok,
        durationMs: dur,
        reqBody, respBody: text,
      });
      if (err) throw err;
      return { ok: resp.ok, status: resp.status, body: text, json };
    },
    get(p) { return this.call('GET', p); },
    post(p, b) { return this.call('POST', p, b); },
    put(p, b) { return this.call('PUT', p, b); },
    patch(p, b) { return this.call('PATCH', p, b); },
    del(p) { return this.call('DELETE', p); },
  };

  // ---------- state ----------
  // The page is driven by location.hash. App.route is the parsed
  // shape; renderMain dispatches on route.name. Spaces, types, and
  // object metadata are cached in App.spaces (keyed by spaceId) and
  // persisted to localStorage. Markdown content lives on
  // App.spaces[id].objects[oid].markdownContent — cache-only, NOT
  // persisted (would balloon the localStorage budget).
  const App = {
    accountId: null,
    route: { name: 'home' },
    spaces: {},
    queryScope: 'space',
    lastQuery: null, lastQueryParams: null, lastQueryScope: null,

    storageKey() { return 'any-app:' + (this.accountId || 'unknown'); },

    persist() {
      try {
        const snap = { spaces: {} };
        for (const [id, s] of Object.entries(this.spaces)) {
          const objs = {};
          for (const [oid, o] of Object.entries(s.objects || {})) {
            // Strip caches and live-runtime fields — persisted state
            // is just identity + types + lastRecord. markdownContent /
            // chatMessages get re-fetched on navigation;
            // chatComposing / chatFromAgent / chatLoading are session-local.
            const { markdownContent, chatMessages, chatLoading,
                    chatComposing, chatFromAgent, ...rest } = o;
            objs[oid] = rest;
          }
          snap.spaces[id] = {
            types: s.types, objects: objs,
            // Persist only the expanded-folder set across reloads;
            // children are always re-fetched.
            expanded: Array.from((s.tree && s.tree.expanded) || []),
          };
        }
        localStorage.setItem(this.storageKey(), JSON.stringify(snap));
      } catch (e) {}
    },
    rehydrate() {
      try {
        const raw = localStorage.getItem(this.storageKey());
        if (!raw) return;
        const snap = JSON.parse(raw);
        for (const [id, s] of Object.entries(snap.spaces || {})) {
          // De-duplicate type.props by propId. Older builds pushed on
          // every AddProperty call without checking for an existing
          // entry; that left repeated rows in localStorage that all
          // bound to the same propId and rendered as identical inputs.
          const types = s.types || {};
          for (const t of Object.values(types)) {
            if (!Array.isArray(t.props)) { t.props = []; continue; }
            const seen = new Set();
            t.props = t.props.filter(p => {
              if (!p || !p.id || seen.has(p.id)) return false;
              seen.add(p.id);
              return true;
            });
          }
          this.spaces[id] = {
            info: null, types, objects: s.objects || {},
            tree: {
              children: {}, // not persisted — re-fetched on demand
              expanded: new Set(s.expanded || []),
              loading: new Set(),
            },
            sync: defaultSyncState(),
          };
        }
      } catch (e) {}
    },

    activeSpace() { return this.route?.spaceId ? this.spaces[this.route.spaceId] : null; },
  };

  // ---------- helpers ----------
  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function shortId(s) { return s ? (s.length > 12 ? s.slice(0, 8) + '…' + s.slice(-3) : s) : ''; }
  function prettyJSON(v) { try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); } }
  function fmtTime(d) {
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function pretty(text) {
    if (!text) return '';
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
  }
  function cssEsc(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, m => '\\' + m); }
  function val(sel, root) { const el = (root || document).querySelector(sel); return el ? el.value : ''; }
  function toggle(sel) {
    const el = document.querySelector(sel);
    if (el) el.classList.toggle('collapsed');
  }
  function coerce(raw, kind) {
    if (kind === 'string') return raw;
    if (kind === 'number') {
      if (raw === '' || raw == null) return null;
      const n = Number(raw);
      if (Number.isNaN(n)) throw new Error('not a number: ' + raw);
      return n;
    }
    if (kind === 'boolean') return raw === 'true' || raw === true;
    if (kind === 'null') return null;
    if (kind === 'array' || kind === 'object') {
      if (raw === '' || raw == null) return kind === 'array' ? [] : {};
      return JSON.parse(raw);
    }
    return raw;
  }
  function stringify(v, kind) {
    if (v == null) return '';
    if (kind === 'array' || kind === 'object') return JSON.stringify(v);
    return String(v);
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(kind, msg, body) {
    const el = document.getElementById('toast');
    el.className = 'toast show ' + (kind || '');
    el.innerHTML = '<div>' + escapeHTML(msg) + '</div>' +
      (body ? '<div class="body">' + escapeHTML(body) + '</div>' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 6000 : 2500);
  }

  // ---------- API actions ----------
  async function loadAccount() {
    const r = await api.get('/v1/account');
    if (!r.ok) throw new Error('GET /v1/account: ' + r.body);
    App.accountId = r.json.id;
    document.getElementById('acct-id').textContent = App.accountId;
  }

  // updateAccountMetadata wraps PUT /v1/account/metadata. The SDK
  // rejects empty bodies; the caller must include at least one of
  // name / description / iconCid.
  async function updateAccountMetadata(meta) {
    const r = await api.put('/v1/account/metadata', meta);
    if (!r.ok) {
      const code = r.json?.error?.code || r.status;
      throw new Error('PUT /v1/account/metadata (' + code + '): ' +
        (r.json?.error?.message || r.body));
    }
  }
  // defaultSyncState is the zero value for the Debug-tab cache. Lives
  // here so ensureSpace, rehydrate, and any future migration path
  // share the same shape — older snapshots that pre-date this field
  // are backfilled lazily on every ensureSpace call.
  function defaultSyncState() {
    return {
      space: null,           // SpaceSyncStatusResponse
      debug: null,           // SpaceDebugResponse (peer counters)
      object: null,          // last per-object sync-status lookup
      debugObject: null,     // last per-object debug lookup
      lastObjectId: '',      // sticky input value across renders
      loading: false,
      live: false,           // account-wide /sync-status/subscribe toggle
      laggedTotal: 0,        // surfaced count of dropped status events
    };
  }

  function ensureSpace(id, info) {
    if (!App.spaces[id]) {
      App.spaces[id] = {
        info: info || null,
        types: {},
        objects: {},
        tree: { children: {}, expanded: new Set(), loading: new Set() },
        sync: defaultSyncState(),
      };
    } else {
      if (info) App.spaces[id].info = info;
      // Backfill `sync` for spaces rehydrated from older localStorage
      // snapshots (or any future field that hasn't been seeded). Tab
      // renderers expect this to exist before the user lands on
      // them, so a missing field is what was breaking the Debug tab.
      if (!App.spaces[id].sync) App.spaces[id].sync = defaultSyncState();
    }
    return App.spaces[id];
  }
  async function refreshSpaces() {
    const r = await api.get('/v1/spaces');
    if (!r.ok) throw new Error('GET /v1/spaces: ' + r.body);
    const list = (r.json && r.json.spaces) || [];
    const seen = new Set();
    for (const info of list) {
      seen.add(info.id);
      ensureSpace(info.id, info);
    }
    for (const id of Object.keys(App.spaces)) {
      if (!seen.has(id)) delete App.spaces[id];
    }
  }
  async function createSpace({ name, description }) {
    const r = await api.post('/v1/spaces', { name, description });
    if (!r.ok) { toast('err', 'create space failed', r.body); return null; }
    ensureSpace(r.json.id, r.json);
    toast('ok', 'space created');
    return r.json;
  }
  async function deleteSpace(id) {
    const r = await api.del('/v1/spaces/' + encodeURIComponent(id));
    if (!r.ok) { toast('err', 'delete space failed', r.body); return false; }
    if (App.spaces[id]) App.spaces[id].info.status = 'deleted';
    toast('ok', 'space deleted (soft)');
    return true;
  }
  // updateSpaceMetadata patches name / description / iconCid on the
  // in-space spaceIndex object. Pointer-to-string semantics — `body`
  // mirrors the wire shape: include only fields the caller wants to
  // touch; an empty string clears the field. The server's mirror to
  // the local tech-space row runs async, so we re-GET the row to
  // refresh the cached App.spaces entry before re-rendering.
  async function updateSpaceMetadata(spaceId, body) {
    const r = await api.patch('/v1/spaces/' + encodeURIComponent(spaceId), body);
    if (!r.ok) { toast('err', 'update space failed', r.body); return false; }
    toast('ok', 'space updated');
    // Brief settle window for the async mirror, then refetch.
    await new Promise(r => setTimeout(r, 150));
    const get = await api.get('/v1/spaces/' + encodeURIComponent(spaceId));
    if (get.ok && get.json) ensureSpace(spaceId, get.json);
    return true;
  }
  async function createType(spaceId, { name, description }) {
    const r = await api.post('/v1/spaces/' + spaceId + '/types', { name, description });
    if (!r.ok) { toast('err', 'create type failed', r.body); return null; }
    const t = { id: r.json.typeId, name, description, props: [] };
    App.spaces[spaceId].types[t.id] = t;
    toast('ok', 'type created');
    return t;
  }
  async function addProperty(spaceId, typeId, { name, xKey, kind }) {
    const r = await api.post(
      '/v1/spaces/' + spaceId + '/types/' + typeId + '/properties',
      { name, xKey, kind });
    if (!r.ok) { toast('err', 'add property failed', r.body); return null; }
    const p = { id: r.json.propId, name, xKey, kind };
    const existing = App.spaces[spaceId].types[typeId].props.find(x => x.id === p.id);
    if (existing) Object.assign(existing, p);
    else App.spaces[spaceId].types[typeId].props.push(p);
    toast('ok', 'property added');
    return p;
  }
  async function createObject(spaceId, { types, initialProperties, nav }) {
    const body = {};
    if (types && types.length) body.types = types;
    if (initialProperties && Object.keys(initialProperties).length) body.initialProperties = initialProperties;
    if (nav) body.nav = nav;
    const r = await api.post('/v1/spaces/' + spaceId + '/objects', body);
    if (!r.ok) { toast('err', 'create object failed', r.body); return null; }
    const o = { id: r.json.objectId, types: types || [], lastRecord: null };
    App.spaces[spaceId].objects[o.id] = o;
    toast('ok', 'object created');
    return o;
  }
  // loadTreeChildren queries POST /v1/spaces/:id/objects/query for
  // direct children of `parentId`, sorted by nav.pos. Cached on
  // App.spaces[id].tree.children[parentId]; rerunning replaces the
  // cached list. Folder rows in the returned set seed
  // App.spaces[id].objects so the editor / sibling code has a name to
  // render before a full record load.
  async function loadTreeChildren(spaceId, parentId) {
    const sp = App.spaces[spaceId];
    if (!sp) return [];
    if (sp.tree.loading.has(parentId)) return sp.tree.children[parentId] || [];
    sp.tree.loading.add(parentId);
    try {
      const r = await api.post('/v1/spaces/' + spaceId + '/objects/query', {
        filter: { 'nav.parentId': parentId },
        sort: ['nav.pos'],
        limit: TREE_PAGE_SIZE,
      });
      if (!r.ok) {
        toast('err', 'tree load failed', r.body);
        return sp.tree.children[parentId] || [];
      }
      const records = (r.json && r.json.records) || [];
      const children = [];
      for (const raw of records) {
        let rec; try { rec = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { continue; }
        if (!rec || !rec.id) continue;
        // Skip type-meta rows — types are objects too in this collection.
        const typesArr = (rec.any && Array.isArray(rec.any.types)) ? rec.any.types : [];
        if (typesArr.includes('__type__')) continue;
        const navNode = rec.nav || {};
        const child = {
          id: rec.id,
          name: (rec.any && rec.any.name) || '',
          navType: navNode.type || NAV_TYPE_ITEM,
          parentId: navNode.parentId || '',
          pos: navNode.pos || '',
          types: typesArr.filter(t => t !== '__type__'),
        };
        children.push(child);
        // Seed objects map so list rendering and editor pick up
        // names / types without a separate load.
        const existing = sp.objects[rec.id];
        if (!existing) {
          sp.objects[rec.id] = { id: rec.id, types: child.types, lastRecord: rec };
        } else {
          existing.types = child.types.length ? child.types : existing.types;
          existing.lastRecord = rec;
        }
      }
      sp.tree.children[parentId] = children;
      return children;
    } finally {
      sp.tree.loading.delete(parentId);
    }
  }
  async function loadObject(spaceId, objectId) {
    const r = await api.get('/v1/spaces/' + spaceId + '/properties/' + objectId);
    if (!r.ok) { toast('err', 'load properties failed', r.body); return null; }
    const obj = App.spaces[spaceId].objects[objectId];
    if (obj) obj.lastRecord = r.json.record;
    return r.json.record;
  }
  async function setBase(spaceId, objectId, typeId, patch) {
    const r = await api.post(
      '/v1/spaces/' + spaceId + '/properties/' + objectId + '/base/' + typeId,
      { patch });
    if (!r.ok) { toast('err', 'save failed', r.body); return null; }
    const rejections = (r.json && r.json.rejections) || [];
    if (rejections.length > 0) {
      const lines = rejections.map(rej => '· ' + rej.reason).join('\n');
      toast('err', rejections.length + ' op(s) rejected', lines);
    } else {
      toast('ok', 'saved · v' + (r.json.versionId || ''));
    }
    await loadObject(spaceId, objectId);
    return r.json;
  }
  async function deleteObject(spaceId, objectId) {
    const r = await api.del('/v1/spaces/' + spaceId + '/objects/' + objectId);
    if (!r.ok) { toast('err', 'delete object failed', r.body); return false; }
    delete App.spaces[spaceId].objects[objectId];
    toast('ok', 'object deleted');
    return true;
  }
  async function querySpace(spaceId, body) {
    const r = await api.post('/v1/spaces/' + spaceId + '/query', body);

    return r.json;

  async function querySpaceObjects(spaceId, body) {

  async function loadMarkdown(spaceId, objectId) {
    const r = await api.get('/v1/spaces/' + spaceId + '/objects/' + encodeURIComponent(objectId) + '/editor/markdown');
    if (!r.ok) { toast('err', 'load markdown failed', r.body); return null; }
    const obj = App.spaces[spaceId]?.objects[objectId];
    if (obj) obj.markdownContent = (r.json && typeof r.json.content === 'string') ? r.json.content : '';
    return obj ? obj.markdownContent : '';
  }
  async function saveMarkdown(spaceId, objectId, content) {
    const r = await api.put(
      '/v1/spaces/' + spaceId + '/objects/' + encodeURIComponent(objectId) + '/editor/markdown',
      { content });
    if (!r.ok) { toast('err', 'save markdown failed', r.body); return null; }
    const j = r.json || {};
    const ins = (j.inserted || []).length;
    const upd = (j.updated || []).length;
    const del = (j.deleted || []).length;
    const unc = j.unchanged || 0;
    toast('ok', 'markdown saved',
      ins + ' inserted · ' + upd + ' updated · ' + del + ' deleted · ' + unc + ' unchanged');
    const obj = App.spaces[spaceId]?.objects[objectId];
    if (obj) obj.markdownContent = content;
    return j;
  }
  // ---------- chat helpers ----------
  // Cache shape on App.spaces[s].objects[o]:
  //   chatMessages   — last fetched page in ascending creation order, or
  //                    undefined when not yet loaded
  //   chatLoading    — bool, suppresses parallel re-fetch storms
  //   chatComposing  — preserved textarea content across re-renders, so a
  //                    live update doesn't blow away what the user typed
  //   chatStream     — the EventSource handle so unmount can close it
  const objectMessagesPath = (sp, oid) =>
    '/v1/spaces/' + encodeURIComponent(sp) + '/objects/' + encodeURIComponent(oid) + '/chat/messages';

  async function loadChatMessages(spaceId, objectId) {
    const obj = App.spaces[spaceId]?.objects[objectId];
    if (!obj) return null;
    if (obj.chatLoading) return obj.chatMessages || [];
    obj.chatLoading = true;
    try {
      const r = await api.get(objectMessagesPath(spaceId, objectId));
      if (!r.ok) {
        toast('err', 'load messages failed', r.body);
        return obj.chatMessages || [];
      }
      obj.chatMessages = (r.json && Array.isArray(r.json.messages)) ? r.json.messages : [];
      return obj.chatMessages;
    } finally {
      obj.chatLoading = false;
    }
  }
  async function sendChatMessage(spaceId, objectId, text, replyTo, fromAgent) {
    const body = { text };
    if (replyTo) body.replyToMessageId = replyTo;
    if (fromAgent) body.fromAgent = fromAgent;
    const r = await api.post(objectMessagesPath(spaceId, objectId), body);
    if (!r.ok) { toast('err', 'send failed', r.body); return null; }

  async function editChatMessage(spaceId, objectId, msgId, text) {

  // bindTypes attaches additional type ids to an existing object by
  // setting any.types to the merged list. Reloads the record so the
  // editor picks up the new type defs on the next render.
  async function bindTypes(spaceId, objectId, addedTypeIds) {
    const sp = App.spaces[spaceId];
    if (!sp) return false;
    const obj = sp.objects[objectId];
    if (!obj) return false;
    const existing = (obj.types || []).slice();
    const merged = Array.from(new Set([...existing, ...addedTypeIds]));
    if (merged.length === existing.length) {
      toast('ok', 'no new types to bind');
      return false;
    }
    const r = await setBase(spaceId, objectId, 'any', { types: merged });
    if (!r) return false;
    const rec = obj.lastRecord || {};
    const recTypes = (rec.any && Array.isArray(rec.any.types))
      ? rec.any.types.filter(t => t !== '__type__')
      : merged;
    obj.types = recTypes;
    return true;
  }
  // refreshObjects pulls the live list from the per-space `objects`
  // collection and reconciles into App.spaces[spaceId].objects.
  async function refreshObjects(spaceId) {
    const sp = App.spaces[spaceId];
    if (!sp) return;
    const r = await api.post('/v1/spaces/' + spaceId + '/objects/query', { limit: OBJECTS_QUERY_LIMIT });
    if (!r.ok) { toast('err', 'list objects failed', r.body); return; }
    const records = (r.json && r.json.records) || [];
    const seen = new Set();
    for (const raw of records) {
      let rec; try { rec = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { continue; }
      if (!rec || !rec.id) continue;
      // Skip type-meta rows (the per-space `objects` collection holds
      // both regular objects and types — types carry __type__ in
      // any.types). The types page handles those separately.
      const types = (rec.any && Array.isArray(rec.any.types)) ? rec.any.types : [];
      if (types.includes('__type__')) continue;
      seen.add(rec.id);
      const existing = sp.objects[rec.id];
      const userTypes = types.filter(t => t !== '__type__');
      if (!existing) {
        sp.objects[rec.id] = { id: rec.id, types: userTypes, lastRecord: rec };
      } else {
        existing.types = userTypes.length ? userTypes : existing.types;
        existing.lastRecord = rec;
      }
    }
    for (const id of Object.keys(sp.objects)) {
      if (!seen.has(id)) delete sp.objects[id];
    }
    sp.objectsTruncated = records.length >= OBJECTS_QUERY_LIMIT;
  }
  async function refreshTypes(spaceId) {
    const sp = App.spaces[spaceId];
    if (!sp) return;
    const r = await api.get('/v1/spaces/' + spaceId + '/types');
    if (!r.ok) { toast('err', 'list types failed', r.body); return; }
    const list = (r.json && r.json.types) || [];
    const seen = new Set();
    for (const t of list) {
      seen.add(t.id);
      const existing = sp.types[t.id] || { id: t.id, props: [] };
      sp.types[t.id] = {
        id:          t.id,
        name:        t.name || existing.name || '',
        description: t.description || existing.description || '',
        builtIn:     !!t.builtIn,
        props:       existing.props || [],
      };
    }
    for (const id of Object.keys(sp.types)) {
      if (!seen.has(id)) delete sp.types[id];
    }
    await Promise.all(list.map(async (t) => {
      const pr = await api.get('/v1/spaces/' + spaceId + '/types/' + t.id + '/properties');
      if (!pr.ok) return;
      const props = (pr.json && pr.json.properties) || [];
      sp.types[t.id].props = props.map(p => ({
        id: p.id, name: p.name, description: p.description,
        xKey: p.xKey, kind: p.kind || 'string',
      }));
    }));
  }

  // ---------- tree actions ----------
  // refreshTree drops every cached child list for the space and
  // re-fetches the root level plus every currently-expanded folder.
  // Call this after any operation that could rename or move objects
  // — the tree's cached `name` / `pos` entries don't otherwise update.
  async function refreshTree(spaceId) {
    const sp = App.spaces[spaceId];
    if (!sp) return;
    sp.tree.children = {};
    const ids = [NAV_ROOT_PARENT, ...Array.from(sp.tree.expanded || [])];
    await Promise.all(ids.map(id => loadTreeChildren(spaceId, id)));
    renderTree();
  }

  async function toggleFolder(spaceId, folderId) {
    const sp = App.spaces[spaceId];
    if (!sp) return;
    if (sp.tree.expanded.has(folderId)) {
      sp.tree.expanded.delete(folderId);
    } else {
      sp.tree.expanded.add(folderId);
      if (!sp.tree.children[folderId]) {
        renderTree(); // show loading
        await loadTreeChildren(spaceId, folderId);
      }
    }
    renderTree();
    App.persist();
  }

  // createTreeChild creates a new item or folder under parentId. Empty
  // parentId means "at root". Reloads the tree so the new row appears,
  // and navigates into the new object's editor on success.
  async function createTreeChild(spaceId, parentId, navType) {
    const sp = App.spaces[spaceId];
    if (!sp) return;
    const o = await createObject(spaceId, {
      types: [],
      nav: { type: navType, parentId: parentId || '' },
    });
    if (!o) return;
    // For folders we expand them so the user sees they can drop
    // children inside.
    if (navType === NAV_TYPE_FOLDER) sp.tree.expanded.add(o.id);
    await refreshTree(spaceId);
    App.persist();
    navigate(spaceUrl(spaceId, 'objects', o.id));
  }

  // ---------- members + invites ----------
  // Members panel data is cached on App.spaces[id].sharing — populated

  // ---------- sync-status + debug loaders ----------

  // syncStatusStream is the active EventSource handle on the
  // account-wide /v1/sync-status/subscribe stream. We use the
  // account-wide variant (not per-space) because there is no
  // per-space subscribe endpoint — the SDK call is account-scoped.
  // We filter on event.spaceId === current to update only the open
  // space's cached rollup.
  let syncStatusStream = null;
  function mountSyncStatusLive(spaceId) {
    unmountSyncStatusLive();
    const sp = App.spaces[spaceId]; if (!sp) return;
    sp.sync.live = true;
    const es = new EventSource('/v1/sync-status/subscribe');
    es.addEventListener('status', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        // Account-wide stream: filter to the active space only.
        if (!data || data.spaceId !== spaceId) return;
        const cur = App.spaces[spaceId];
        if (!cur) return;
        cur.sync.space = data;
        // Only re-render if we're still on the debug page for this
        // space — keeps event flips invisible from other tabs.
        if (App.route.name === 'space-debug' && App.route.spaceId === spaceId) {
          renderDebugPanels();
        }
      } catch (e) { /* malformed frame — drop */ }
    });
    es.addEventListener('lagged', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        const cur = App.spaces[spaceId];
        if (cur) cur.sync.laggedTotal = (data && data.total) || cur.sync.laggedTotal;
      } catch (e) {}
    });
    es.addEventListener('closed', () => { unmountSyncStatusLive(); });
    es.addEventListener('error', () => {
      // EventSource auto-reconnects; nothing to do. A stuck stream
      // shows up as a stale rollup, easy to spot in the UI.
    });
    syncStatusStream = { es, spaceId };
  }
  function unmountSyncStatusLive() {
    if (syncStatusStream) {
      try { syncStatusStream.es.close(); } catch (e) {}
      const sp = App.spaces[syncStatusStream.spaceId];
      if (sp) sp.sync.live = false;
      syncStatusStream = null;
    }
  }

  async function refreshMembers(spaceId) {
    const sp = App.spaces[spaceId];

    sp.sharing.loading = true;

    try {
      const [m, req, inv] = await Promise.all([
        api.get('/v1/spaces/' + encodeURIComponent(spaceId) + '/members'),
        api.get('/v1/spaces/' + encodeURIComponent(spaceId) + '/members/requests'),
        api.get('/v1/spaces/' + encodeURIComponent(spaceId) + '/invites'),

      sp.sharing = {
        members:  (m.ok && m.json && m.json.members) || [],
        requests: (req.ok && req.json && req.json.requests) || [],
        invites:  (inv.ok && inv.json && inv.json.invites) || [],
      };
      if (!m.ok)   toast('err', 'members list failed', m.body);
      if (!req.ok) toast('err', 'requests list failed', req.body);
