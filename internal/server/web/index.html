  function renderObjectTypeSection(o, t, rec) {
    if (t.id === MD_TYPE_ID) return ''; // md has no editable props in v1
    if (t.id === CHAT_TYPE_ID) return ''; // chat is rendered as its own panel
    if (t.id === NAV_TYPE_ID) return ''; // nav is managed by the left tree
    const tnode = rec[t.id] || {};
    const seen = new Set();
    const props = (t.props || []).filter(p => {
      if (!p || !p.id || seen.has(p.id)) return false;
      seen.add(p.id);
      return true;
    });
    const builtBadge = t.id === 'any' ? ' <span class="pill">built-in</span>' : '';
    if (props.length === 0) {
      return '<div class="type-section"><h4>' + escapeHTML(t.name || t.id) + builtBadge + '</h4>' +
        '<p style="color:var(--muted);font-size:12px;margin:0">no property definitions.</p>' +
      '</div>';
    }
    const nameCounts = {};
    for (const p of props) nameCounts[p.name] = (nameCounts[p.name] || 0) + 1;
    const nameOrdinals = {};
    const rows = props.map(p => {
      const readOnly = t.id === 'any' && ANY_AUTO_PROP_IDS.has(p.id);
      // any-scope auto props (id, author, spaceId, createdAt) live at
      // the record root, alongside id — not under rec.any.
      const cur = readOnly ? rec[p.id] : tnode[p.id];
      let suffix = '';
      if (nameCounts[p.name] > 1) {
        nameOrdinals[p.name] = (nameOrdinals[p.name] || 0) + 1;
        suffix = ' #' + nameOrdinals[p.name];
      }
      return renderEditRow(o.id, t, p, cur, readOnly, suffix);
    }).join('');
    return '<div class="type-section"><h4>' + escapeHTML(t.name || t.id) + builtBadge + '</h4>' +
      rows +
    '</div>';
  }

  function renderEditRow(objectId, t, p, cur, readOnly, suffix) {
    const inputId = 'edit:' + objectId + ':' + t.id + ':' + p.id;
    const dataAttr = readOnly ? '' : ' data-edit="' + escapeHTML(inputId) + '"';
    suffix = suffix || '';
    const ro = readOnly ? ' disabled' : '';
    let control;
    if (readOnly) {
      const display = cur === undefined ? '(unset)' : stringify(cur, p.kind);
      control = '<div style="font:12px var(--mono);color:var(--muted);padding:6px 0">' +
        escapeHTML(display) + '</div>';
    } else if (p.kind === 'boolean') {
      control =
        '<select' + dataAttr + ro + '>' +
          '<option value=""' + (cur === undefined ? ' selected' : '') + '>(unset)</option>' +
          '<option value="true"' + (cur === true ? ' selected' : '') + '>true</option>' +
          '<option value="false"' + (cur === false ? ' selected' : '') + '>false</option>' +
        '</select>';
    } else if (p.kind === 'number') {
      control = '<input type="number"' + dataAttr + ro + ' value="' + escapeHTML(stringify(cur, p.kind)) + '">';
    } else if (p.kind === 'array' || p.kind === 'object') {
      control = '<textarea' + dataAttr + ro + ' placeholder="JSON ' + p.kind + '">' + escapeHTML(stringify(cur, p.kind)) + '</textarea>';
    } else {
      control = '<input type="text"' + dataAttr + ro + ' value="' + escapeHTML(stringify(cur, p.kind)) + '">';
    }
    const tag = readOnly
      ? '<span class="pill" title="auto-managed by SDK">auto</span>'
      : (cur === undefined ? '<span class="pill">unset</span>' : '');
    return '<div class="obj-edit-row">' +
      '<div class="pname" title="' + escapeHTML(p.id) + '">' + escapeHTML(p.name) + escapeHTML(suffix) +
        '<span class="pkind">' + escapeHTML(p.kind) + '</span>' +
        '<span class="pid" title="' + escapeHTML(p.id) + '">' + escapeHTML(p.id) + '</span>' +
      '</div>' +
      '<div>' + control + '</div>' +
      '<div style="font:11px var(--mono);color:var(--muted);text-align:right">' + tag + '</div>' +
    '</div>';
  }

  // ---------- tree drag-and-drop ----------
  // Drag state lives on App.drag. Set on dragstart from a tree row;
  // cleared on dragend or after a successful drop.
  App.drag = null;

  function dragRowSelector(t) { return t.closest && t.closest('.tree-row[data-id]'); }
  function dragRootSelector(t) { return t.closest && t.closest('[data-tree-droproot]'); }
  function dragEmptyFolderSelector(t) { return t.closest && t.closest('[data-tree-empty-folder]'); }

  // dropZoneOf classifies a dragover event relative to a tree-row:
  // top quarter → 'before', middle half → 'into' (folders only,
  // otherwise 'after'), bottom quarter → 'after'. Returns null on
  // unrecognized targets.
  function dropZoneOf(row, event) {
    const rect = row.getBoundingClientRect();
    const y = event.clientY - rect.top;
    const isFolder = row.dataset.folder === '1';
    if (y < rect.height * 0.25) return 'before';
    if (y > rect.height * 0.75) return 'after';
    return isFolder ? 'into' : 'after';
  }

  // clearDropMarkers removes any drop-target highlight classes. Called
  // before painting the new target on dragover and on dragend/drop.
  function clearDropMarkers() {
    document.querySelectorAll('.tree-row.drop-into, .tree-row.drop-before, .tree-row.drop-after, .tree-droproot.drop-active, .tree-empty.drop-active')
      .forEach(el => {
        el.classList.remove('drop-into', 'drop-before', 'drop-after', 'drop-active');
      });
  }

  // isDescendant returns true if `targetId` is a descendant (or self)
  // of `ancestorId` in the cached tree. Used to forbid drops that
  // would create a cycle (folder into itself or its subtree).
  function isDescendant(sp, ancestorId, targetId) {
    if (!ancestorId) return false; // root has no ancestor cycle
    if (ancestorId === targetId) return true;
    const visit = [ancestorId];
    while (visit.length) {
      const cur = visit.pop();
      const kids = sp.tree.children[cur] || [];
      for (const k of kids) {
        if (k.id === targetId) return true;
        if (k.navType === NAV_TYPE_FOLDER) visit.push(k.id);
      }
    }
    return false;
  }

  // resolveDrop computes (newParentId, newPos) from a drop event.
  // Returns null when the drop is invalid (cycle, no-op move).
  function resolveDrop(sp, draggedId, target, zone) {
    let parentId, prevPos = '', nextPos = '';
    if (target.kind === 'root') {
      parentId = NAV_ROOT_PARENT;
      const kids = sp.tree.children[NAV_ROOT_PARENT] || [];
      // Drop at end of root.
      const last = kids[kids.length - 1];
      prevPos = last ? last.pos : '';
    } else if (zone === 'into') {
      parentId = target.id;
      const kids = sp.tree.children[parentId] || [];
      const last = kids[kids.length - 1];
      prevPos = last ? last.pos : '';
    } else {
      // before/after: same parent as the target row, position relative
      // to it. Reads parent siblings from cache so prev/next bound
      // computations work even when the target is mid-list.
      parentId = target.parentId;
      const kids = sp.tree.children[parentId] || [];
      const idx = kids.findIndex(k => k.id === target.id);
      if (idx < 0) return null;
      if (zone === 'before') {
        prevPos = idx > 0 ? kids[idx - 1].pos : '';
        nextPos = kids[idx].pos;
      } else { // after
        prevPos = kids[idx].pos;
        nextPos = idx + 1 < kids.length ? kids[idx + 1].pos : '';
      }
    }
    if (isDescendant(sp, draggedId, parentId)) return null;
    // No-op detection: dragging a row into the slot it already occupies.
    const dragged = findChild(sp, draggedId);
    if (dragged && dragged.parentId === parentId &&
        dragged.pos > prevPos && (!nextPos || dragged.pos < nextPos)) {
      // The dragged row already sits in this gap — would just rewrite
      // the same slot. Skip the network round-trip.
      return null;
    }
    let pos;
    try { pos = navPosBetween(prevPos, nextPos); }
    catch (e) {
      console.error('lexid alloc failed', e, { prevPos, nextPos });
      toast('err', 'cannot place here', e.message || String(e));
      return null;
    }
    return { parentId, pos };
  }

  // findChild walks the cached children sets to locate a row by id.
  // Used by resolveDrop's no-op detection.
  function findChild(sp, id) {
    for (const k of Object.keys(sp.tree.children)) {
      const list = sp.tree.children[k] || [];
      for (const c of list) {
        if (c.id === id) return c;
      }
    }
    return null;
  }

  document.addEventListener('dragstart', (e) => {
    const row = dragRowSelector(e.target);
    if (!row) return;
    App.drag = {
      id: row.dataset.id,
      parentId: row.dataset.parent || '',
      pos: row.dataset.pos || '',
    };
    row.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      // Some browsers ignore drops without setData.
      e.dataTransfer.setData('text/plain', row.dataset.id);
    }
  });

  document.addEventListener('dragend', () => {
    document.querySelectorAll('.tree-row.dragging').forEach(el => el.classList.remove('dragging'));
    clearDropMarkers();
    App.drag = null;
  });

  document.addEventListener('dragover', (e) => {
    if (!App.drag) return;
    const row = dragRowSelector(e.target);
    const rootZone = dragRootSelector(e.target);
    const emptyZone = dragEmptyFolderSelector(e.target);
    if (!row && !rootZone && !emptyZone) return;
    e.preventDefault(); // allow drop
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    clearDropMarkers();
    if (row) {
      // Don't show drop hints on the dragged row itself.
      if (row.dataset.id === App.drag.id) return;
      const zone = dropZoneOf(row, e);
      row.classList.add('drop-' + zone);
    } else if (emptyZone) {
      emptyZone.classList.add('drop-active');
    } else {
      rootZone.classList.add('drop-active');
    }
  });

  document.addEventListener('drop', async (e) => {
    if (!App.drag) return;
    const row = dragRowSelector(e.target);
    const rootZone = dragRootSelector(e.target);
    const emptyZone = dragEmptyFolderSelector(e.target);
    if (!row && !rootZone && !emptyZone) return;
    e.preventDefault();
    e.stopPropagation();
    const draggedId = App.drag.id;
    clearDropMarkers();
    document.querySelectorAll('.tree-row.dragging').forEach(el => el.classList.remove('dragging'));
    App.drag = null;

    const sp = App.activeSpace();
    if (!sp) return;

    let target, zone;
    if (row && row.dataset.id !== draggedId) {
      target = {
        kind: 'row',
        id: row.dataset.id,
        parentId: row.dataset.parent || '',
        pos: row.dataset.pos || '',
      };
      zone = dropZoneOf(row, e);
    } else if (emptyZone) {
      target = { kind: 'row', id: emptyZone.dataset.treeEmptyFolder, parentId: '', pos: '' };
      zone = 'into';
    } else if (rootZone) {
      target = { kind: 'root' };
      zone = 'into';
    } else {
      return;
    }
    const result = resolveDrop(sp, draggedId, target, zone);
    if (!result) return;
    try {
      // Single setBase on the `nav` namespace flips both fields atomically.
      const r = await setBase(App.route.spaceId, draggedId, NAV_TYPE_ID, {
        parentId: result.parentId,
        pos: result.pos,
      });
      if (!r) return;
      await refreshTree(App.route.spaceId);
      App.persist();
    } catch (err) {
      console.error(err);
      toast('err', 'drop failed', err.message || String(err));
    }
  });

  // ---------- net log render ----------
  function renderNetLog() {
    const list = document.getElementById('netlog-list');
    if (!list) return;
    if (NetLog.entries.length === 0) {
      list.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:12px">no requests yet.</div>';
      return;
    }
    list.innerHTML = NetLog.entries.map((e, i) => {
      const sCls = e.ok ? 'ok' : 'err';
      const sTxt = e.status === 0 ? 'ERR' : String(e.status);
      const reqHTML = e.reqBody
        ? '<div class="label">request body</div><pre>' + escapeHTML(pretty(e.reqBody)) + '</pre>'
        : '';
      const respHTML = '<div class="label">response body</div><pre>' +
        escapeHTML(e.respBody ? pretty(e.respBody) : (e.statusText || '(empty)')) + '</pre>';
      return '<div class="netlog-entry" data-net-i="' + i + '">' +
        '<div class="head">' +
          '<span class="ts">' + fmtTime(e.ts) + '</span>' +
          '<span class="method ' + escapeHTML(e.method) + '">' + escapeHTML(e.method) + '</span>' +
          '<span class="path" title="' + escapeHTML(e.path) + '">' + escapeHTML(e.path) + '</span>' +
          '<span class="status ' + sCls + '">' + sTxt + '</span>' +
          '<span class="ts">' + e.durationMs + 'ms</span>' +
        '</div>' +
        '<div class="body">' + reqHTML + respHTML + '</div>' +
      '</div>';
    }).join('');
  }

  // ---------- click handlers ----------
  // chat-submit fires when the textarea sees a bare Enter — re-route
  // it through the same click pipeline that handles the send button
  // so the action logic stays in one place.
  document.addEventListener('chat-submit', (e) => {
    const ta = e.target;
    if (!ta || !ta.dataset || ta.dataset.input !== 'chat-text') return;
    const id = ta.dataset.id;
    const btn = document.querySelector('[data-act="chat-send"][data-id="' + cssEsc(id) + '"]');
    if (btn) btn.click();
  });

  document.addEventListener('click', async (e) => {
    const t = e.target;
    const ne = t.closest && t.closest('.netlog-entry');
    if (ne) { ne.classList.toggle('open'); return; }

    // tree row click: chevron toggles expand; everything else opens
    // the object editor (for items) or toggles the folder (for
    // folders, when the row body — not the chevron — is clicked).
    const treeChev = t.closest && t.closest('[data-tree-act]');
    if (treeChev) {
      const act = treeChev.dataset.treeAct;
      const id = treeChev.dataset.id;
      const sp = App.activeSpace();
      if (!sp) return;
      e.stopPropagation();
      try {
        if (act === 'toggle') {
          await toggleFolder(App.route.spaceId, id);
          renderTree();
        } else if (act === 'open') {
          // Body click — open the editor. Folders can be renamed and
          // their nav fields tweaked there. Use the chevron to expand.
          navigate(spaceUrl(App.route.spaceId, 'objects', id));
        } else if (act === 'new-item') {
          await createTreeChild(App.route.spaceId, id, NAV_TYPE_ITEM);
        } else if (act === 'new-folder') {
          await createTreeChild(App.route.spaceId, id, NAV_TYPE_FOLDER);
        }
      } catch (err) {
        console.error(err);
        toast('err', 'tree action failed', err.message || String(err));
      }
      return;
    }

    if (!t.dataset || !t.dataset.act) return;
    const act = t.dataset.act;
    const id = t.dataset.id;
    const spaceId = App.route.spaceId;

    try {
      switch (act) {
        case 'tree-new-item':
          if (!spaceId) { toast('err', 'pick a space first'); break; }
          await createTreeChild(spaceId, NAV_ROOT_PARENT, NAV_TYPE_ITEM);
          break;
        case 'tree-new-folder':
          if (!spaceId) { toast('err', 'pick a space first'); break; }
          await createTreeChild(spaceId, NAV_ROOT_PARENT, NAV_TYPE_FOLDER);
          break;
        case 'tree-refresh':
          if (!spaceId) break;
          await refreshTree(spaceId);
          break;
        case 'new-type-toggle':
          toggle('[data-form="new-type"]'); break;
        case 'new-object-toggle':
          toggle('[data-form="new-object"]'); break;
        case 'add-prop-toggle':
          toggle('[data-form="add-prop:' + cssEsc(id) + '"]'); break;
        case 'reload-object':
          await loadObject(spaceId, id); render(); break;
        case 'create-type': {
          const name = val('[data-input="type-name"]');
          const description = val('[data-input="type-description"]');
          if (!name) { toast('err', 'name required'); return; }
          await createType(spaceId, { name, description });
          App.persist();
          render();
          break;
        }
        case 'add-prop': {
          const name = val('[data-input="prop-name:' + cssEsc(id) + '"]');
          const xKey = val('[data-input="prop-xkey:' + cssEsc(id) + '"]');
          const kind = val('[data-input="prop-kind:' + cssEsc(id) + '"]');
          if (!name) { toast('err', 'name required'); return; }
          await addProperty(spaceId, id, { name, xKey, kind });
          await refreshTypes(spaceId);
          App.persist();
          render();
          toggle('[data-form="add-prop:' + cssEsc(id) + '"]');
          break;
        }
        case 'create-object': {
          const checks = document.querySelectorAll('[data-input="new-obj-type"]:checked');
          const types = Array.from(checks).map(c => c.value);
          if (types.length === 0) { toast('err', 'pick at least one type'); return; }
          const o = await createObject(spaceId, { types });
          if (o) {
            App.persist();
            // New object lands at root with a fresh nav row; full tree
            // refresh keeps any sibling positions in sync too.
            refreshTree(spaceId).catch(() => {});
            // Navigate straight into the new object's editor — the
            // most common next step is to fill in name/properties.
            navigate(spaceUrl(spaceId, 'objects', o.id));
          }
          break;
        }
        case 'save-object':
          await saveObjectChanges(spaceId, id);
          break;
        case 'delete-object': {
          if (!confirm('delete object ' + id + '?')) return;
          if (await deleteObject(spaceId, id)) {
            App.persist();
            navigate(spaceUrl(spaceId, 'objects'));
            const sp = App.activeSpace();
            if (sp) sp.tree.expanded.delete(id);
            // Full refresh — the row is now tombstoned server-side,
            // so re-querying drops it from every folder it appeared in.
            await refreshTree(spaceId);
            refreshObjects(spaceId).then(() => { App.persist(); render(); }).catch(() => {});
          }
          break;
        }
        case 'refresh-objects':
          await refreshObjects(spaceId); App.persist(); render(); break;
        case 'bind-types': {
          const checks = document.querySelectorAll('[data-input="bind-type"]:checked');
          const tids = Array.from(checks).map(c => c.value);
          if (tids.length === 0) { toast('err', 'pick at least one type'); return; }
          const ok = await bindTypes(spaceId, id, tids);
          if (!ok) break;
          await refreshTypes(spaceId);
          if (tids.includes(MD_TYPE_ID)) {
            const sp = App.spaces[spaceId];
            const o2 = sp && sp.objects[id];
            if (o2 && o2.markdownContent === undefined) {
              await loadMarkdown(spaceId, id);
            }
          }
          if (tids.includes(CHAT_TYPE_ID)) {
            const sp = App.spaces[spaceId];
            const o2 = sp && sp.objects[id];
            if (o2 && o2.chatMessages === undefined) {
              await loadChatMessages(spaceId, id);
            }
          }
          // bindTypes may rewrite any.types — that doesn't change
          // tree position, but if the user binds nav explicitly we
          // want to surface fresh rows just in case.
          refreshTree(spaceId).catch(() => {});
          App.persist();
          render();
          break;
        }
        case 'save-markdown': {
          // Read from EasyMDE and PUT. No render — destroying the
          // editor on save would lose cursor/scroll state.
          const content = editorValue();
          await saveMarkdown(spaceId, id, content);
          App.persist();
          break;
        }
        case 'reload-markdown': {
          const sp = App.spaces[spaceId];
          const o3 = sp && sp.objects[id];
          if (o3) o3.markdownContent = undefined;
          await loadMarkdown(spaceId, id);
          if (o3 && typeof o3.markdownContent === 'string') {
            editorSetValue(o3.markdownContent);
            toast('ok', 'reloaded');
          }
          break;
        }
        case 'chat-reload': {
          await refreshChatMessages(spaceId, id);
          toast('ok', 'reloaded');
          break;
        }
        case 'chat-send': {
          const ta = document.getElementById('chat-input-' + cssEsc(id));
          const text = (ta?.value || '').trim();
          if (!text) return;
          const agentEl = document.getElementById('chat-agent-' + cssEsc(id));
          const fromAgent = (agentEl?.value || '').trim();
          const sp = App.spaces[spaceId];
          const o4 = sp && sp.objects[id];
          if (ta) ta.value = '';
          if (o4) {
            o4.chatComposing = '';
            o4.chatFromAgent = fromAgent;
          }
          if (ta) autosizeTextarea(ta);
          const sent = await sendChatMessage(spaceId, id, text, '', fromAgent);
          if (!sent) {
            // Restore the draft so the user doesn't lose what they
            // typed when the server rejected the write.
            if (ta) { ta.value = text; autosizeTextarea(ta); }
            if (o4) o4.chatComposing = text;
            return;
          }
          await refreshChatMessages(spaceId, id);
          break;
        }
        case 'chat-edit': {
          const msgId = t.dataset.msg;
          const sp = App.spaces[spaceId];
          const o5 = sp && sp.objects[id];
          const cur = (o5?.chatMessages || []).find(m => m.id === msgId);
          if (!cur) return;
          const next = prompt('edit message', cur.text || '');
          if (next === null) return;
          const trimmed = next.trim();
          if (!trimmed) { toast('err', 'empty edit ignored'); return; }
          if (trimmed === cur.text) return;
          const ok = await editChatMessage(spaceId, id, msgId, trimmed);
          if (ok) await refreshChatMessages(spaceId, id);
          break;
        }
        case 'chat-delete': {
          const msgId = t.dataset.msg;
          if (!confirm('delete this message?')) return;
          if (await deleteChatMessage(spaceId, id, msgId)) {
            await refreshChatMessages(spaceId, id);
          }
          break;
        }
        case 'chat-react': {
          const msgId = t.dataset.msg;
          const emoji = t.dataset.emoji;
          if (!emoji) return;
          if (await toggleChatReaction(spaceId, id, msgId, emoji)) {
            await refreshChatMessages(spaceId, id);
          }
          break;
        }
        case 'sharing-refresh':
          await refreshMembers(spaceId);
          break;
        case 'invite-create': {
          const out = await createInvite(spaceId);
          if (out) {
            const sp = App.spaces[spaceId];
            sp.sharing = sp.sharing || {};
            sp.sharing.lastInviteToken = out.inviteToken;
            await refreshMembers(spaceId);
          }
          break;
        }
        case 'invite-token-clear': {
          const sp = App.spaces[spaceId];
          if (sp && sp.sharing) sp.sharing.lastInviteToken = null;
          render();
          break;
        }
        case 'invite-copy': {
          const sp = App.spaces[spaceId];
          const tok = sp && sp.sharing && sp.sharing.lastInviteToken;
          if (!tok) { toast('err', 'no token to copy'); break; }
          try {
            await navigator.clipboard.writeText(tok);
            toast('ok', 'copied');
          } catch (e) {
            toast('err', 'copy failed', e.message || String(e));
          }
          break;
        }
        case 'invite-revoke': {
          if (!confirm('revoke this invite?')) break;
          if (await revokeInvite(spaceId, id)) await refreshMembers(spaceId);
          break;
        }
        case 'invite-revoke-all': {
          if (!confirm('revoke every invite?')) break;
          if (await revokeAllInvites(spaceId)) await refreshMembers(spaceId);
          break;
        }
        case 'acl-accept': {
          const perm = val('[data-input="accept-perm:' + cssEsc(id) + '"]') || 'writer';
          if (await aclAccept(spaceId, id, perm)) await refreshMembers(spaceId);
          break;
        }
        case 'acl-decline': {
          if (await aclDecline(spaceId, id)) await refreshMembers(spaceId);
          break;
        }
        case 'acl-grant': {
          const perm = val('[data-input="member-perm:' + cssEsc(id) + '"]');
          if (!perm) { toast('err', 'pick a permission first'); break; }
          if (await aclChangePermission(spaceId, id, perm)) await refreshMembers(spaceId);
          break;
        }
        case 'acl-remove': {
          if (!confirm('remove ' + id + '? This rotates the read key.')) break;
          if (await aclRemove(spaceId, id)) await refreshMembers(spaceId);
          break;
        }
        case 'acl-stop-sharing': {
          if (!confirm('stop sharing? this drops every non-owner and rotates the read key.')) break;
          if (await aclStopSharing(spaceId)) await refreshMembers(spaceId);
          break;
        }
        case 'delete-space': {
          if (!confirm('delete space ' + (App.activeSpace().info.name || '') + '? (soft delete)')) return;
          if (await deleteSpace(spaceId)) { App.persist(); render(); }
          break;
        }
        case 'space-save-metadata': {
          const sp = App.activeSpace();
          if (!sp) return;
          const info = sp.info || {};
          // Diff against the cached info so we only PATCH fields the
          // user actually changed — matches the wire's pointer-to-
          // string contract (absent = leave-as-is).
          const body = {};
          const newName = val('#settings-name');
          const newDesc = val('#settings-description');
          const newIcon = val('#settings-icon-cid');
          if (newName !== (info.name || '')) body.name = newName;
          if (newDesc !== (info.description || '')) body.description = newDesc;
          if (newIcon !== (info.iconCid || '')) body.iconCid = newIcon;
          if (Object.keys(body).length === 0) {
            toast('ok', 'nothing changed');
            break;
          }
          if (await updateSpaceMetadata(spaceId, body)) { App.persist(); render(); }
          break;
        }
        case 'space-reset-metadata': {
          render();
          break;
        }
        case 'debug-reload-sync': {
          if (!spaceId) break;
          await refreshSyncStatusSpace(spaceId);
          renderDebugPanels();
          break;
        }
        case 'debug-reload-debug': {
          if (!spaceId) break;
          await refreshDebugSpace(spaceId);
          render();
          break;
        }
        case 'debug-toggle-live': {
          if (!spaceId) break;
          const sp = App.spaces[spaceId];
          if (!sp) break;
          if (sp.sync.live) unmountSyncStatusLive();
          else mountSyncStatusLive(spaceId);
          renderDebugPanels();
          break;
        }
        case 'debug-fetch-object':
        case 'debug-fetch-object-sync':
        case 'debug-fetch-object-debug': {
          if (!spaceId) break;
          const sp = App.spaces[spaceId];
          if (!sp) break;
          const oid = val('#debug-object-input').trim();
          if (!oid) { toast('err', 'object id required'); break; }
          sp.sync.lastObjectId = oid;
          // Reset prior results so we don't show stale neighbour data.
          if (act === 'debug-fetch-object' || act === 'debug-fetch-object-sync') sp.sync.object = null;
          if (act === 'debug-fetch-object' || act === 'debug-fetch-object-debug') sp.sync.debugObject = null;
          const tasks = [];
          if (act !== 'debug-fetch-object-debug') tasks.push(refreshSyncStatusObject(spaceId, oid));
          if (act !== 'debug-fetch-object-sync')  tasks.push(refreshDebugObject(spaceId, oid));
          await Promise.all(tasks);
          render();
          break;
        }
        case 'query-scope-space': App.queryScope = 'space'; render(); break;
        case 'query-scope-object': App.queryScope = 'object'; render(); break;
        case 'query-clear':
          App.lastQuery = null; App.lastQueryParams = null; App.lastQueryScope = null;
          render(); break;
        case 'run-query': {
          const scope = App.queryScope || 'space';
          const limit = parseInt(val('#query-limit') || '10', 10) || 0;
          const filterRaw = val('#query-filter');
          const sortRaw = val('#query-sort');
          const body = {};
          if (limit > 0) body.limit = limit;
          if (filterRaw) {
            try { body.filter = JSON.parse(filterRaw); }
            catch (e) { toast('err', 'filter is not JSON', e.message); return; }
          }
          if (sortRaw) {
            body.sort = sortRaw.split(',').map(s => s.trim()).filter(Boolean);
          }
          let r;
          if (scope === 'object') {
            body.objectId = val('#query-objectid');
            body.dataset  = val('#query-dataset') || 'properties';
            if (!body.objectId) { toast('err', 'objectId required'); return; }
            r = await querySpace(spaceId, body);
          } else {
            r = await querySpaceObjects(spaceId, body);
          }
          if (r) {
            App.lastQuery = r;
            App.lastQueryParams = body;
            App.lastQueryScope = scope;
            render();
            toast('ok', 'query: ' + (r.records || []).length + ' record(s)');
          }
          break;
        }
      }
    } catch (err) {
      console.error(err);
      toast('err', 'error', err.message || String(err));
    }
  });

  // saveObjectChanges scans `[data-edit]` inputs across the entire
  // main pane (the object-edit page is one object at a time, so no
  // per-container scoping is needed). The data-edit key encodes
  // edit:<objectId>:<typeId>:<propId>; we verify the objectId prefix
  // before applying so a stray input from a different page can't
  // sneak in.
  async function saveObjectChanges(spaceId, objectId) {
    const sp = App.spaces[spaceId];
    const obj = sp.objects[objectId];
    if (!obj) return;
    const rec = obj.lastRecord || {};
    const root = document.getElementById('main');
    if (!root) return;
    const patches = {};
    const inputs = root.querySelectorAll('[data-edit]');
    for (const el of inputs) {
      const key = el.getAttribute('data-edit') || '';
      if (!key.startsWith('edit:')) continue;
      const rest = key.slice('edit:'.length);
      if (!rest.startsWith(objectId + ':')) continue;
      const tail = rest.slice(objectId.length + 1);
      const colon = tail.indexOf(':');
      if (colon < 0) continue;
      const tid = tail.slice(0, colon);
      const pid = tail.slice(colon + 1);
      const tt = sp.types[tid];
      if (!tt) continue;
      const pp = (tt.props || []).find(x => x.id === pid);
      if (!pp) continue;
      const raw = el.value;
      const cur = (rec[tid] || {})[pid];
      let parsed;
      try { parsed = coerce(raw, pp.kind); }
      catch (e) { toast('err', 'bad value for ' + pp.name, e.message); return; }
      if (JSON.stringify(parsed) === JSON.stringify(cur)) continue;
      if (cur === undefined && (parsed === '' || parsed === null) && pp.kind !== 'null') continue;
      patches[tid] = patches[tid] || {};
      patches[tid][pid] = parsed;
    }
    const typeIds = Object.keys(patches);
    if (typeIds.length === 0) { toast('ok', 'no changes'); return; }
    for (const tid of typeIds) {
      const r = await setBase(spaceId, objectId, tid, patches[tid]);
      if (!r) return;
    }
    // Saves can touch any.name (rename) or nav.* (move/reorder) — both
    // invalidate the tree's cached child entries. Cheap full refresh.
    refreshTree(spaceId).catch(() => {});
    App.persist();
    render();
  }

  // ---------- network log toolbar ----------
  document.getElementById('btn-netlog-clear').addEventListener('click', (e) => {
    e.stopPropagation(); NetLog.clear();
  });
  document.getElementById('btn-netlog-toggle').addEventListener('click', (e) => {
    e.stopPropagation(); document.getElementById('netlog').classList.toggle('collapsed');
  });

  // ---------- left-sidebar account profile editor ----------
  document.getElementById('btn-acct-edit').addEventListener('click', () => toggle('#form-acct-meta'));
  document.getElementById('btn-acct-cancel').addEventListener('click', () => toggle('#form-acct-meta'));
  document.getElementById('btn-acct-save').addEventListener('click', async () => {
    const name = document.getElementById('acct-name').value.trim();
    const description = document.getElementById('acct-desc').value.trim();
    const iconCid = document.getElementById('acct-icon').value.trim();
    const meta = {};
    if (name) meta.name = name;
    if (description) meta.description = description;
    if (iconCid) meta.iconCid = iconCid;
    if (Object.keys(meta).length === 0) {
      toast('err', 'at least one of name / description / icon CID required');
      return;
    }
    try {
      await updateAccountMetadata(meta);
      toast('ok', 'profile updated');
      toggle('#form-acct-meta');
    } catch (e) {
      toast('err', 'profile update failed', e.message);
    }
  });

  // ---------- right-sidebar space picker ----------
  document.getElementById('btn-new-space-toggle').addEventListener('click', () => toggle('#form-new-space'));
  document.getElementById('btn-new-space-cancel').addEventListener('click', () => toggle('#form-new-space'));
  document.getElementById('btn-new-space-create').addEventListener('click', async () => {
    const name = document.getElementById('new-space-name').value;
    const description = document.getElementById('new-space-description').value;
    if (!name) { toast('err', 'name required'); return; }
    const created = await createSpace({ name, description });
    if (created) {
      toggle('#form-new-space');
      App.persist();
      navigate(spaceUrl(created.id, 'objects'));
    }
  });
  document.getElementById('btn-join-space-toggle').addEventListener('click', () => toggle('#form-join-space'));
  document.getElementById('btn-join-space-cancel').addEventListener('click', () => toggle('#form-join-space'));
  document.getElementById('btn-join-space-go').addEventListener('click', async () => {
    const token = document.getElementById('join-token').value.trim();
    const name  = document.getElementById('join-name').value.trim();
    if (!token) { toast('err', 'invite token required'); return; }
    const joined = await joinSpace(token, name);
    if (joined) {
      ensureSpace(joined.id, joined);
      toggle('#form-join-space');
      App.persist();
      // Pending join requests sit at status=joining until owner accepts;
      // either way drop into the new space's view.
      navigate(spaceUrl(joined.id, 'objects'));
    }
  });
  document.getElementById('space-select').addEventListener('change', (e) => {
    const id = e.target.value;
    if (!id) return;
    navigate(spaceUrl(id, 'objects'));
  });

  // ---------- health probe ----------
  async function probeHealth() {
    const el = document.getElementById('health');
    try {
      const r = await fetch('/v1/health');
      if (r.ok) {
        const j = await r.json();
        el.className = 'health ok';
        el.textContent = 'ok · v' + j.version;
      } else {
        el.className = 'health err';
        el.textContent = 'health ' + r.status;
      }
    } catch (e) {
      el.className = 'health err';
      el.textContent = 'unreachable';
    }
  }

  // ---------- boot ----------
  window.addEventListener('hashchange', onHashChange);

  (async () => {
    try { await loadAccount(); }
    catch (e) { toast('err', 'cannot load account', e.message); return; }

    App.rehydrate();
    try { await refreshSpaces(); }
    catch (e) { toast('err', 'cannot list spaces', e.message); }

    App.route = parseHash();
    if (!App.route.spaceId) {
      // No space in the URL — drop into the first active space's
      // objects page so the page isn't blank on first load.
      const firstActive = Object.values(App.spaces).find(s => s.info?.status === 'active');
      if (firstActive) {
        location.replace(spaceUrl(firstActive.info.id, 'objects'));
        App.route = parseHash();
      }
    }

    App.persist();
    render();
    renderNetLog();
    probeHealth();
    setInterval(probeHealth, 15000);

    if (App.route.spaceId) {
      try { await ensurePageData(App.route); } catch (e) {}
      App.persist();
      render();
    }
  })();

})();
</script>

</body>
