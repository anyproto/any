      { identities: [identity] });
    if (!r.ok) { toast('err', 'remove failed', r.body); return false; }
    toast('ok', 'member removed'); return true;
  }
  async function aclStopSharing(spaceId) {
    const r = await api.post('/v1/spaces/' + encodeURIComponent(spaceId) + '/acl/stop-sharing', null);
    if (!r.ok) { toast('err', 'stop-sharing failed', r.body); return false; }
    toast('ok', 'sharing stopped'); return true;
  }
  async function joinSpace(token, name) {
    const r = await api.post('/v1/spaces/join',
      { inviteToken: token, metadata: name ? { name } : undefined });
    if (!r.ok) { toast('err', 'join failed', r.body); return null; }
    toast('ok', 'joined; pending owner approval'); return r.json;
  }

  // ---------- router ----------
  // Hash routes parsed by parseHash:
  //   #/spaces/:id                   → space-objects
  //   #/spaces/:id/objects[?type=Y]  → space-objects (optionally filtered)
  //   #/spaces/:id/objects/:oid      → object-edit
  //   #/spaces/:id/types             → space-types
  //   #/spaces/:id/query             → space-query
  //   #/spaces/:id/members           → space-members
  //   #/spaces/:id/settings          → space-settings
  //   #/spaces/:id/debug             → space-debug (sync-status + debug)
  function parseHash() {
    const h = location.hash || '';
    const m = h.match(/^#\/spaces\/([^\/?#]+)(?:\/(types|objects|query|members|settings|debug)(?:\/([^?#]+))?)?(?:\?(.*))?$/);
    if (!m) return { name: 'home' };
    const spaceId = decodeURIComponent(m[1]);
    const section = m[2] || 'objects';
    const param = m[3];
    const qs = new URLSearchParams(m[4] || '');
    if (section === 'objects' && param) {
      return { name: 'object-edit', spaceId, objectId: decodeURIComponent(param) };
    }
    if (section === 'types') return { name: 'space-types', spaceId };
    if (section === 'query') return { name: 'space-query', spaceId };
    if (section === 'members') return { name: 'space-members', spaceId };
    if (section === 'settings') return { name: 'space-settings', spaceId };
    if (section === 'debug') return { name: 'space-debug', spaceId };
    return { name: 'space-objects', spaceId, typeFilter: qs.get('type') || '' };
  }
  function spaceUrl(id, section, param) {
    let u = '#/spaces/' + encodeURIComponent(id);
    if (section) u += '/' + section;
    if (param != null && param !== '') u += '/' + encodeURIComponent(param);
    return u;
  }
  function navigate(hash) {
    if (location.hash === hash) onHashChange();
    else location.hash = hash;
  }
  async function onHashChange() {
    unmountEditor();
    unmountChat();
    // Tear down the sync-status live stream whenever the route
    // changes away from a debug page (or to a different space's
    // debug page). The user can re-arm it with the live toggle.
    if (syncStatusStream) {
      const next = parseHash();
      if (next.name !== 'space-debug' || next.spaceId !== syncStatusStream.spaceId) {
        unmountSyncStatusLive();
      }
    }
    App.route = parseHash();
    render();
    if (!App.route.spaceId) return;
    try { await ensurePageData(App.route); } catch (e) {}
    App.persist();
    render();
  }
  // ensurePageData makes a best-effort fetch of whatever the new page
  // needs to look right. Failures are surfaced by inner toasts; we
  // never throw out so the page still shows what we have cached.
  async function ensurePageData(route) {
    const sp = App.spaces[route.spaceId];
    if (!sp) return;
    await Promise.all([
      refreshTypes(route.spaceId),
      refreshObjects(route.spaceId),
      // Tree's root level is always loaded for the active space.
      // Children of expanded folders re-fetched in parallel so a fresh
      // page reload restores the previous view.
      loadTreeChildren(route.spaceId, NAV_ROOT_PARENT),
      ...Array.from(sp.tree.expanded || []).map(id =>
        loadTreeChildren(route.spaceId, id)
      ),
    ]);
    if (route.name === 'space-members') {
      await refreshMembers(route.spaceId).catch(() => {});
      return;
    }
    if (route.name === 'space-debug') {
      await Promise.all([
        refreshSyncStatusSpace(route.spaceId).catch(() => {}),
        refreshDebugSpace(route.spaceId).catch(() => {}),
      ]);
      return;
    }
    if (route.name === 'object-edit') {
      await loadObject(route.spaceId, route.objectId);
      const o = sp.objects[route.objectId];
      if (o) {
        const types = (o.lastRecord?.any?.types) || o.types || [];
        const tasks = [];
        if (types.includes(MD_TYPE_ID) && o.markdownContent === undefined) {
          tasks.push(loadMarkdown(route.spaceId, route.objectId));
        }
        if (types.includes(CHAT_TYPE_ID) && o.chatMessages === undefined) {
          tasks.push(loadChatMessages(route.spaceId, route.objectId));
        }
        if (tasks.length) await Promise.all(tasks);
      }
    }
  }

  // ---------- markdown editor (EasyMDE) ----------
  // EasyMDE wraps a textarea with its own DOM. innerHTML on `main`
  // wipes that wrapper, so we must call toTextArea() *before* the
  // overwrite (renderMain does that via unmountEditor). After the new
  // markup is in the DOM, mountEditorForObject finds the new textarea
  // and constructs a fresh instance bound to the cached content.
  let activeEditor = null;
  function mountEditorForObject(sp, oid) {
    const o = sp.objects[oid];
    if (!o) return;
    const types = (o.lastRecord?.any?.types) || o.types || [];
    if (!types.includes(MD_TYPE_ID)) return;
    if (o.markdownContent === undefined) return;
    if (typeof EasyMDE === 'undefined') {
      // CDN script not yet loaded — retry shortly. mountEditor is
      // idempotent (we destroy any previous instance first), and
      // navigating away cancels the chain by virtue of renderMain
      // calling unmountEditor + finding no textarea.
      setTimeout(() => mountEditorForObject(sp, oid), 200);
      return;
    }
    const ta = document.getElementById('md-editor');
    if (!ta) return;
    activeEditor = new EasyMDE({
      element: ta,
      initialValue: o.markdownContent,
      spellChecker: false,
      autofocus: false,
      status: ['lines', 'words', 'cursor'],
      minHeight: '480px',
      sideBySideFullscreen: false,
      toolbar: ['bold', 'italic', 'heading', '|',
                'quote', 'unordered-list', 'ordered-list', '|',
                'link', 'code', 'horizontal-rule', '|',
                'preview', 'side-by-side', 'fullscreen', '|',
                'guide'],
    });
  }
  function unmountEditor() {
    if (activeEditor) {
      try { activeEditor.toTextArea(); } catch (e) {}
      activeEditor = null;
    }
  }
  function editorValue() { return activeEditor ? activeEditor.value() : ''; }
  function editorSetValue(v) { if (activeEditor) activeEditor.value(v); }

  // ---------- chat panel ----------
  // mountChatForObject opens the SSE subscription scoped to the
  // object's chat_messages dataset. Each `event: changes` frame fires
  // a re-fetch of the message list (the SDK event carries only the
  // routing tuple — see docs/04-events.md), then we replace the
  // chat-messages innerHTML in place so the user's compose textarea
  // and editor state survive the update.
  let activeChat = null;
  function mountChatForObject(sp, oid) {
    const o = sp.objects[oid];
    if (!o) return;
    const types = (o.lastRecord?.any?.types) || o.types || [];
    if (!types.includes(CHAT_TYPE_ID)) return;

    const list = document.getElementById('chat-messages-' + cssEsc(oid));
    if (!list) return;
    scrollChatToBottom(list);

    // Restore any in-flight compose text the user typed before the
    // last re-render, so live updates don't eat their draft.
    const ta = document.getElementById('chat-input-' + cssEsc(oid));
    if (ta && o.chatComposing) {
      ta.value = o.chatComposing;
      autosizeTextarea(ta);
    }
    if (ta) {
      ta.addEventListener('input', () => {
        o.chatComposing = ta.value;
        autosizeTextarea(ta);
      });
      ta.addEventListener('keydown', (e) => {
        // Enter sends, Shift+Enter inserts a newline. Mirrors every
        // other chat client's compose behavior.
        if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          ta.dispatchEvent(new CustomEvent('chat-submit', { bubbles: true }));
        }
      });
    }
    const agentEl = document.getElementById('chat-agent-' + cssEsc(oid));
    if (agentEl) {
      if (o.chatFromAgent) agentEl.value = o.chatFromAgent;
      agentEl.addEventListener('input', () => {
        o.chatFromAgent = agentEl.value;
      });
    }

    const path = '/v1/spaces/' + encodeURIComponent(sp.info.id) +
      '/objects/' + encodeURIComponent(oid) +
      '/subscribe?dataset=' + encodeURIComponent(CHAT_DATASET);
    let firstReady = true;
    const es = new EventSource(path);
    es.addEventListener('ready', () => {
      // First `ready` lands during the initial mount; the page-data
      // fetch already populated o.chatMessages, so don't double-load.
      // Subsequent `ready` frames mean EventSource auto-reconnected
      // after a transport drop — re-fetch in case events landed
      // during the gap.
      if (firstReady) { firstReady = false; return; }
      refreshChatMessages(sp.info.id, oid).catch(() => {});
    });
    es.addEventListener('changes', () => {
      // Re-fetch and re-render the message list. We don't trust the
      // SSE frame's payload to carry message bodies — it's a routing
      // tuple by design.
      refreshChatMessages(sp.info.id, oid).catch(() => {});
    });
    es.addEventListener('closed', () => { es.close(); });
    activeChat = { es, spaceId: sp.info.id, objectId: oid };
  }
  function unmountChat() {
    if (activeChat) {
      try { activeChat.es.close(); } catch (e) {}
      activeChat = null;
    }
  }

  async function refreshChatMessages(spaceId, objectId) {
    const sp = App.spaces[spaceId];
    const o = sp?.objects[objectId];
    if (!o) return;
    await loadChatMessages(spaceId, objectId);
    const list = document.getElementById('chat-messages-' + cssEsc(objectId));
    if (!list) return;
    list.innerHTML = renderChatMessagesList(o);
    scrollChatToBottom(list);
  }

  function scrollChatToBottom(list) {
    // Defer to the next frame so any newly-appended children have
    // contributed their height to scrollHeight.
    requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
  }

  function autosizeTextarea(ta) {
    ta.style.height = 'auto';
    const h = Math.min(ta.scrollHeight, 160);
    ta.style.height = h + 'px';
  }

  function renderChatSection(o) {
    return '<section class="card chat-card">' +
      '<header><h3>chat</h3>' +
        '<div class="row" style="gap:6px">' +
          '<button class="ghost" data-act="chat-reload" data-id="' + escapeHTML(o.id) + '">reload</button>' +
        '</div>' +
      '</header>' +
      '<div class="body">' +
        '<div class="chat-messages" id="chat-messages-' + escapeHTML(o.id) + '">' +
          renderChatMessagesList(o) +
        '</div>' +
        '<div class="chat-compose">' +
          '<div class="compose-text">' +
            '<textarea id="chat-input-' + escapeHTML(o.id) + '" ' +
              'placeholder="message (markdown · Enter to send · Shift+Enter newline)" ' +
              'data-input="chat-text" data-id="' + escapeHTML(o.id) + '"></textarea>' +
            '<button data-act="chat-send" data-id="' + escapeHTML(o.id) + '">send</button>' +
          '</div>' +
          '<div class="compose-agent">' +
            '<label for="chat-agent-' + escapeHTML(o.id) + '">fromAgent</label>' +
            '<input id="chat-agent-' + escapeHTML(o.id) + '" type="text" ' +
              'placeholder="empty = send as human; set to mark as agent-authored" ' +
              'data-input="chat-agent" data-id="' + escapeHTML(o.id) + '" ' +
              'value="' + escapeHTML(o.chatFromAgent || '') + '">' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  function renderChatMessagesList(o) {
    const messages = Array.isArray(o.chatMessages) ? o.chatMessages : null;
    if (messages === null) {
      return '<div class="chat-loading">loading…</div>';
    }
    if (messages.length === 0) {
      return '<div class="chat-empty">no messages yet — type below to start.</div>';
    }
    return messages.map(m => renderChatMessage(o, m)).join('');
  }

  function renderChatMessage(o, m) {
    const own = m.creator && App.accountId && m.creator === App.accountId;
    const author = own ? 'you' : shortId(m.creator || '');
    const ts = m.createdAt ? new Date(m.createdAt * 1000) : null;
    const tsLabel = ts ? ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    const edited = m.modifiedAt && m.modifiedAt > m.createdAt;
    const fromAgent = (m.fromAgent || '').trim();

    const reactions = m.reactions || {};
    const reactionEntries = Object.entries(reactions);
    const reactionsHTML = reactionEntries.length === 0 ? '' :
      '<div class="reactions">' +
        reactionEntries.map(([emoji, ids]) => {
          const mine = Array.isArray(ids) && ids.includes(App.accountId);
          return '<button class="reaction-chip' + (mine ? ' mine' : '') + '" ' +
            'data-act="chat-react" data-id="' + escapeHTML(o.id) +
            '" data-msg="' + escapeHTML(m.id) +
            '" data-emoji="' + escapeHTML(emoji) + '" ' +
            'title="' + escapeHTML((ids || []).join(', ')) + '">' +
            escapeHTML(emoji) +
            '<span class="count">' + (ids || []).length + '</span>' +
          '</button>';
        }).join('') +
      '</div>';

    const quickReactionsHTML =
      '<span class="quick-react">' +
        CHAT_QUICK_REACTIONS.map(emoji =>
          '<button data-act="chat-react" data-id="' + escapeHTML(o.id) +
            '" data-msg="' + escapeHTML(m.id) +
            '" data-emoji="' + escapeHTML(emoji) + '" title="react">' +
            escapeHTML(emoji) +
          '</button>'
        ).join('') +
      '</span>';

    const ownActions = own ?
      '<button data-act="chat-edit" data-id="' + escapeHTML(o.id) +
        '" data-msg="' + escapeHTML(m.id) + '" title="edit">✎</button>' +
      '<button data-act="chat-delete" data-id="' + escapeHTML(o.id) +
        '" data-msg="' + escapeHTML(m.id) + '" title="delete">🗑</button>' : '';

    return '<div class="chat-msg' + (own ? ' own' : '') + (fromAgent ? ' from-agent' : '') + '">' +
      '<div class="meta">' +
        '<span class="author">' + escapeHTML(author) + '</span>' +
        (fromAgent ? '<span class="agent-tag" title="' + escapeHTML('via agent: ' + fromAgent) + '">🤖 ' + escapeHTML(fromAgent) + '</span>' : '') +
        '<span class="ts" title="' + escapeHTML(ts ? ts.toISOString() : '') + '">' +
          escapeHTML(tsLabel) +
        '</span>' +
        (edited ? '<span class="edited">edited</span>' : '') +
        '<span class="actions">' + quickReactionsHTML + ownActions + '</span>' +
      '</div>' +
      '<div class="text">' + escapeHTML(m.text || '') + '</div>' +
      reactionsHTML +
    '</div>';
  }

  // ---------- render: dispatcher ----------
  function render() {
    renderSidebar();
    renderMain();
  }

  function renderSidebar() {
    renderSpaceSelector();
    renderTree();
  }

  function renderSpaceSelector() {
    const selEl = document.getElementById('space-select');
    if (!selEl) return;
    const all = Object.values(App.spaces);
    all.sort((a, b) => {
      const sa = a.info?.status === 'active' ? 0 : (a.info?.status === 'deleted' ? 2 : 1);
      const sb = b.info?.status === 'active' ? 0 : (b.info?.status === 'deleted' ? 2 : 1);
      if (sa !== sb) return sa - sb;
      return (a.info?.name || '').localeCompare(b.info?.name || '');
    });
    const cur = App.route?.spaceId || '';
    let html = '<option value="">— pick a space —</option>';
    for (const s of all) {
      const info = s.info || {};
      const isSel = info.id === cur ? ' selected' : '';
      const tag = info.status === 'deleted' ? ' (deleted)' : '';
      html += '<option value="' + escapeHTML(info.id) + '"' + isSel + '>' +
        escapeHTML((info.name || '(unnamed)') + tag) +
      '</option>';
    }
    selEl.innerHTML = html;
  }

  // renderTree renders the active space's object tree into the left
  // sidebar. Roots (parentId === "") are always rendered; folders are
  // expanded only when their id is in tree.expanded. Lazy-load happens
  // on click — see the 'tree-toggle' action in the click handler.
  function renderTree() {
    const root = document.getElementById('tree');
    if (!root) return;
    const sp = App.activeSpace();
    if (!sp || !sp.info) {
      root.innerHTML = '<div class="tree-empty">no space selected.</div>';
      return;
    }
    const rootKids = sp.tree.children[NAV_ROOT_PARENT];
    if (rootKids === undefined) {
      root.innerHTML = '<div class="tree-loading">loading…</div>';
      return;
    }
    const empty = rootKids.length === 0
      ? '<div class="tree-empty">empty — create an item or folder above.</div>'
      : renderTreeChildren(sp, NAV_ROOT_PARENT, 0);
    // Drop-zone footer: lets the user drop items at the end of root
    // even when the tree is empty or full.
    root.innerHTML = empty +
      '<div class="tree-droproot" data-tree-droproot="1">drop here for root</div>';
  }

  function renderTreeChildren(sp, parentId, depth) {
    const kids = sp.tree.children[parentId] || [];
    return kids.map(child => renderTreeRow(sp, child, depth)).join('');
  }

  function renderTreeRow(sp, child, depth) {
    const isFolder = child.navType === NAV_TYPE_FOLDER;
    const expanded = isFolder && sp.tree.expanded.has(child.id);
    const active = App.route?.objectId === child.id ? ' active' : '';
    const indent = 'padding-left:' + (8 + depth * 14) + 'px;';
    const chevron = isFolder
      ? '<span class="chevron" data-tree-act="toggle" data-id="' + escapeHTML(child.id) + '">' +
          (expanded ? '▼' : '▶') + '</span>'
      : '<span class="chevron empty">·</span>';
    const glyph = isFolder ? '📁' : '📄';
    const name = child.name || '(unnamed)';
    const actions = isFolder
      ? '<div class="row-actions">' +
          '<button title="new item in this folder" data-tree-act="new-item" data-id="' + escapeHTML(child.id) + '">+</button>' +
          '<button title="new sub-folder" data-tree-act="new-folder" data-id="' + escapeHTML(child.id) + '">+▸</button>' +
        '</div>'
      : '';
    let html = '<div class="tree-row' + active + '" style="' + indent + '"' +
      ' draggable="true"' +
      ' data-tree-act="open"' +
      ' data-id="' + escapeHTML(child.id) + '"' +
      ' data-parent="' + escapeHTML(child.parentId || '') + '"' +
      ' data-pos="' + escapeHTML(child.pos || '') + '"' +
      ' data-folder="' + (isFolder ? '1' : '0') + '">' +
      chevron +
      '<span class="icon-glyph">' + glyph + '</span>' +
      '<span class="name" title="' + escapeHTML(child.id) + '">' + escapeHTML(name) + '</span>' +
      actions +
    '</div>';
    if (expanded) {
      const sub = sp.tree.children[child.id];
      if (sub === undefined) {
        html += '<div class="tree-loading" style="padding-left:' + (22 + depth * 14) + 'px">loading…</div>';
      } else if (sub.length === 0) {
        html += '<div class="tree-empty" data-tree-empty-folder="' + escapeHTML(child.id) + '" style="padding-left:' + (22 + depth * 14) + 'px">empty folder.</div>';
      } else {
        html += renderTreeChildren(sp, child.id, depth + 1);
      }
    }
    return html;
  }

  function renderMain() {
    unmountEditor();
    const main = document.getElementById('main');
    const r = App.route;
    if (!r.spaceId) {
      main.innerHTML =
        '<div class="empty">' +
          '<p>pick a space on the left, or create one with <code>+</code>.</p>' +
        '</div>';
      return;
    }
    const sp = App.spaces[r.spaceId];
    if (!sp) {
      main.innerHTML = '<div class="empty"><p>unknown space — maybe deleted?</p></div>';
      return;
    }
    if (!sp.info) {
      main.innerHTML = '<div class="empty"><p>loading…</p></div>';
      return;
    }
    if (r.name === 'object-edit') {
      main.innerHTML = renderObjectEditPage(sp, r.objectId);
      mountEditorForObject(sp, r.objectId);
      mountChatForObject(sp, r.objectId);
      return;
    }
    let body, activeTab;
    switch (r.name) {
      case 'space-types':
        body = renderTypesPage(sp); activeTab = 'types'; break;
      case 'space-query':
        body = renderQueryPage(sp); activeTab = 'query'; break;
      case 'space-members':
        body = renderMembersPage(sp); activeTab = 'members'; break;
      case 'space-settings':
        body = renderSettingsPage(sp); activeTab = 'settings'; break;
      case 'space-debug':
        body = renderDebugPage(sp); activeTab = 'debug'; break;
      case 'space-objects':
      default:
        body = renderObjectsPage(sp, r.typeFilter || ''); activeTab = 'objects';
    }
    main.innerHTML = renderSpaceShell(sp, activeTab) + body;
  }

  function renderSpaceShell(sp, activeTab) {
    const info = sp.info;
    const isDeleted = info.status === 'deleted';
    const tab = (key, label) => {
      const cls = activeTab === key ? 'tab active' : 'tab';
      return '<a class="' + cls + '" href="' + spaceUrl(info.id, key) + '">' +
        escapeHTML(label) + '</a>';
    };
    return '<div class="space-header">' +
      '<div>' +
        '<h2>' + escapeHTML(info.name || '(unnamed)') +
          '<span class="id">' + escapeHTML(shortId(info.id)) + '</span>' +
        '</h2>' +
        '<div class="meta">status: ' + escapeHTML(info.status) +
          (info.ownRole ? ' · role: ' + escapeHTML(info.ownRole) : '') +
          (info.spaceType ? ' · type: ' + escapeHTML(info.spaceType) : '') +
          ' · created ' + escapeHTML((info.createdAt || '').slice(0, 19)) +
        '</div>' +
      '</div>' +
      '<div class="row">' +
        (isDeleted ? '<span class="pill">soft-deleted</span>' :
          '<button class="danger" data-act="delete-space">delete space</button>') +
      '</div>' +
    '</div>' +
    '<div class="page-tabs">' +
      tab('objects', 'Objects') +
      tab('types', 'Types') +
      tab('query', 'Query') +
      tab('members', 'Members') +
      tab('settings', 'Settings') +
      tab('debug', 'Debug') +
    '</div>';
  }

  // ---------- page: objects ----------
  function renderObjectsPage(sp, typeFilter) {
    // SDK-registered types (markdown etc.) surface as builtIn=true
    // but should still appear here — the only exclusion is the
    // synthetic `any` (auto-attached to every object).
    const filterableTypes = Object.values(sp.types).filter(t => t.id !== 'any');
    const allObjects = Object.values(sp.objects);
    const filteredObjects = typeFilter
      ? allObjects.filter(o => (o.types || []).includes(typeFilter))
      : allObjects;
    filteredObjects.sort((a, b) => {
      const an = (a.lastRecord && a.lastRecord.any && a.lastRecord.any.name) || a.id;
      const bn = (b.lastRecord && b.lastRecord.any && b.lastRecord.any.name) || b.id;
      return String(an).localeCompare(String(bn));
    });
    const items = filteredObjects.length === 0
      ? (allObjects.length === 0
          ? '<p style="color:var(--muted);font-size:13px;margin:4px 0">no objects yet — create one with <code>+ new object</code>.</p>'
          : '<p style="color:var(--muted);font-size:13px;margin:4px 0">no objects match the filter.</p>')
      : filteredObjects.map(o => renderObjectRow(sp, o)).join('');
    const truncatedNote = sp.objectsTruncated
      ? '<p style="color:var(--warn);font-size:11px;margin:0 0 8px">truncated at server-side limit (' + OBJECTS_QUERY_LIMIT + ') — narrow with the query tab.</p>'
      : '';
    const tabBtn = (id, label, count, active) =>
      '<a class="obj-tab' + (active ? ' active' : '') + '"' +
        ' href="' + spaceUrl(sp.info.id, 'objects') + (id ? ('?type=' + encodeURIComponent(id)) : '') + '">' +
        escapeHTML(label) +
        ' <span class="obj-tab-count">' + count + '</span>' +
      '</a>';
    const tabs =
      '<div class="obj-tabs">' +
        tabBtn('', 'all', allObjects.length, !typeFilter) +
        filterableTypes.map(t => {
          const n = allObjects.filter(o => (o.types || []).includes(t.id)).length;
          return tabBtn(t.id, t.name || t.id, n, typeFilter === t.id);
        }).join('') +
      '</div>';
    const userTypes = filterableTypes;
    const typeChooser = userTypes.length === 0
      ? '<p style="color:var(--muted);font-size:12px">create a type first to bind objects to it.</p>'
      : '<div class="field"><label>bind to types</label>' +
          userTypes.map(t =>
            '<label style="display:block;font:12px var(--mono);color:var(--text);text-transform:none">' +
              '<input type="checkbox" data-input="new-obj-type" value="' + escapeHTML(t.id) + '"> ' +
              escapeHTML(t.name || t.id) + ' <span class="pill">' + escapeHTML(shortId(t.id)) + '</span>' +
            '</label>'
          ).join('') +
        '</div>';
    const newForm =
      '<div class="form-toggle collapsed" data-form="new-object">' +
        typeChooser +
        '<div class="form-actions">' +
          '<button data-act="create-object">create</button>' +
          '<button class="ghost" data-act="new-object-toggle">cancel</button>' +
        '</div>' +
      '</div>';
    return '<section class="card">' +
      '<header><h3>objects</h3>' +
        '<div class="row" style="gap:6px">' +
          '<button class="ghost" data-act="refresh-objects">refresh</button>' +
          '<button class="ghost" data-act="new-object-toggle">+ new object</button>' +
        '</div>' +
      '</header>' +
      '<div class="body">' +
        truncatedNote +
        tabs +
        newForm +
        items +
      '</div>' +
    '</section>';
  }

  function renderObjectRow(sp, o) {
    const anyName = o.lastRecord && o.lastRecord.any && o.lastRecord.any.name;
    const display = anyName ? anyName : '(unnamed) ' + shortId(o.id);
    const typeBadges = (o.types || []).map(tid => {
      const t = sp.types[tid];
      const label = t ? (t.name || t.id) : shortId(tid);
      return '<span class="badge">' + escapeHTML(label) + '</span>';
    }).join(' ');
    const link = spaceUrl(sp.info.id, 'objects', o.id);
    return '<a class="obj-row" href="' + link + '">' +
      '<span class="name">' + escapeHTML(display) + '</span>' +
      '<span class="row-meta">' + typeBadges +
        ' <span class="id">' + escapeHTML(shortId(o.id)) + '</span></span>' +
    '</a>';
  }

  // ---------- page: types ----------
  function renderTypesPage(sp) {
    const types = Object.values(sp.types).slice().sort((a, b) => {
      if (!!a.builtIn !== !!b.builtIn) return a.builtIn ? -1 : 1;
      return (a.name || '').localeCompare(b.name || '');
    });
    const items = types.length === 0
      ? '<p style="color:var(--muted);font-size:13px;margin:4px 0">no types yet — create one to define properties.</p>'
      : types.map(renderTypeItem).join('');
    return '<section class="card">' +
      '<header><h3>types</h3>' +
        '<button class="ghost" data-act="new-type-toggle">+ new type</button>' +
      '</header>' +
      '<div class="body">' +
        '<div class="form-toggle collapsed" data-form="new-type">' +
          '<div class="form-row">' +
            '<div class="field"><label>name</label><input type="text" data-input="type-name" value="Movie"></div>' +
            '<div class="field"><label>description</label><input type="text" data-input="type-description"></div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button data-act="create-type">create</button>' +
            '<button class="ghost" data-act="new-type-toggle">cancel</button>' +
          '</div>' +
        '</div>' +
        items +
      '</div>' +
    '</section>';
  }

  function renderTypeItem(t) {
    const nameCounts = {};
    for (const p of t.props || []) nameCounts[p.name] = (nameCounts[p.name] || 0) + 1;
    const nameOrdinals = {};
    const dupNames = Object.keys(nameCounts).filter(n => nameCounts[n] > 1);
    const dupBadge = dupNames.length
      ? ' <span class="pill" style="border-color:var(--warn);color:var(--warn)" title="duplicate property names: ' +
          escapeHTML(dupNames.join(', ')) + '">name collision</span>'
      : '';
    const propsHTML = (t.props || []).length === 0
      ? '<p style="color:var(--muted);font-size:12px">no properties.</p>'
      : '<ul class="prop-list">' + t.props.map(p => {
          let label = escapeHTML(p.name);
          if (nameCounts[p.name] > 1) {
            nameOrdinals[p.name] = (nameOrdinals[p.name] || 0) + 1;
            label += ' <span class="pill">#' + nameOrdinals[p.name] + '</span>';
          }
          return '<li>' +
            '<span class="pname">' + label + '</span>' +
            '<span class="pkind">' + escapeHTML(p.kind) + '</span>' +
            (p.xKey ? '<span class="pill">xKey: ' + escapeHTML(p.xKey) + '</span>' : '') +
            '<span class="pid" title="' + escapeHTML(p.id) + '">' + escapeHTML(p.id) + '</span>' +
          '</li>';
        }).join('') + '</ul>';
    const addPropForm = t.builtIn ? '' :
      '<div class="form-toggle collapsed" data-form="add-prop:' + escapeHTML(t.id) + '">' +
        '<div class="form-row">' +
          '<div class="field"><label>name</label><input type="text" data-input="prop-name:' + escapeHTML(t.id) + '" value="Title"></div>' +
          '<div class="field"><label>xKey</label><input type="text" data-input="prop-xkey:' + escapeHTML(t.id) + '" value="title"></div>' +
          '<div class="field"><label>kind</label>' +
            '<select data-input="prop-kind:' + escapeHTML(t.id) + '">' +
              ['string','number','boolean','null','array','object'].map(k =>
                '<option>' + k + '</option>').join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button data-act="add-prop" data-id="' + escapeHTML(t.id) + '">add property</button>' +
          '<button class="ghost" data-act="add-prop-toggle" data-id="' + escapeHTML(t.id) + '">cancel</button>' +
        '</div>' +
      '</div>' +
      '<div class="form-actions" style="margin-top:8px">' +
        '<button class="ghost" data-act="add-prop-toggle" data-id="' + escapeHTML(t.id) + '">+ add property</button>' +
      '</div>';
    const builtBadge = t.builtIn ? ' <span class="pill">built-in</span>' : '';
    return '<details class="type-card">' +
      '<summary>' +
        '<span class="name">' + escapeHTML(t.name || '(no name)') + '</span>' + builtBadge + dupBadge +
        ' <span class="badge">' + (t.props || []).length + ' props</span>' +
        '<span class="id" title="' + escapeHTML(t.id) + '">' + escapeHTML(shortId(t.id)) + '</span>' +
      '</summary>' +
      '<div class="type-body">' +
        propsHTML +
        addPropForm +
      '</div>' +
    '</details>';
  }

  // ---------- page: query ----------
  function renderQueryPage(sp) {
    const last = App.lastQuery;
    const params = App.lastQueryParams || {};
    const scope = App.queryScope || 'space';
    const records = (last && last.records) || [];
    const recordsHTML = !last
      ? '<p style="color:var(--muted);font-size:12px;margin:8px 0 0">no query run yet.</p>'
      : records.length === 0
        ? '<p style="color:var(--muted);font-size:12px;margin:8px 0 0">no records.</p>'
        : '<div style="margin-top:8px;font:11px var(--mono);color:var(--muted)">' +
            records.length + ' record(s)' +
          '</div>' +
          records.map(r =>
            '<details class="raw" open><summary>record</summary>' +
              '<pre>' + escapeHTML(prettyJSON(r)) + '</pre>' +
            '</details>'
          ).join('');
    const limitVal  = escapeHTML(String(params.limit || 10));
    const filterVal = escapeHTML(params.filter ? JSON.stringify(params.filter, null, 2) : '');
    const sortVal   = escapeHTML((params.sort || []).join(','));
    const perObjectFields = scope === 'object'
      ? '<div class="form-row">' +
          '<div class="field"><label>objectId</label>' +
            '<input type="text" id="query-objectid" value="' + escapeHTML(params.objectId || '') + '"></div>' +
          '<div class="field"><label>dataset</label>' +
            '<input type="text" id="query-dataset" value="' + escapeHTML(params.dataset || 'properties') + '"></div>' +
        '</div>'
      : '';
    return '<section class="card">' +
      '<header><h3>query</h3>' +
        '<div class="row" style="font:11px var(--mono);gap:6px">' +
          '<button class="' + (scope === 'space' ? '' : 'ghost') + '" data-act="query-scope-space">cross-object</button>' +
          '<button class="' + (scope === 'object' ? '' : 'ghost') + '" data-act="query-scope-object">per-object</button>' +
        '</div>' +
      '</header>' +
      '<div class="body">' +
        '<p style="color:var(--muted);font-size:12px;margin:0 0 8px">' +
          (scope === 'space'
            ? 'cross-object: <code>POST /v1/spaces/:id/objects/query</code>'
            : 'per-object: <code>POST /v1/spaces/:id/query</code>') +
        '</p>' +
        perObjectFields +
        '<div class="form-row">' +
          '<div class="field" style="max-width:140px"><label>limit</label>' +
            '<input type="number" id="query-limit" value="' + limitVal + '"></div>' +
          '<div class="field"><label>sort (comma-separated)</label>' +
            '<input type="text" id="query-sort" value="' + sortVal + '"></div>' +
        '</div>' +
        '<div class="field"><label>filter (JSON, optional)</label>' +
          '<textarea id="query-filter">' + filterVal + '</textarea>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button data-act="run-query">run query</button>' +
          '<button class="ghost" data-act="query-clear">clear results</button>' +
        '</div>' +
        recordsHTML +
      '</div>' +
    '</section>';
  }

  // ---------- page: members ----------
  // Single page showing: own role + invite share, pending join requests
  // (with accept/decline), active members (with permission dropdown +
  // remove), and a stop-sharing big-red-button. The data source is
  // App.spaces[id].sharing, refreshed on entry by ensurePageData.
  function renderMembersPage(sp) {
    const data = sp.sharing;
    if (!data || data.loading) {
      return '<section class="card"><header><h3>members</h3>' +
        '<button class="ghost" data-act="sharing-refresh">refresh</button>' +
        '</header><div class="body"><p style="color:var(--muted);font-size:13px;margin:4px 0">loading…</p></div></section>';
    }
    const ownRole = (sp.info && sp.info.ownRole) || '';
    const isOwner = ownRole === 'owner';
    const isAdmin = ownRole === 'admin' || isOwner;

    return renderInvitesCard(sp, data, isAdmin) +
      renderJoinRequestsCard(sp, data, isAdmin) +
      renderMembersCard(sp, data, isAdmin) +
      (isOwner ? renderDangerZoneCard() : '');
  }

  function renderInvitesCard(sp, data, isAdmin) {
    const invites = data.invites || [];
    const inviteRows = invites.length === 0
      ? '<p style="color:var(--muted);font-size:12px;margin:4px 0">no active invites.</p>'
      : invites.map(inv =>
          '<div class="obj-row" style="cursor:default">' +
            '<span class="name" style="font:12px var(--mono)">' + escapeHTML(inv.recordId) + '</span>' +
            '<span class="row-meta">' +
              '<span class="pill">' + escapeHTML(inv.permission || 'none') + '</span>' +
              (isAdmin
                ? ' <button class="ghost" data-act="invite-revoke" data-id="' + escapeHTML(inv.recordId) + '">revoke</button>'
                : '') +
            '</span>' +
          '</div>'
        ).join('');
    const tokenBox = data.lastInviteToken
      ? '<div class="form-toggle" style="margin-top:8px">' +
          '<div class="field"><label>share this token (one-time display)</label>' +
            '<textarea readonly rows="3">' + escapeHTML(data.lastInviteToken) + '</textarea>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button class="ghost" data-act="invite-copy">copy to clipboard</button>' +
            '<button class="ghost" data-act="invite-token-clear">close</button>' +
          '</div>' +
        '</div>'
      : '';
    return '<section class="card">' +
      '<header><h3>invites</h3>' +
        '<div class="row" style="gap:6px">' +
          '<button class="ghost" data-act="sharing-refresh">refresh</button>' +
          (isAdmin ? '<button data-act="invite-create">+ new invite</button>' : '') +
          (isAdmin && invites.length > 0 ? '<button class="danger" data-act="invite-revoke-all">revoke all</button>' : '') +
        '</div>' +
      '</header>' +
      '<div class="body">' +
        inviteRows +
        tokenBox +
      '</div>' +
    '</section>';
  }

  function renderJoinRequestsCard(sp, data, isAdmin) {
    const reqs = data.requests || [];
    if (!isAdmin && reqs.length === 0) return '';
    const rows = reqs.length === 0
      ? '<p style="color:var(--muted);font-size:12px;margin:4px 0">no pending requests.</p>'
      : reqs.map(r => {
          const display = r.name ? r.name : '(no name)';
          const permPicker = isAdmin
            ? '<select data-input="accept-perm:' + escapeHTML(r.recordId) + '">' +
                SHARE_PERMS.map(p =>
                  '<option value="' + escapeHTML(p) + '"' +
                    (p === 'writer' ? ' selected' : '') + '>' + escapeHTML(p) + '</option>'
                ).join('') +
              '</select>'
            : '';
          const actions = isAdmin
            ? '<button data-act="acl-accept" data-id="' + escapeHTML(r.recordId) + '">accept</button>' +
              ' <button class="ghost" data-act="acl-decline" data-id="' + escapeHTML(r.identity) + '">decline</button>'
            : '';
          return '<div class="obj-row" style="cursor:default">' +
            '<div>' +
              '<div class="name">' + escapeHTML(display) + '</div>' +
              '<div class="row-meta" style="margin-top:2px">' + escapeHTML(r.identity) + '</div>' +
            '</div>' +
            '<span class="row-meta">' + permPicker + ' ' + actions + '</span>' +
          '</div>';
        }).join('');
    return '<section class="card">' +
      '<header><h3>join requests</h3>' +
        '<span class="pill">' + reqs.length + '</span>' +
      '</header>' +
      '<div class="body">' + rows + '</div>' +
    '</section>';
  }

  function renderMembersCard(sp, data, isAdmin) {
    const members = (data.members || []).slice().sort((a, b) => {
      // Owners first, then by name/identity.
      if ((a.permission === 'owner') !== (b.permission === 'owner')) {
        return a.permission === 'owner' ? -1 : 1;
      }
      const an = (a.name || a.identity || '').toLowerCase();
      const bn = (b.name || b.identity || '').toLowerCase();
      return an.localeCompare(bn);
    });
    const rows = members.length === 0
      ? '<p style="color:var(--muted);font-size:12px;margin:4px 0">no members.</p>'
      : members.map(m => {
          const display = m.name ? m.name : shortId(m.identity);
          const isMe = m.identity === App.accountId;
          const isMemberOwner = m.permission === 'owner';
          // The dropdown is hidden for the owner row (cannot demote)
          // and for non-active rows. Read-only viewers also see no
          // dropdown.
          const canEdit = isAdmin && !isMemberOwner && m.status === 'active';
          const permPicker = canEdit
            ? '<select data-input="member-perm:' + escapeHTML(m.identity) + '">' +
                SHARE_PERMS.map(p =>
                  '<option value="' + escapeHTML(p) + '"' +
                    (p === m.permission ? ' selected' : '') + '>' + escapeHTML(p) + '</option>'
                ).join('') +
              '</select>'
            : '<span class="pill">' + escapeHTML(m.permission || 'none') + '</span>';
          const removeBtn = canEdit
            ? ' <button class="danger" data-act="acl-remove" data-id="' + escapeHTML(m.identity) + '">remove</button>'
            : '';
          const applyBtn = canEdit
            ? ' <button class="ghost" data-act="acl-grant" data-id="' + escapeHTML(m.identity) + '">apply</button>'
            : '';
          return '<div class="obj-row" style="cursor:default">' +
            '<div>' +
              '<div class="name">' + escapeHTML(display) +
                (isMe ? ' <span class="pill">you</span>' : '') +
                ' <span class="pill">' + escapeHTML(m.status || 'unknown') + '</span>' +
              '</div>' +
              '<div class="row-meta" style="margin-top:2px">' + escapeHTML(m.identity) + '</div>' +
            '</div>' +
            '<span class="row-meta">' + permPicker + applyBtn + removeBtn + '</span>' +
          '</div>';
        }).join('');
    return '<section class="card">' +
      '<header><h3>members</h3>' +
        '<span class="pill">' + members.length + '</span>' +
      '</header>' +
      '<div class="body">' + rows + '</div>' +
    '</section>';
  }

  // renderSettingsPage shows the live name / description / icon
  // fields backed by the in-space spaceIndex object. Non-owners /
  // non-writers see read-only values (the SDK accepts the write but
  // the peers reject it — easier to gate up-front).
  function renderSettingsPage(sp) {
    const info = sp.info || {};
    const ownRole = info.ownRole || '';
    const canEdit = ownRole === 'owner' || ownRole === 'admin' || ownRole === 'writer';
    const idxObj = info.spaceIndexObjectId || '';
    const idxRow = idxObj
      ? '<div class="field"><label>spaceIndex object id</label>' +
          '<input type="text" readonly value="' + escapeHTML(idxObj) + '" style="font:12px var(--mono)"></div>'
      : '';
    const fields = canEdit
      ? '<div class="field"><label>name</label>' +
          '<input type="text" id="settings-name" value="' + escapeHTML(info.name || '') + '"></div>' +
        '<div class="field"><label>description</label>' +
          '<input type="text" id="settings-description" value="' + escapeHTML(info.description || '') + '"></div>' +
        '<div class="field"><label>icon CID</label>' +
          '<input type="text" id="settings-icon-cid" value="' + escapeHTML(info.iconCid || '') + '" style="font:12px var(--mono)"></div>' +
        '<div class="form-actions">' +
          '<button data-act="space-save-metadata">save</button>' +
          '<button class="ghost" data-act="space-reset-metadata">reset</button>' +
        '</div>'
      : '<div class="field"><label>name</label><input type="text" readonly value="' + escapeHTML(info.name || '') + '"></div>' +
        '<div class="field"><label>description</label><input type="text" readonly value="' + escapeHTML(info.description || '') + '"></div>' +
        '<div class="field"><label>icon CID</label><input type="text" readonly value="' + escapeHTML(info.iconCid || '') + '" style="font:12px var(--mono)"></div>' +
        '<p style="color:var(--muted);font-size:12px;margin:8px 0 0">read-only: your role is <code>' +
          escapeHTML(ownRole || 'none') + '</code>.</p>';
    return '<section class="card">' +
      '<header><h3>metadata</h3>' +
        '<span class="pill">' + (canEdit ? 'editable' : 'read-only') + '</span>' +
      '</header>' +
      '<div class="body">' +
        '<p style="color:var(--muted);font-size:12px;margin:0 0 8px">' +
          'name / description / icon are CRDT-replicated to every member via the in-space <code>spaceIndex</code> object. ' +
          'spaceType is pinned by create and not editable.' +
        '</p>' +
        fields +
        idxRow +
      '</div>' +
    '</section>';
  }

  // ---------- page: debug (sync-status + diagnostic snapshots) ----------
  // Two surfaces side-by-side: production /sync-status (stable, cheap)
  // and /debug (diagnostic, not stable). Both are space-level on top;
  // a single lookup field below covers per-object reads on either.
  function renderDebugPage(sp) {
    const obj = sp.sync.lastObjectId || '';
    return renderSyncStatusSpaceCard(sp) +
      renderSpaceDebugCard(sp) +
      renderDebugObjectLookupCard(sp, obj);
  }

  function syncStatePill(state) {
    const s = state || 'unknown';
    const colorMap = {
      synced:  ['#1f6f43', '#a4e9bf'],
      syncing: ['#7a5a00', '#ffe39a'],
      error:   ['#7a1f1f', '#ffb3b3'],
      offline: ['#444',    '#dcdcdc'],
      unknown: ['#555',    '#e8e8e8'],
    };
    const [bg, fg] = colorMap[s] || colorMap.unknown;
    return '<span class="pill" style="background:' + fg + ';color:' + bg + ';border-color:' + bg + '">' +
      escapeHTML(s) + '</span>';
  }

  function renderSyncStatusSpaceCard(sp) {
    const live = sp.sync.live;
    const liveBtn = '<button class="ghost" data-act="debug-toggle-live" id="debug-live-btn">' +
      (live ? '● live' : '○ live') + '</button>';
    return '<section class="card" id="debug-sync-card">' +
      '<header><h3>sync status <span class="pill">production</span></h3>' +
        '<div class="row" style="gap:6px">' +
          liveBtn +
          '<button class="ghost" data-act="debug-reload-sync">reload</button>' +
        '</div>' +
      '</header>' +
      '<div class="body" id="debug-sync-body">' + renderSyncStatusSpaceBody(sp) + '</div>' +
    '</section>';
  }

  // renderSyncStatusSpaceBody renders only the inner body — used by
  // both the initial render and the SSE update path so we can swap
  // innerHTML without clobbering surrounding inputs.
  function renderSyncStatusSpaceBody(sp) {
    const s = sp.sync.space;
    const lagged = sp.sync.laggedTotal || 0;
    if (!s) return '<p style="color:var(--muted);font-size:13px;margin:4px 0">not loaded — press reload.</p>';
    const last = s.lastSyncedAt && !s.lastSyncedAt.startsWith('0001')
      ? escapeHTML(s.lastSyncedAt) : '<span style="color:var(--muted)">never</span>';
    return '<div class="row" style="gap:14px;flex-wrap:wrap;align-items:center">' +
        '<div>state: ' + syncStatePill(s.state) + '</div>' +
        '<div>objects: <strong>' + s.synced + '</strong>/' + s.total + ' synced</div>' +
        '<div>peers: <strong>' + s.networkPeers + '</strong></div>' +
        '<div>last synced: <span style="font:12px var(--mono)">' + last + '</span></div>' +
      '</div>' +
      (lagged > 0
        ? '<p style="color:var(--err);font-size:12px;margin:8px 0 0">' +
            'live stream dropped ' + lagged + ' event(s) — re-reload for current state.</p>'
        : '');
  }

  function renderSpaceDebugCard(sp) {
    const body = (() => {
      const d = sp.sync.debug;
      if (!d) return '<p style="color:var(--muted);font-size:13px;margin:4px 0">not loaded — press reload.</p>';
      const peers = d.peers || [];
      if (peers.length === 0) {
        return '<p style="color:var(--muted);font-size:12px;margin:4px 0">' +
          'no diff round has completed yet — peers reset on every server restart.</p>';
      }
      const rows = peers.map(p => {
        const err = p.lastErr
          ? '<span style="color:var(--err)">' + escapeHTML(p.lastErr) + '</span>'
          : '<span style="color:var(--muted)">ok</span>';
        return '<tr>' +
          '<td style="font:12px var(--mono)" title="' + escapeHTML(p.peerId) + '">' + escapeHTML(shortId(p.peerId)) + '</td>' +
          '<td>' + p.new + '</td>' +
          '<td>' + p.changed + '</td>' +
          '<td style="font:12px var(--mono)">' + escapeHTML((p.lastSyncAt || '').slice(0, 19)) + '</td>' +
          '<td>' + err + '</td>' +
        '</tr>';
      }).join('');
