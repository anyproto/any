openapi: "3.1.0"
info:
  title: any HTTP API
  description: |
    HTTP/JSON API wrapping any-sync-sdk. Localhost-only, no auth in v1.
    All endpoints are under /v1/.
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:7001
    description: Default local server

paths:
  /v1/health:
    get:
      summary: Health check
      tags: [system]
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  account: { type: string }

  /v1/shutdown:
    post:
      summary: Graceful shutdown
      tags: [system]
      responses:
        "200":
          description: Shutting down

  /v1/account:
    get:
      summary: Get account info
      tags: [account]
      responses:
        "200":
          description: Account metadata

  /v1/spaces:
    get:
      summary: List all spaces
      tags: [spaces]
      responses:
        "200":
          description: Space list
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaces:
                    type: array
                    items: { $ref: "#/components/schemas/SpaceInfo" }
    post:
      summary: Create a new space
      tags: [spaces]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                spaceType: { type: string }
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceInfo" }

  /v1/spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: Get one space
      tags: [spaces]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceInfo" }
    patch:
      summary: Update space metadata (name, description, iconCid)
      tags: [spaces]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                iconCid: { type: string }
      responses:
        "204":
          description: Updated
    delete:
      summary: Delete a space
      tags: [spaces]
      responses:
        "204":
          description: Deleted

  /v1/spaces/join:
    post:
      summary: Join a space using an invite token
      tags: [spaces]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [inviteToken]
              properties:
                inviteToken: { type: string }
      responses:
        "201":
          description: Joined
        "202":
          description: Join request pending owner approval

  /v1/spaces/{spaceId}/objects:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    post:
      summary: Create an object
      tags: [objects]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                types:
                  type: array
                  items: { type: string }
                initialProperties:
                  type: object
                nav:
                  type: object
                  properties:
                    type: { type: integer, description: "1=item, 2=folder" }
                    parentId: { type: string }
                    pos: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectId: { type: string }

  /v1/spaces/{spaceId}/objects/query:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    post:
      summary: Query objects by filter
      tags: [objects]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter: { type: object }
                sort:
                  type: array
                  items: { type: string }
                limit: { type: integer }
                offset: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { type: object }

  /v1/spaces/{spaceId}/objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
    delete:
      summary: Delete an object
      tags: [objects]
      responses:
        "204":
          description: Deleted

  /v1/spaces/{spaceId}/objects/{objectId}/subscribe:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
      - name: dataset
        in: query
        required: true
        schema: { type: string }
    get:
      summary: Subscribe to CRDT events (SSE)
      tags: [subscribe]
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}

  /v1/spaces/{spaceId}/objects/{objectId}/editor/markdown:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
    get:
      summary: Get markdown content
      tags: [editor]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
    put:
      summary: Set markdown content
      tags: [editor]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: array, items: { type: string } }
                  updated: { type: array, items: { type: string } }
                  deleted: { type: array, items: { type: string } }
                  unchanged: { type: integer }

  /v1/spaces/{spaceId}/objects/{objectId}/editor/blocks:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
    get:
      summary: List editor blocks
      tags: [editor]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  records: { type: array, items: { type: object } }
    post:
      summary: Create a block
      tags: [editor]
      responses:
        "201":
          description: Block created

  /v1/spaces/{spaceId}/objects/{objectId}/chat/messages:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
    get:
      summary: List chat messages
      tags: [chat]
      parameters:
        - name: before
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      summary: Send a chat message
      tags: [chat]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                replyToMessageId: { type: string }
                fromAgent: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

  /v1/spaces/{spaceId}/objects/{objectId}/chat/messages/{msgId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
      - name: msgId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Edit a message (author only)
      tags: [chat]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      summary: Delete a message (author only)
      tags: [chat]
      responses:
        "204":
          description: Deleted

  /v1/spaces/{spaceId}/query:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    post:
      summary: Query a per-object dataset
      tags: [data]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [objectId, dataset]
              properties:
                objectId: { type: string }
                dataset: { type: string }
                filter: { type: object }
                sort: { type: array, items: { type: string } }
                limit: { type: integer }
                offset: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  records: { type: array, items: { type: object } }

  /v1/spaces/{spaceId}/modify:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    post:
      summary: Modify records in a dataset (CRDT ops)
      tags: [data]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [objectId, dataset, records]
              properties:
                objectId: { type: string }
                dataset: { type: string }
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      upsert: { type: boolean }
                      ops:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: ["$set", "$unset", "$inc", "$addToSet", "$pull"] }
                            path: { type: string }
                            value: {}
      responses:
        "200":
          description: Modify result

  /v1/spaces/{spaceId}/types:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: List types
      tags: [types]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items: { $ref: "#/components/schemas/TypeInfo" }
    post:
      summary: Create a type
      tags: [types]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  typeId: { type: string }

  /v1/spaces/{spaceId}/types/{typeId}/properties:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - name: typeId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List properties of a type
      tags: [types]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items: { $ref: "#/components/schemas/PropertyDef" }
    post:
      summary: Add a property to a type
      tags: [types]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                name: { type: string }
                xKey: { type: string }
                kind: { type: string, enum: [string, number, boolean, null, array, object] }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  propId: { type: string }

  /v1/spaces/{spaceId}/properties/{objectId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
    get:
      summary: Get object properties
      tags: [properties]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: { type: object }

  /v1/spaces/{spaceId}/properties/{objectId}/base/{typeId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - $ref: "#/components/parameters/objectId"
      - name: typeId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Set base properties on an object
      tags: [properties]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch: { type: object }
      responses:
        "200":
          description: Properties set

  /v1/spaces/{spaceId}/members:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: List space members
      tags: [members]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { type: object } }

  /v1/spaces/{spaceId}/members/me:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: Get own membership
      tags: [members]
      responses:
        "200":
          description: Own member info

  /v1/spaces/{spaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: List invites
      tags: [invites]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        recordId: { type: string }
                        permission: { type: string }
    post:
      summary: Create an invite
      tags: [invites]
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaceId: { type: string }
                  inviteToken: { type: string }
        "409":
          description: Invite already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      summary: Revoke all invites
      tags: [invites]
      responses:
        "204":
          description: All invites revoked

  /v1/spaces/{spaceId}/invites/{recordId}:
    parameters:
      - $ref: "#/components/parameters/spaceId"
      - name: recordId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a single invite
      tags: [invites]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordId: { type: string }
                  permission: { type: string }
        "404":
          description: Invite not found
    delete:
      summary: Revoke an invite
      tags: [invites]
      responses:
        "204":
          description: Invite revoked

  /v1/spaces/{spaceId}/sync-status:
    parameters:
      - $ref: "#/components/parameters/spaceId"
    get:
      summary: Get space sync status
      tags: [sync]
      responses:
        "200":
          description: Sync status rollup

  /v1/sync-status/subscribe:
    get:
      summary: Subscribe to account-wide sync status (SSE)
      tags: [sync]
      responses:
        "200":
          description: SSE stream

components:
  parameters:
    spaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string }
    objectId:
      name: objectId
      in: path
      required: true
      schema: { type: string }

  schemas:
    SpaceInfo:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [unknown, active, joining, leaving, deleted, remote_dead] }
        ownRole: { type: string }
        createdAt: { type: string, format: date-time }
        spaceIndexObjectId: { type: string }

    ChatMessage:
      type: object
      properties:
        id: { type: string }
        creator: { type: string }
        createdAt: { type: integer }
        modifiedAt: { type: integer }
        text: { type: string }
        fromAgent: { type: string }
        replyToMessageId: { type: string }
        reactions: { type: object }

    TypeInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        builtIn: { type: boolean }

    PropertyDef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        xKey: { type: string }
        kind: { type: string }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
