name: release-sdk

# Tag-driven release channel: build any-sdk for every platform, publish a
# GitHub Release, then trigger the any-ui (Any) desktop build against it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the Release

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Never run from a fork; secrets must not be exposed.
    if: github.repository == 'anyproto/any'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum
      - name: Install jq + unzip
        run: sudo apt-get update && sudo apt-get install -y jq unzip
      - name: Build any-sdk for all platforms
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in darwin-arm64 darwin-x64 linux-x86_64 windows-x86_64; do
            scripts/build-sdk.sh "$p" dist
          done
          ls -la dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/any-sdk-*.tar.gz \
            --title "any-sdk $GITHUB_REF_NAME" \
            --notes "any-sdk release $GITHUB_REF_NAME (llama.cpp $(sed -n 's/^LLAMACPP_VERSION := //p' Makefile))."
      - name: Trigger any-ui desktop build
        env:
          GH_TOKEN: ${{ secrets.ANY_UI_DISPATCH_TOKEN }}
        run: |
          gh api repos/anyproto/any-ui/dispatches \
            -f event_type=any-sdk-published \
            -f "client_payload[version]=$GITHUB_REF_NAME" \
            -f "client_payload[channel]=release"
