name: release-sdk

# Tag-driven release channel → the shared _build-sdk reusable workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call:
    uses: ./.github/workflows/_build-sdk.yml
    with:
      tag: ${{ github.ref_name }}
      channel: release
    secrets:
      ANY_CI_TOKEN: ${{ secrets.ANY_CI_TOKEN }}
