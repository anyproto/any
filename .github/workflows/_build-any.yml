name: _build-any

# Reusable workflow (called by release-any + nightly-any): build `any` for the
# publishable platforms — desktop tarballs, Android (any.aar), iOS
# (any.xcframework.zip) — then publish whatever built in ONE GitHub Release,
# marked partial when a platform is missing, and tell each client repo either
# that its asset is there or that its build failed.
#
# Shape: fan-out / fan-in (7 jobs).
#   version  (ubuntu)                      resolve vX.Y.Z | v<base>-nightly.<date>.<n>
#   desktop  (ubuntu,  needs: version)     build-any.sh per published target → upload-artifact tarballs
#   desktop-smoke (macos-15, needs: desktop)  run the darwin binaries for real
#            (sandbox runs + no-Caches-extraction probe, arm64 + Rosetta x86_64)
#   android  (ubuntu,  needs: version)     NDK + make build-android → upload-artifact any.aar
#   ios      (macos-15, needs: version)    build-xcframework.sh   → upload-artifact any.xcframework.zip
#   publish  (ubuntu, needs: every leg, runs when ≥1 platform passed, contents:write)
#            verify the PASSED platforms' assets against their legs' digests,
#            aggregate them into SHA256SUMS → ONE `gh release create`
#            (partial marker first when a platform is missing)
#            → repository_dispatch any-published to each client whose platform shipped
#   notify-failed (ubuntu, needs: publish, gated on !cancelled())
#            → repository_dispatch any-build-failed to each client that got no any-published
#
# One `version` job, threaded to every build, so all artifacts stamp an
# IDENTICAL version (no per-platform drift). iOS rides the same v* tag as
# desktop/Android — no self-tag, no separate version scheme. Build logic lives
# in scripts/makefiles (build-any.sh, build-xcframework.sh, makefiles/android.mk);
# the YAML stays thin. Private-module auth is the shared go-private-auth
# composite action.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag for the release channel (a v* tag); ignored for prerelease, which computes a dated v<base>-nightly.<YYYYMMDD>.<n> tag.'
        type: string
        required: true
      channel:
        description: 'release | prerelease — drives the dispatch payload + whether it is a prerelease.'
        type: string
        required: true
    secrets:
      ANY_CI_TOKEN:
        description: 'Classic repo PAT (read+write across anyproto): fetch private Go modules during the build AND dispatch the client builds (any-ui, anytype-swift, any-kotlin).'
        required: true

# No top-level write permission: only `publish` creates the Release. The build
# jobs are read-only.
permissions:
  contents: read

jobs:
  # Resolve the single version string every other job stamps. Runs alone so
  # there is no per-platform version drift.
  version:
    # Never run from a fork; secrets must not be exposed.
    if: github.repository == 'anyproto/any'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      TAG: ${{ inputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git tag -l / git describe need all tags + history
          persist-credentials: false
      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = prerelease ]; then
            # Sortable SemVer prerelease of the NEXT version:
            #   v<latest-release + patch>-nightly.<YYYYMMDD>.<n-th build that day>
            latest="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)" || true
            base="${latest:-v0.0.0}"; base="${base#v}"
            IFS=. read -r MA MI PA <<<"$base"
            day="$(date -u +%Y%m%d)"
            n="$(( $(git tag -l "v*-nightly.${day}.*" | wc -l | tr -d ' ') + 1 ))"
            version="v${MA}.${MI}.$((PA + 1))-nightly.${day}.${n}"
          else
            version="$TAG" # the pushed release tag (vX.Y.Z)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

  # Desktop: CGO-free cross-compiled tarballs via build-any.sh.
  desktop:
    needs: version
    if: github.repository == 'anyproto/any'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build-any.sh recomputes COMMIT/DATE from git
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # track go.mod's `go` directive — no drift
          cache-dependency-path: go.sum
      - uses: ./.github/actions/go-private-auth
        with:
          token: ${{ secrets.ANY_CI_TOKEN }}
      - name: Validate the usecase catalog
        run: make catalog-validate
      - name: Build any for published desktop platforms
        env:
          ANY_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # darwin *-sandbox: same payload, system libffi — docs/18-ci.md.
          platforms=(
            darwin-arm64
            darwin-x64
            darwin-arm64-sandbox
            darwin-x64-sandbox
            linux-x86_64
            windows-x86_64
          )
          for p in "${platforms[@]}"; do
            scripts/build-any.sh "$p" dist
            # The swagger regen is platform-invariant (~6s); the first build
            # produced it, the rest reuse it.
            export ANY_SKIP_SWAG=1
          done
          # Hash what was BUILT, beside each tarball, in sha256sum format with
          # the bare name. publish verifies these on download and aggregates them
          # into the SHA256SUMS release asset; nothing downstream rehashes
          # (scripts/release-fanin.sh).
          (cd dist && for f in any-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-tarballs
          path: |
            dist/any-*.tar.gz
            dist/any-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      # The darwin subset again under its own name: desktop-smoke consumes 4
      # of the 6 tarballs and download-artifact cannot filter inside an
      # artifact — this keeps the linux/windows payloads off the macOS runner
      # on the publish critical path.
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-tarballs
          path: dist/any-*-darwin-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Smoke: execute the darwin binaries on a real Mac. The -sandbox variant
  # exists precisely so ffi's pre-main dlopen survives macOS library
  # validation, and that is a RUNTIME property the desktop job — cross-
  # compiling on Linux, never running what it builds — cannot see. `any
  # version` is enough: ffi's init runs at process start, so a missing
  # symbol or a failed load panics before the version prints.
  #
  # Asserted: both -sandbox binaries run (arm64 natively, x86_64 under
  # Rosetta 2, which resolves ffi's symbols against the x86_64 shared-cache
  # libffi) and never create ffi's Caches extraction dir — extract-and-
  # dlopen is exactly what breaks sandboxed consumers. The plain binary is
  # the probe's control: it must create that dir, or the probe is watching
  # a stale path.
  #
  # NOT asserted: a library-validation denial. The GH macOS images do not
  # enforce it for an ad-hoc host — an ad-hoc hardened-runtime binary
  # dlopens the ad-hoc extracted dylib there without complaint (probed
  # 2026-08-13) — so a plain-binary panic cannot be required in CI. The
  # real consumer regime (a Team-ID-signed, App-Sandboxed helper) is
  # covered by any-swift's own in-sandbox verification. Still open:
  # oldest-supported macOS and native (non-Rosetta) x86_64 —
  # docs/18-ci.md § The darwin `-sandbox` variants.
  desktop-smoke:
    needs: desktop
    if: github.repository == 'anyproto/any'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: darwin-tarballs
          path: dist
      - name: Run the darwin binaries, probe ffi's extraction dir
        run: |
          set -euo pipefail
          # For the record alongside the probes below (library-validation
          # enforcement rides on SIP).
          csrutil status || true
          # Globs, not reconstructed names: the darwin-x64 platform token
          # maps to the x86_64 file label, and desktop built exactly one
          # version — track whatever it produced.
          extract() { # <tarball> <dir> — the glob expands at the call site
            mkdir -p "$2"
            tar -xzf "$1" -C "$2"
            codesign --force --options runtime -s - "$2/any"
          }
          extract dist/any-*-darwin-arm64-sandbox.tar.gz arm64-sandbox
          extract dist/any-*-darwin-x86_64-sandbox.tar.gz x64-sandbox
          extract dist/any-*-darwin-arm64.tar.gz arm64-plain
          FFI_CACHE="$HOME/Library/Caches/github.com/jupiterrider"
          rm -rf "$FFI_CACHE"
          # Positive: a pre-main panic exits non-zero and fails the job
          # here, not in a consumer's signed helper after the release ships.
          arm64-sandbox/any version
          arch -x86_64 x64-sandbox/any version
          # ...and both must have run WITHOUT ffi's extract-and-dlopen path.
          if [ -e "$FFI_CACHE" ]; then
            echo "::error::a sandbox binary extracted libffi into Caches — ffi_no_embed did not take at runtime"
            exit 1
          fi
          # Probe control: the plain binary must create the dir (on an
          # LV-enforcing host it also panics right after — not asserted
          # here, see the job comment).
          arm64-plain/any version || true
          if [ ! -e "$FFI_CACHE" ]; then
            echo "::error::the plain binary did not create ffi's Caches dir — the extraction probe is watching a stale path"
            exit 1
          fi

  # Android: arm64-v8a any.aar via gomobile bind (makefiles/android.mk).
  android:
    needs: version
    if: github.repository == 'anyproto/any'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # LDFLAGS stamps COMMIT/DATE from git
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/go-private-auth
        with:
          token: ${{ secrets.ANY_CI_TOKEN }}
      - name: Install Android NDK
        run: |
          set -euo pipefail
          # Installed by the job, never read off the runner image: GitHub
          # dropped the NDK 28 line from ubuntu-24.04 on 2026-10-01
          # (actions/runner-images#14796) and two nightlies failed at the old
          # `ls -d "$ANDROID_HOME"/ndk/28.*` before anyone noticed. Latest
          # stable on Google's SDK repository as of 2026-10-10 (r30). Export
          # ALL THREE NDK env vars — different gomobile/NDK versions probe
          # different ones — BEFORE `make build-android`, since `gomobile init`
          # needs them to locate the toolchain.
          # stdin from /dev/null: an unaccepted licence prompt fails here
          # instead of hanging to the job timeout. Not `yes |` — under
          # pipefail the SIGPIPE from `yes` reads as a failed install.
          # `platforms;android-26` is pinned the same way: gomobile resolves
          # android.jar from $ANDROID_HOME/platforms for `-androidapi 26`
          # (makefiles/android.mk), and an image that drops its platforms
          # would break this leg exactly as the NDK did. Still image-provided,
          # by necessity: `sdkmanager` itself (it IS the installer) and the
          # JDK it runs on — both exercised by this very step, so their
          # absence fails here, loudly, not later.
          NDK_VERSION=30.0.16248370
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-26" < /dev/null
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          # Both probes name the missing path: a bare `test` under set -e exits
          # with no message, and sdkmanager can exit 0 having skipped a package.
          # aarch64-linux-android26-clang is the wrapper gomobile actually stats
          # for `-androidapi 26` (makefiles/android.mk), not bare clang.
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [ -x "$CLANG" ] || { echo "::error::Android NDK $NDK_VERSION did not install: $CLANG is missing (sdkmanager exited 0)"; exit 1; }
          JAR="$ANDROID_HOME/platforms/android-26/android.jar"
          [ -f "$JAR" ] || { echo "::error::platforms;android-26 did not install: $JAR is missing (sdkmanager exited 0)"; exit 1; }
          echo "Using Android NDK: $NDK"
          {
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
      - name: Build any.aar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Pass the resolved version/commit/date as make COMMAND-LINE overrides
          # — the only thing that beats the Makefile's `:=` LDFLAGS assignment
          # (env vars do NOT override `:=`). See docs/plans Technical Details.
          make build-android \
            VERSION="$VERSION" \
            COMMIT="$(git rev-parse --short HEAD)" \
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The leg's own digest of what it built — see the desktop job.
          (cd dist/android && sha256sum any.aar > any.aar.sha256)
          ls -la dist/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-aar
          path: |
            dist/android/any.aar
            dist/android/any.aar.sha256
          if-no-files-found: error
          retention-days: 7

  # iOS: device + simulator c-archive slices → any.xcframework.zip
  # (scripts/build-xcframework.sh). macOS runner (one job = one runner OS).
  ios:
    needs: version
    if: github.repository == 'anyproto/any'
    # NOTE: requires the iOS 26 SDK (deployment target 26.0), which ships with
    # Xcode 26. The SDK-verify step below fails loudly if the image lacks it —
    # bump the runner image (e.g. to macos-26) if needed.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build-xcframework.sh git describe fallback + COMMIT/DATE
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/go-private-auth
        with:
          token: ${{ secrets.ANY_CI_TOKEN }}
      - name: Select latest Xcode and verify iOS 26 SDK
        run: |
          set -euo pipefail
          # SC2012: Xcode app bundle names are installer-controlled (Xcode_*.app),
          # no non-alphanumeric filenames — ls -d | sort -V is the right tool.
          # shellcheck disable=SC2012
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK version: $SDK"
          case "$SDK" in
            26.*) echo "iOS 26 SDK present." ;;
            *) echo "::error::iOS 26 SDK required (deployment target 26.0); runner has $SDK. Use a runner image with Xcode 26."; exit 1 ;;
          esac
      - name: Gate on mobile shim tests
        # Both shims, on the one runner that has a Go toolchain and no NDK to
        # wait for. The android suite is behind `-tags gomobile` (mobile.go is
        # `android || gomobile`), so without the tag it builds nothing and goes
        # green having run zero tests.
        run: |
          set -euo pipefail
          go test -count=1 ./mobile/ios/
          go test -count=1 -tags gomobile ./mobile/android/
      - name: Build any.xcframework.zip
        env:
          ANY_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/build-xcframework.sh dist
          # The leg's own digest of what it built — see the desktop job. shasum
          # on macOS writes the same `digest  name` line sha256sum -c reads.
          (cd dist && shasum -a 256 any.xcframework.zip > any.xcframework.zip.sha256)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: ios-xcframework
          path: |
            dist/any.xcframework.zip
            dist/any.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # Fan-in over whatever BUILT. `!cancelled()` instead of the implicit
  # all-success gate: one red leg must not skip the publish of the green ones
  # (spec R2). desktop counts only with its smoke green; every decision below
  # is scripts/release-fanin.sh, tested by `make test-scripts`.
  publish:
    needs: [version, desktop, desktop-smoke, android, ios]
    if: >-
      ${{ !cancelled() && github.repository == 'anyproto/any'
          && needs.version.result == 'success'
          && ((needs.desktop.result == 'success' && needs.desktop-smoke.result == 'success')
              || needs.android.result == 'success'
              || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only THIS job creates the Release
    outputs:
      published_clients: ${{ steps.notify.outputs.published_clients }}
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.version.outputs.version }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      DESKTOP_SMOKE_RESULT: ${{ needs.desktop-smoke.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1 # no git history needed here — reads only the Makefile pin + downloaded artifacts
          persist-credentials: false
      - name: Download every artifact the run produced
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect the passed platforms' assets
        run: scripts/release-fanin.sh collect artifacts dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Notes: the R2 partial marker first when a platform is missing, then
          # the sectioned asset list (`<name>` sha256: `<sha>`, or `not built`),
          # then the llama.cpp pin. gh appends its auto "What's Changed" after.
          notes="$(scripts/release-fanin.sh notes dist)"
          # Per-channel flags: a nightly creates a NEW unique, sortable prerelease
          # tag at this commit (--target); a release reuses the human-pushed vX.Y.Z tag.
          flags=(--title "any $VERSION" --notes "$notes" --generate-notes)
          if [ "$CHANNEL" = prerelease ]; then
            flags+=(--prerelease --target "$GITHUB_SHA")
          fi
          gh release create "$VERSION" dist/* "${flags[@]}"
      - name: Notify the clients whose platform shipped
        id: notify
        env:
          GH_TOKEN: ${{ secrets.ANY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ANY_CI_TOKEN not set — skipping client dispatches."
            echo "published_clients=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Best-effort: a failed dispatch must NOT fail the (already-published)
          # release. any-ui gets version + channel; the mobile clients also get
          # their asset name + sha256 to pin.
          scripts/release-fanin.sh publish-dispatch dist "$GITHUB_OUTPUT"

  # The invariant (spec R4): a run that ends without sending any-published to a
  # client sends that client any-build-failed — a red leg, a red version job,
  # or a publish that failed (before OR after the release was created: a crash
  # after `gh release create` leaves published_clients empty, and the release
  # is then on GitHub with nobody told to build it). Gated on `!cancelled()`,
  # NOT `always()`: always() would run on a cancelled run too, read every leg as
  # `cancelled`, and tell all three clients a build failed that a newer run
  # merely superseded. A cancelled run is one accepted silence; an unset
  # ANY_CI_TOKEN (warned below) is the other. One event per client, carrying
  # that client's platform.
  notify-failed:
    needs: [version, desktop, desktop-smoke, android, ios, publish]
    if: ${{ !cancelled() && github.repository == 'anyproto/any' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.version.outputs.version || 'unresolved' }}
      VERSION_RESULT: ${{ needs.version.result }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      DESKTOP_SMOKE_RESULT: ${{ needs.desktop-smoke.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PUBLISHED_CLIENTS: ${{ needs.publish.outputs.published_clients }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Tell every client that got no any-published
        env:
          GH_TOKEN: ${{ secrets.ANY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ANY_CI_TOKEN not set — skipping client dispatches."
            exit 0
          fi
          scripts/release-fanin.sh fail-dispatch
