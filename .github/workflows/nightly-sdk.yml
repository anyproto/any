name: nightly-sdk

# Dogfood channel (cron + manual) → the shared _build-sdk reusable workflow,
# publishing a rolling `nightly` prerelease.
on:
  schedule:
    - cron: '0 3 * * *' # ~03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-sdk
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/_build-sdk.yml
    with:
      tag: nightly
      channel: prerelease
    secrets:
      ANY_UI_DISPATCH_TOKEN: ${{ secrets.ANY_UI_DISPATCH_TOKEN }}
